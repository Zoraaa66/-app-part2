<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swiss Diary 2026</title>
    <!-- 使用 CDN 加載工具，確保功能完整 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #CFC8B3; color: #1C1912; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .date-active { background-color: #3B82F6; color: white; border-color: white; transform: scale(1.1); font-weight: 900; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .drag-over { border: 4px dashed #3B82F6 !important; opacity: 0.5; }
        .running-man { animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    </style>
</head>
<body class="min-h-screen pb-40 overflow-x-hidden select-none">

    <!-- 頂部標題列 (標題可編輯) -->
    <header class="sticky top-0 z-50 bg-[#CFC8B3]/95 backdrop-blur-xl px-6 py-10 flex justify-between items-center border-b-[3px] border-black/10 shadow-2xl">
        <div class="flex items-center gap-5">
            <div class="w-16 h-16 bg-[#1C1912] rounded-[2.2rem] flex items-center justify-center text-[#CFC8B3] shadow-xl rotate-3 border-4 border-white/10">
                <i data-lucide="map"></i>
            </div>
            <div>
                <input id="trip-title" type="text" value="SWISS 2026" onchange="saveTripTitle(this.value)" class="bg-transparent font-black text-4xl tracking-tighter w-full outline-none border-none focus:text-blue-600 transition-colors">
                <p class="text-[11px] text-blue-600 font-black uppercase tracking-[0.7em] opacity-80">Shared Diary</p>
            </div>
        </div>
        <button onclick="openAddModal()" class="bg-[#A7B09E] text-white w-16 h-16 rounded-[1.8rem] shadow-2xl flex items-center justify-center border-[5px] border-white active:scale-50 transition-all">
            <i data-lucide="plus" class="stroke-[4px] w-8 h-8"></i>
        </button>
    </header>

    <main id="app-content" class="px-6 py-8 max-w-lg mx-auto">
        <!-- 內容動態填充 -->
    </main>

    <!-- 底部導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1C1912]/98 backdrop-blur-3xl px-4 py-8 flex justify-around items-center z-[60] rounded-t-[4rem] shadow-[0_-30px_100px_rgba(0,0,0,0.6)] border-t border-white/10 max-w-lg mx-auto">
        <button onclick="switchTab('schedule')" class="nav-btn flex flex-col items-center gap-2 text-white/30 transition-all" id="btn-schedule">
            <i data-lucide="calendar"></i>
            <span class="text-[10px] font-black uppercase tracking-widest">行程</span>
        </button>
        <button onclick="switchTab('booking')" class="nav-btn flex flex-col items-center gap-2 text-white/30 transition-all" id="btn-booking">
            <i data-lucide="credit-card"></i>
            <span class="text-[10px] font-black uppercase tracking-widest">憑證</span>
        </button>
        <button onclick="switchTab('expense')" class="nav-btn flex flex-col items-center gap-2 text-white/30 transition-all" id="btn-expense">
            <i data-lucide="wallet"></i>
            <span class="text-[10px] font-black uppercase tracking-widest">記帳</span>
        </button>
        <button onclick="switchTab('planning')" class="nav-btn flex flex-col items-center gap-2 text-white/30 transition-all" id="btn-planning">
            <i data-lucide="check-square"></i>
            <span class="text-[10px] font-black uppercase tracking-widest">準備</span>
        </button>
    </nav>

    <!-- 萬能彈窗 Modal -->
    <div id="modal-overlay" class="fixed inset-0 z-[100] hidden flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="bg-[#F7F4EB] w-full max-w-lg rounded-t-[3.5rem] sm:rounded-[3.5rem] p-8 shadow-2xl overflow-y-auto max-h-[90vh] border-t-8 border-blue-500 border-x-[6px] border-white relative">
            <div class="flex justify-between items-center mb-8">
                <h2 id="modal-title" class="text-3xl font-black text-[#1C1912] tracking-tighter">標題</h2>
                <button onclick="closeModal()" class="p-3 bg-white rounded-full shadow-lg text-gray-400 active:scale-75 transition-all">✕</button>
            </div>
            <div id="modal-body" class="space-y-6"></div>
        </div>
    </div>

    <script>
        // --- 1. 核心數據 ---
        let currentTab = 'schedule';
        let currentActiveDay = '2026-03-18';
        let schedules = [
            { id: 1, date: '2026-03-18', time: '00:20', title: '台北 TPE (EK0387)', city: '台北', cat: 'flight', note: '啟程前往杜拜' },
            { id: 2, date: '2026-03-18', time: '12:25', title: '蘇黎世 ZRH 抵達 (EK0087)', city: '蘇黎世', cat: 'flight', note: '抵達瑞士機場' },
            { id: 3, date: '2026-03-18', time: '13:30', title: '火車：蘇黎世 → 因特拉肯', city: '因特拉肯', cat: 'transport', note: '車程約 2 小時' },
            { id: 4, date: '2026-03-19', time: '11:00', title: '少女峰 Jungfraujoch', city: '少女峰', cat: 'spot', note: '斯芬克斯觀景台' },
            { id: 5, date: '2026-03-27', time: '09:00', title: 'Gornergrat 齒軌火車', city: '策馬特', cat: 'transport' }
        ];
        let expenses = [
            { id: 1, title: '起司火鍋', amount: 120, currency: 'CHF', user: 'Zora' },
            { id: 2, title: '超市採買', amount: 45, currency: 'CHF', user: '小明' }
        ];
        let todos = [
            { id: 1, text: '機票開票', done: true },
            { id: 2, text: '瑞士通行證 STP 購入', done: false },
            { id: 3, text: '歐洲網卡/esim', done: false }
        ];
        let dailyFocus = { '2026-03-18': '抵達瑞士第一天，早點休息適應時差。' };

        const SWISS_DAYS = Array.from({length: 14}, (_, i) => ({
            id: `2026-03-${18+i}`,
            label: `Day ${i+1}`,
            date: `3/${18+i}`
        }));

        // --- 2. 導覽樣式更新函數 ---
        function updateNavStyles() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-400', 'scale-110');
                btn.classList.add('text-white/30');
            });
            const activeBtn = document.getElementById(`btn-${currentTab}`);
            if (activeBtn) {
                activeBtn.classList.replace('text-white/30', 'text-blue-400');
                activeBtn.classList.add('scale-110');
            }
        }

        // --- 3. 核心渲染 ---
        function render() {
            const container = document.getElementById('app-content');
            updateNavStyles();

            if (currentTab === 'schedule') {
                container.innerHTML = `
                    <!-- 天氣與記事本 -->
                    <div class="grid grid-cols-1 gap-4 mb-8 animate-fade-in">
                        <div class="bg-blue-500 rounded-[2.5rem] p-6 text-white shadow-xl flex justify-between items-center relative overflow-hidden">
                            <div class="z-10">
                                <p class="text-[10px] font-black uppercase opacity-60">Today's Weather</p>
                                <h3 class="text-2xl font-black">Interlaken 4°C</h3>
                                <p class="text-xs font-bold opacity-80">Sunny with light clouds</p>
                            </div>
                            <i data-lucide="sun" class="w-12 h-12 z-10 text-yellow-300"></i>
                            <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
                        </div>
                        <div class="bg-white/80 rounded-[2.5rem] p-6 border-[3px] border-white shadow-lg">
                            <p class="text-[9px] font-black uppercase text-blue-500 mb-2">Daily Focus / 記事本</p>
                            <textarea onblur="saveFocus(this.value)" class="bg-transparent w-full font-black text-xl outline-none resize-none placeholder-black/10 leading-tight" rows="2" placeholder="點擊記錄今日重點...">${dailyFocus[currentActiveDay] || ''}</textarea>
                        </div>
                    </div>

                    <!-- 日期選擇 -->
                    <div class="flex gap-4 overflow-x-auto pb-6 no-scrollbar touch-pan-x" id="date-scroll"></div>
                    
                    <div class="flex justify-between items-center mb-6 px-1">
                        <h2 class="text-2xl font-black tracking-tighter flex items-center gap-2"><i data-lucide="list" class="w-5 h-5"></i> 今日行程</h2>
                        <button onclick="openSwapModal()" class="text-[10px] font-black bg-white/80 px-4 py-2 rounded-full shadow-sm flex items-center gap-2 active:scale-90 border-2 border-white">
                            <i data-lucide="repeat" class="w-3 h-3"></i> 行程天數對調
                        </button>
                    </div>

                    <!-- 時間軸行程 -->
                    <div class="relative pl-14 space-y-8" id="schedule-container">
                        <div class="absolute left-[1.65rem] top-8 bottom-8 w-[3.5px] bg-[#1C1912]/10 rounded-full"></div>
                        <div id="items-list" class="space-y-8"></div>
                    </div>
                `;
                renderDates();
                renderItems();
            } else if (currentTab === 'booking') {
                renderBooking(container);
            } else if (currentTab === 'expense') {
                renderExpense(container);
            } else if (currentTab === 'planning') {
                renderPlanning(container);
            }
            lucide.createIcons();
        }

        function renderDates() {
            const scroll = document.getElementById('date-scroll');
            if (!scroll) return;
            scroll.innerHTML = SWISS_DAYS.map(day => `
                <button onclick="selectDay('${day.id}')" class="flex-shrink-0 flex flex-col items-center justify-center min-w-[75px] h-[75px] rounded-[2.2rem] transition-all border-[3.5px] ${day.id === currentActiveDay ? 'date-active' : 'bg-white/40 text-[#1C1912]/40 border-transparent'}">
                    <span class="text-[9px] uppercase mb-1 opacity-70">${day.label}</span>
                    <span class="text-base">${day.date}</span>
                </button>
            `).join('');
        }

        function renderItems() {
            const list = document.getElementById('items-list');
            if (!list) return;
            const items = schedules.filter(s => s.date === currentActiveDay);
            if (items.length === 0) {
                list.innerHTML = `<div class="py-20 text-center text-[#4A4433]/30 font-black italic">今日還沒有安排行程...</div>`;
                return;
            }
            list.innerHTML = items.map((item, idx) => `
                <div class="relative animate-fade-in" draggable="true" ondragstart="handleDragStart(${idx})" ondragover="event.preventDefault()" ondrop="handleDrop(${idx})">
                    <div class="absolute -left-[3.25rem] top-8 z-20 w-12 h-12 rounded-full border-[5px] border-[#CFC8B3] flex items-center justify-center shadow-xl bg-white active:bg-blue-500 group">
                        <span class="text-xl running-man">🏃</span>
                    </div>
                    <div class="bg-white rounded-[2.5rem] shadow-[12px_12px_0px_rgba(28,25,18,0.1)] border-[3px] border-[#4A4433] p-8 relative active:scale-95 transition-all ${item.cat === 'transport' ? 'bg-black/5 border-dashed border-gray-300 opacity-60' : ''}">
                        ${item.cat !== 'transport' ? `<div class="absolute top-0 right-0 w-5 h-full rounded-r-[2.2rem] ${getCatColor(item.cat)}"></div>` : ''}
                        <div class="flex flex-col gap-3">
                            <div class="flex justify-between items-start">
                                <span class="text-[10px] font-black bg-[#1C1912]/5 text-[#1C1912]/40 px-3 py-1 rounded-lg tracking-widest uppercase flex items-center gap-1">📍 ${item.city}</span>
                                <button onclick="deleteSchedule(${item.id})" class="text-red-500/20 hover:text-red-500 transition-colors p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                            <span class="text-sm font-black text-blue-600 font-mono tracking-tighter flex items-center gap-2"><i data-lucide="clock" class="w-3 h-3"></i> ${item.time}</span>
                            <h3 class="text-2xl font-black text-[#1C1912] leading-tight">${item.title}</h3>
                            ${item.note ? `<p class="text-[14px] text-[#1C1912]/60 font-bold italic border-l-[6px] border-[#1C1912]/10 pl-5 py-1 leading-relaxed bg-black/5 rounded-r-2xl">“ ${item.note} ”</p>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- 4. 分頁渲染 ---
        function renderBooking(container) {
            container.innerHTML = `
                <div class="space-y-10 animate-fade-in pb-20">
                    <h2 class="text-4xl font-black text-[#1C1912] px-2 flex items-center gap-4"><i data-lucide="layers" class="text-blue-600"></i> 航班憑證</h2>
                    <div class="bg-white rounded-[3.5rem] shadow-2xl overflow-hidden border-b-[15px] border-[#AA1D24] mb-8">
                        <div class="bg-[#AA1D24] p-10 text-white flex justify-between items-center font-black">
                            <div><p class="text-2xl tracking-tighter uppercase">阿聯酋航空 • 去程</p><p class="text-xs opacity-70">EK0387 / EK0087</p></div>
                            <div class="bg-black/20 px-4 py-2 rounded-2xl border border-white/20 text-sm">3/18 OK</div>
                        </div>
                        <div class="p-12 space-y-12 font-mono">
                            <div class="flex justify-between items-center border-b border-dashed border-gray-200 pb-8">
                                <div class="text-center"><p class="text-5xl font-black">TPE</p><p class="text-sm text-blue-600 font-bold mt-2">00:20</p></div>
                                <div class="flex flex-col items-center opacity-30"><i data-lucide="arrow-right" class="w-8 h-8"></i><p class="text-[10px]">9h 50m</p></div>
                                <div class="text-center opacity-40"><p class="text-5xl font-black">DXB</p><p class="text-sm mt-2">06:10</p></div>
                            </div>
                            <div class="flex justify-between items-center">
                                <div class="text-center opacity-40"><p class="text-5xl font-black">DXB</p><p class="text-sm mt-2">08:25</p></div>
                                <div class="flex flex-col items-center opacity-30"><i data-lucide="arrow-right" class="w-8 h-8"></i><p class="text-[10px]">7h 00m</p></div>
                                <div class="text-center"><p class="text-5xl font-black text-[#1C1912]">ZRH</p><p class="text-sm text-blue-600 font-bold mt-2">12:25</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderExpense(container) {
            const total = expenses.reduce((s, e) => s + e.amount, 0);
            container.innerHTML = `
                <div class="space-y-8 animate-fade-in">
                    <div class="bg-gradient-to-br from-[#1C1912] to-[#4A4433] rounded-[3.5rem] p-12 text-white shadow-2xl relative overflow-hidden">
                        <p class="text-[12px] font-black uppercase text-blue-400 mb-4 tracking-[0.5em]">Swiss Budget / 台幣換算</p>
                        <h2 class="text-7xl font-black tracking-tighter mb-8"><span class="text-2xl opacity-40">NT$</span> ${Math.round(total*36.8).toLocaleString()}</h2>
                        <div class="grid grid-cols-2 gap-4 border-t border-white/10 pt-8 font-mono">
                            <div><p class="text-[10px] opacity-40">法郎 1 : 36.8</p></div><div><p class="text-[10px] opacity-40">歐元 1 : 35.1</p></div>
                        </div>
                        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/5 rounded-full blur-3xl"></div>
                    </div>
                    <div class="space-y-4">
                        ${expenses.map(e => `
                            <div class="bg-white rounded-[2.5rem] p-8 shadow-xl flex justify-between items-center border-[3px] border-[#4A4433]">
                                <div><p class="text-2xl font-black">${e.title}</p><div class="flex items-center gap-2 mt-1"><i data-lucide="user" class="w-3 h-3 text-blue-600"></i><span class="text-[10px] font-black text-blue-600 uppercase">@${e.user}</span></div></div>
                                <div class="text-right font-mono"><p class="text-3xl font-black text-blue-600 tracking-tighter">${e.currency} ${e.amount}</p></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderPlanning(container) {
            container.innerHTML = `
                <div class="space-y-8 animate-fade-in">
                    <h2 class="text-4xl font-black px-2 flex items-center gap-4"><i data-lucide="check-square" class="text-blue-600"></i> 準備清單</h2>
                    <div class="space-y-5">
                        ${todos.map(t => `
                            <div class="bg-white rounded-[2.5rem] p-8 flex items-center gap-6 shadow-xl border-[3px] transition-all ${t.done ? 'opacity-50 border-transparent bg-gray-50' : 'border-[#4A4433] active:scale-95'}" onclick="toggleTodo(${t.id})">
                                <div class="w-12 h-12 rounded-2xl flex items-center justify-center border-4 ${t.done ? 'bg-green-500 border-green-500 text-white' : 'border-gray-200 bg-gray-50'}">
                                    ${t.done ? '<i data-lucide="check" class="w-8 h-8 stroke-[4px]"></i>' : ''}
                                </div>
                                <span class="text-2xl font-black flex-1 ${t.done ? 'line-through text-gray-400' : 'text-[#1C1912]'}">${t.text}</span>
                                <button onclick="event.stopPropagation(); deleteTodo(${t.id})" class="text-red-400 p-2"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- 5. 功能操作 ---
        function openAddModal() {
            const modal = document.getElementById('modal-overlay');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            modal.classList.remove('hidden');

            if (currentTab === 'schedule') {
                title.innerText = "新增行程項目";
                body.innerHTML = `
                    <div class="space-y-5">
                        <input id="add-time" type="time" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none focus:border-blue-500" value="10:00">
                        <input id="add-city" placeholder="城市 (如：蘇黎世)" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none focus:border-blue-500">
                        <input id="add-title" placeholder="景點名稱 (如：起司鍋)" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none focus:border-blue-500">
                        <textarea id="add-note" placeholder="備註細節..." class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none focus:border-blue-500" rows="3"></textarea>
                        <button onclick="submitAddSchedule()" class="w-full bg-[#1C1912] text-white py-8 rounded-[3.5rem] font-black text-2xl tracking-widest uppercase shadow-2xl active:scale-95 transition-all">Confirm & Save</button>
                    </div>
                `;
            } else if (currentTab === 'expense') {
                title.innerText = "紀錄支出";
                body.innerHTML = `
                    <div class="space-y-5">
                        <input id="ex-title" placeholder="消費名稱" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none focus:border-blue-500">
                        <div class="grid grid-cols-2 gap-4">
                            <input id="ex-amount" type="number" placeholder="金額" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none focus:border-blue-500">
                            <select id="ex-currency" class="p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                                <option value="CHF">法郎 CHF</option>
                                <option value="TWD">台幣 TWD</option>
                                <option value="EUR">歐元 EUR</option>
                            </select>
                        </div>
                        <button onclick="submitAddExpense()" class="w-full bg-blue-600 text-white py-8 rounded-[3.5rem] font-black text-2xl shadow-2xl active:scale-95 transition-all">新增支出紀錄</button>
                    </div>
                `;
            } else if (currentTab === 'planning') {
                title.innerText = "新增準備清單";
                body.innerHTML = `
                    <div class="space-y-5">
                        <input id="todo-text" placeholder="需要準備什麼項目？" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none focus:border-blue-500">
                        <button onclick="submitAddTodo()" class="w-full bg-green-600 text-white py-8 rounded-[3.5rem] font-black text-2xl shadow-2xl active:scale-95 transition-all">加入準備清單</button>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function submitAddSchedule() {
            const time = document.getElementById('add-time').value;
            const city = document.getElementById('add-city').value || '未定義';
            const title = document.getElementById('add-title').value;
            const note = document.getElementById('add-note').value;
            if(!title) return;
            schedules.push({ id: Date.now(), date: currentActiveDay, time, city, title, note, cat: 'spot' });
            closeModal(); render();
        }

        function submitAddExpense() {
            const title = document.getElementById('ex-title').value;
            const amount = parseFloat(document.getElementById('ex-amount').value);
            const currency = document.getElementById('ex-currency').value;
            if(!title || !amount) return;
            expenses.push({ id: Date.now(), title, amount, currency, user: '我' });
            closeModal(); render();
        }

        function submitAddTodo() {
            const text = document.getElementById('todo-text').value;
            if(!text) return;
            todos.push({ id: Date.now(), text, done: false });
            closeModal(); render();
        }

        function openSwapModal() {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = "對調整日行程";
            document.getElementById('modal-body').innerHTML = `
                <div class="flex flex-col gap-5">
                    <select id="swap-day-1" class="p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">${SWISS_DAYS.map(d => `<option value="${d.id}">${d.label} (${d.date})</option>`).join('')}</select>
                    <div class="text-center font-black text-blue-600 text-4xl">⇅</div>
                    <select id="swap-day-2" class="p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">${SWISS_DAYS.map(d => `<option value="${d.id}">${d.label} (${d.date})</option>`).join('')}</select>
                    <button onclick="confirmSwap()" class="w-full bg-blue-600 text-white py-8 rounded-[3.5rem] font-black text-2xl mt-4 shadow-2xl uppercase tracking-widest active:scale-95 transition-all">Confirm Swap</button>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function confirmSwap() {
            const d1 = document.getElementById('swap-day-1').value;
            const d2 = document.getElementById('swap-day-2').value;
            schedules.forEach(s => {
                if (s.date === d1) s.date = "TEMP";
                else if (s.date === d2) s.date = d1;
            });
            schedules.forEach(s => { if(s.date === "TEMP") s.date = d2; });
            closeModal(); render();
        }

        function handleDragStart(idx) { window.dragSourceIdx = idx; }
        function handleDrop(idx) {
            const dayItems = schedules.filter(s => s.date === currentActiveDay);
            const otherItems = schedules.filter(s => s.date !== currentActiveDay);
            const source = dayItems[window.dragSourceIdx];
            dayItems.splice(window.dragSourceIdx, 1);
            dayItems.splice(idx, 0, source);
            schedules = [...otherItems, ...dayItems];
            render();
        }

        // --- 6. 輔助函數 ---
        function saveTripTitle(val) { console.log("Title updated to:", val); }
        function deleteSchedule(id) { schedules = schedules.filter(s => s.id !== id); render(); }
        function deleteTodo(id) { todos = todos.filter(t => t.id !== id); render(); }
        function toggleTodo(id) { const t = todos.find(x => x.id === id); if(t) t.done = !t.done; render(); }
        function saveFocus(val) { dailyFocus[currentActiveDay] = val; }
        function selectDay(dayId) { currentActiveDay = dayId; render(); }
        function switchTab(tabId) { currentTab = tabId; render(); }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
        function getCatColor(cat) { return { spot: 'bg-[#A7B09E]', transport: 'bg-[#9BAEBC]', hotel: 'bg-[#E0D8C3]', flight: 'bg-[#C25E5E]' }[cat] || 'bg-gray-300'; }

        // --- 啟動 ---
        window.onload = render;
    </script>
</body>
</html>
