<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SWISS 2026 Shared Diary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.6/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .journal-card { border: 3px solid #1C1912; box-shadow: 12px 12px 0px rgba(0,0,0,0.1); transition: all 0.3s ease; }
    .date-active { background-color: #8E9775 !important; color: white !important; transform: scale(1.1) rotate(-2deg); box-shadow: 0 10px 20px rgba(142, 151, 117, 0.4); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
  </script>
</head>
<body class="bg-[#CFC8B3]">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp, getApps } from 'firebase/app';
    import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc } from 'firebase/firestore';
    import { getAuth, onAuthStateChanged, signInAnonymously } from 'firebase/auth';
    import { Calendar, Plus, Map as MapIcon, Check, Trash2, ArrowRight, Wallet, User, ChevronRight, Camera, Info, CheckSquare, AlertCircle, MapPin, CreditCard } from 'lucide-react';

    const RATE_CHF = 36.8;
    const appId = 'swiss-trip-final-v43';

    // 1. 初始化 Firebase (請確保 __firebase_config 已正確注入)
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "demo", projectId: "demo" };
    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 2. 輔助函式：取得一致的資料路徑
    const getDataRef = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);

    function App() {
      const [activeTab, setActiveTab] = useState('schedule');
      const [selectedDay, setSelectedDay] = useState('2026-03-18');
      const [user, setUser] = useState(null);
      const [schedules, setSchedules] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [todos, setTodos] = useState([]);
      const [members, setMembers] = useState(["Zora"]);
      const [isAddingModalOpen, setIsAddingModalOpen] = useState(false);
      const [confirmData, setConfirmData] = useState(null);

      // 身分驗證
      useEffect(() => {
        signInAnonymously(auth);
        onAuthStateChanged(auth, setUser);
      }, []);

      // 資料監聽
      useEffect(() => {
        if (!user) return;
        const unsubS = onSnapshot(getDataRef('schedules'), (snap) => setSchedules(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
        const unsubE = onSnapshot(getDataRef('expenses'), (snap) => setExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
        const unsubT = onSnapshot(getDataRef('todos'), (snap) => setTodos(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
        const unsubM = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'members'), (snap) => {
          if (snap.exists()) setMembers(snap.data().list);
        });
        return () => { unsubS(); unsubE(); unsubT(); unsubM(); };
      }, [user]);

      const currentItems = useMemo(() => 
        schedules.filter(s => s.date === selectedDay).sort((a,b) => a.time.localeCompare(b.time)),
      [schedules, selectedDay]);

      const totalExpenseTWD = useMemo(() => 
        expenses.reduce((acc, ex) => acc + (ex.amount * (ex.currency === 'CHF' ? RATE_CHF : 1)), 0),
      [expenses]);

      // --- 核心功能修復 ---
      const handleAddSchedule = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        await addDoc(getDataRef('schedules'), {
          date: selectedDay, time: fd.get('time'), city: fd.get('city'), 
          title: fd.get('title'), category: 'spot', done: false, timestamp: Date.now()
        });
        setIsAddingModalOpen(false);
      };

      const handleAddExpense = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        await addDoc(getDataRef('expenses'), {
          user: fd.get('user'), title: fd.get('title'), 
          amount: parseFloat(fd.get('amount')), currency: fd.get('currency'), timestamp: Date.now()
        });
        setIsAddingModalOpen(false);
      };

      const handleAddMember = async (name) => {
        if (!name || members.includes(name)) return;
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'members'), { list: [...members, name] });
      };

      const SWISS_DAYS = Array.from({length: 13}, (_, i) => {
        const d = new Date(2026, 2, 18 + i);
        return { id: `2026-03-${18+i}`, label: `Day ${i+1}`, date: `3/${18+i}` };
      });

      return (
        <div className="min-h-screen pb-32 text-[#1C1912] font-black">
          {/* Header */}
          <header className="sticky top-0 z-50 bg-[#CFC8B3]/90 backdrop-blur-md px-6 py-8 flex justify-between items-center border-b-2 border-black/5">
            <div>
              <h1 className="text-3xl font-black tracking-tighter italic">SWISS 2026</h1>
              <p className="text-[10px] tracking-[0.4em] opacity-50 uppercase">Shared Diary</p>
            </div>
            <button onClick={() => setIsAddingModalOpen(true)} className="bg-[#1C1912] text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform">
              <Plus size={24} strokeWidth={3} />
            </button>
          </header>

          <main className="px-6 py-4 max-w-lg mx-auto">
            {activeTab === 'schedule' && (
              <div className="space-y-8 animate-fade-in">
                {/* 1. 總表大綱 (參考範例圖風格) */}
                <div className="bg-white/50 rounded-[2.5rem] p-8 journal-card">
                  <p className="text-[10px] font-black uppercase text-[#8E9775] mb-6 tracking-widest">Daily Timeline 大綱</p>
                  <div className="relative pl-6 space-y-8">
                    <div className="absolute left-[7px] top-2 bottom-2 w-[2px] bg-[#1C1912]/10"></div>
                    {currentItems.map((item) => (
                      <div key={item.id} className="relative flex items-start gap-4">
                        <div className="absolute -left-[24px] top-1.5 w-3 h-3 rounded-full bg-[#1C1912] border-2 border-[#CFC8B3] z-10"></div>
                        <span className="text-[12px] font-mono text-[#8E9775] w-14 shrink-0">{item.time}</span>
                        <div className="flex-1">
                          <h4 className="text-[15px] leading-tight">{item.title}</h4>
                          <div className="flex items-center gap-2 mt-1 opacity-40">
                             <MapPin size={10} /> <span className="text-[10px] uppercase">{item.city}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                    {currentItems.length === 0 && <p className="text-sm opacity-30 italic py-4">今天還沒有安排行程...</p>}
                  </div>
                </div>

                {/* 日期選擇 */}
                <div className="flex gap-3 overflow-x-auto pb-4 no-scrollbar">
                  {SWISS_DAYS.map(day => (
                    <button key={day.id} onClick={() => setSelectedDay(day.id)} className={`flex-shrink-0 w-20 h-20 rounded-3xl flex flex-col items-center justify-center transition-all ${selectedDay === day.id ? 'date-active' : 'bg-white/40 opacity-40'}`}>
                      <span className="text-[9px] font-bold">{day.label}</span>
                      <span className="text-sm font-mono">{day.date}</span>
                    </button>
                  ))}
                </div>

                {/* 詳細卡片 */}
                <div className="space-y-6">
                  {currentItems.map(item => (
                    <div key={item.id} className={`bg-white p-6 rounded-[2rem] journal-card ${item.done ? 'opacity-40 grayscale' : ''}`}>
                      <div className="flex justify-between items-start mb-4">
                        <span className="text-[11px] bg-black/5 px-3 py-1 rounded-full uppercase tracking-widest">{item.city}</span>
                        <button onClick={() => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', item.id))}><Trash2 size={16} className="opacity-20"/></button>
                      </div>
                      <h3 className="text-xl mb-4 leading-tight">{item.title}</h3>
                      <div className="flex gap-2">
                        <button onClick={() => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', item.id), {done: !item.done})} className={`flex-1 py-3 rounded-2xl flex items-center justify-center gap-2 transition-colors ${item.done ? 'bg-green-500 text-white' : 'bg-[#8E9775]/10 text-[#8E9775]'}`}>
                          <Check size={18} strokeWidth={3} /> {item.done ? '已完成' : '標記完成'}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 航班憑證分頁 - 根據圖片精確修正 */}
            {activeTab === 'booking' && (
              <div className="space-y-8 animate-fade-in">
                <h2 className="text-2xl px-2 italic">Flight Tickets</h2>
                {/* 去程 */}
                <div className="bg-white rounded-[2.5rem] overflow-hidden journal-card">
                  <div className="bg-[#AA1D24] p-6 text-white flex justify-between items-center">
                    <div><p className="text-sm opacity-70">Emirates • 3/18</p><p className="text-xl font-mono">EK0387 / EK0087</p></div>
                    <div className="text-right"><p className="text-[10px] opacity-70">STATUS</p><p className="font-mono">CONFIRMED</p></div>
                  </div>
                  <div className="p-8 space-y-6 font-mono">
                    <div className="flex justify-between items-center">
                      <div className="text-center flex-1"><p className="text-3xl">TPE</p><p className="text-xs text-[#8E9775]">00:20</p></div>
                      <ArrowRight className="opacity-20" size={20} />
                      <div className="text-center flex-1"><p className="text-3xl">DXB</p><p className="text-xs opacity-40">06:10</p></div>
                    </div>
                    <div className="border-t border-dashed border-black/5 pt-6 flex justify-between items-center">
                      <div className="text-center flex-1 opacity-40"><p className="text-3xl">DXB</p><p className="text-xs">08:25</p></div>
                      <ArrowRight className="opacity-20" size={20} />
                      <div className="text-center flex-1"><p className="text-3xl text-[#1C1912]">ZRH</p><p className="text-xs text-[#8E9775]">12:25</p></div>
                    </div>
                  </div>
                </div>

                {/* 回程 */}
                <div className="bg-white rounded-[2.5rem] overflow-hidden journal-card">
                  <div className="bg-[#1C1912] p-6 text-white flex justify-between items-center">
                    <div><p className="text-sm opacity-70">Emirates • 3/30-31</p><p className="text-xl font-mono">EK0088 / EK0366</p></div>
                    <div className="text-right"><p className="text-[10px] opacity-70">STATUS</p><p className="font-mono">CONFIRMED</p></div>
                  </div>
                  <div className="p-8 space-y-6 font-mono">
                    <div className="flex justify-between items-center">
                      <div className="text-center flex-1"><p className="text-3xl">ZRH</p><p className="text-xs text-[#8E9775]">15:30</p></div>
                      <ArrowRight className="opacity-20" size={20} />
                      <div className="text-center flex-1"><p className="text-3xl opacity-40">DXB</p><p className="text-xs">23:45</p></div>
                    </div>
                    <div className="border-t border-dashed border-black/5 pt-6 flex justify-between items-center">
                      <div className="text-center flex-1 opacity-40"><p className="text-3xl">DXB</p><p className="text-xs">03:45</p></div>
                      <ArrowRight className="opacity-20" size={20} />
                      <div className="text-center flex-1"><p className="text-3xl text-[#1C1912]">TPE</p><p className="text-xs text-[#8E9775]">16:10</p></div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 記帳分頁 */}
            {activeTab === 'expense' && (
              <div className="space-y-6 animate-fade-in">
                <div className="bg-[#1C1912] text-white p-10 rounded-[2.5rem] shadow-xl">
                  <p className="text-[10px] opacity-50 tracking-widest mb-2">TOTAL ESTIMATED</p>
                  <h2 className="text-5xl font-mono tracking-tighter italic">NT$ {totalExpenseTWD.toLocaleString()}</h2>
                </div>
                {expenses.map(ex => (
                  <div key={ex.id} className="bg-white p-6 rounded-[2rem] journal-card flex justify-between items-center">
                    <div>
                      <p className="text-xl tracking-tight">{ex.title}</p>
                      <p className="text-[10px] text-[#8E9775] font-mono">@{ex.user} • {ex.currency} {ex.amount}</p>
                    </div>
                    <div className="flex items-center gap-4">
                      <p className="text-lg font-mono">NT$ {Math.round(ex.amount * (ex.currency === 'CHF' ? RATE_CHF : 1)).toLocaleString()}</p>
                      <button onClick={() => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', ex.id))}><Trash2 size={16} className="opacity-20"/></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Tab Bar */}
          <nav className="fixed bottom-0 left-0 right-0 bg-[#1C1912] text-white/40 px-6 py-8 flex justify-around items-center rounded-t-[3rem] z-50">
            {[
              { id: 'schedule', icon: Calendar, label: '行程' },
              { id: 'booking', icon: CreditCard, label: '憑證' },
              { id: 'expense', icon: Wallet, label: '記帳' },
              { id: 'planning', icon: CheckSquare, label: '準備' }
            ].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center gap-1 ${activeTab === tab.id ? 'text-[#8E9775] scale-110' : ''}`}>
                <tab.icon size={24} />
                <span className="text-[10px] font-bold">{tab.label}</span>
              </button>
            ))}
          </nav>

          {/* 新增彈窗 */}
          {isAddingModalOpen && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
              <div className="bg-[#F7F4EB] w-full max-w-sm rounded-[3rem] p-10 journal-card">
                <div className="flex justify-between items-center mb-8">
                  <h2 className="text-2xl italic">Add Record</h2>
                  <button onClick={() => setIsAddingModalOpen(false)}>✕</button>
                </div>
                
                {activeTab === 'schedule' ? (
                  <form onSubmit={handleAddSchedule} className="space-y-4">
                    <input name="time" type="time" required className="w-full p-4 rounded-2xl border-2 border-black/5" />
                    <input name="city" placeholder="城市" className="w-full p-4 rounded-2xl border-2 border-black/5" />
                    <input name="title" required placeholder="計畫名稱" className="w-full p-4 rounded-2xl border-2 border-black/5" />
                    <button type="submit" className="w-full bg-[#8E9775] text-white py-5 rounded-full font-bold shadow-lg">Confirm</button>
                  </form>
                ) : (
                  <form onSubmit={handleAddExpense} className="space-y-4">
                    <select name="user" className="w-full p-4 rounded-2xl border-2 border-black/5">
                      {members.map(m => <option key={m} value={m}>@{m}</option>)}
                    </select>
                    <input name="title" required placeholder="品項" className="w-full p-4 rounded-2xl border-2 border-black/5" />
                    <div className="flex gap-2">
                      <input name="amount" type="number" required placeholder="金額" className="flex-1 p-4 rounded-2xl border-2 border-black/5" />
                      <select name="currency" className="p-4 rounded-2xl border-2 border-black/5"><option>CHF</option><option>TWD</option></select>
                    </div>
                    <button type="submit" className="w-full bg-[#1C1912] text-white py-5 rounded-full font-bold shadow-lg">Confirm</button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
