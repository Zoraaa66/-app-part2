<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swiss Diary 2026 - Cloud Pro v3.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --morandi-green: #8E9775;
            --morandi-dark: #4A4E40;
            --morandi-light: #E1E5D5;
            --journal-bg: #CFC8B3;
        }

        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: var(--journal-bg); color: #1C1912; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        
        .date-active { background-color: var(--morandi-green); color: white; border-color: white; transform: scale(1.1); font-weight: 900; box-shadow: 0 10px 15px -3px rgba(142, 151, 117, 0.4); }
        .text-morandi { color: var(--morandi-green); }
        .bg-morandi { background-color: var(--morandi-green); }
        .text-dark-green { color: var(--morandi-dark); }
        .bg-dark-green { background-color: var(--morandi-dark); }

        .item-done { opacity: 0.5; filter: grayscale(0.8); background-color: #E2E8F0 !important; border-color: transparent !important; }
        .running-man { transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        
        .chat-bubble-me { border-radius: 1.5rem; border-bottom-right-radius: 0.2rem; background-color: var(--morandi-green); color: white; }
        .confirm-modal { animation: pop-up 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop-up { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .journal-card { border-width: 3px; border-color: #4A4433; border-style: solid; }
        .loading-overlay { background: var(--journal-bg); z-index: 1000; transition: opacity 0.5s ease; cursor: pointer; }
        .page-content-padding { padding-bottom: 180px; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden select-none">

    <!-- 載入中遮罩 (點擊可強制進入) -->
    <div id="loading-spinner" onclick="window.forceHideSpinner()" class="fixed inset-0 flex flex-col items-center justify-center loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-morandi border-t-transparent"></div>
        <p class="mt-4 font-black text-dark-green tracking-widest uppercase text-xs">Connecting to Swiss Cloud Pro...</p>
        <p class="mt-4 text-[10px] text-dark-green/40 animate-pulse uppercase">Click anywhere to skip loading</p>
    </div>

    <!-- 頂部標題列 -->
    <header class="sticky top-0 z-50 bg-[#CFC8B3]/95 backdrop-blur-xl px-6 py-10 flex justify-between items-center border-b-[3px] border-black/10 shadow-2xl">
        <div class="flex items-center gap-5">
            <div class="w-16 h-16 bg-[#1C1912] rounded-[2.2rem] flex items-center justify-center text-[#CFC8B3] shadow-xl rotate-3 border-4 border-white/10">
                <i data-lucide="map"></i>
            </div>
            <div class="flex-1">
                <input id="app-main-title" type="text" value="SWISS 2026" onchange="window.askConfirm(() => window.saveAppTitle(this.value), '更改標題', '確定要更改旅程主標題嗎？')" class="bg-transparent font-black text-3xl tracking-tighter w-full outline-none border-none focus:text-dark-green transition-colors">
                <p class="text-[10px] text-morandi font-black uppercase tracking-[0.5em] opacity-80 leading-none mt-1">Shared Travel Diary</p>
            </div>
        </div>
        <button onclick="window.openAddModal()" class="bg-morandi text-white w-14 h-14 rounded-[1.5rem] shadow-2xl flex items-center justify-center border-[4px] border-white active:scale-50 transition-all">
            <i data-lucide="plus" class="stroke-[4px]"></i>
        </button>
    </header>

    <main id="app-content" class="px-6 py-8 max-w-lg mx-auto min-h-[70vh] page-content-padding">
        <!-- 內容填充 -->
    </main>

    <!-- 底部導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1C1912]/98 backdrop-blur-3xl px-2 py-6 flex justify-around items-center z-[60] rounded-t-[4rem] shadow-[0_-30px_100px_rgba(0,0,0,0.6)] border-t border-white/10 max-w-lg mx-auto">
        <button onclick="window.switchTab('schedule')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-schedule">
            <i data-lucide="calendar" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">行程</span>
        </button>
        <button onclick="window.switchTab('booking')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-booking">
            <i data-lucide="layers" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">憑證</span>
        </button>
        <button onclick="window.switchTab('expense')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-expense">
            <i data-lucide="wallet" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">記帳</span>
        </button>
        <button onclick="window.switchTab('planning')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-planning">
            <i data-lucide="check-square" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">準備</span>
        </button>
        <button onclick="window.switchTab('chat')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-chat">
            <i data-lucide="message-square" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">日記</span>
        </button>
    </nav>

    <!-- 萬能彈窗 Modal -->
    <div id="modal-overlay" class="fixed inset-0 z-[100] hidden flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="bg-[#F7F4EB] w-full max-w-lg rounded-t-[3.5rem] sm:rounded-[3.5rem] p-8 shadow-2xl overflow-y-auto max-h-[90vh] border-t-8 border-morandi border-x-[6px] border-white">
            <div class="flex justify-between items-center mb-8">
                <h2 id="modal-title" class="text-3xl font-black text-[#1C1912] tracking-tighter">標題</h2>
                <button onclick="window.closeModal()" class="p-3 bg-white rounded-full shadow-lg text-gray-400 active:scale-75 transition-all">✕</button>
            </div>
            <div id="modal-body" class="space-y-6"></div>
        </div>
    </div>

    <!-- 二次確認彈窗 -->
    <div id="confirm-overlay" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-6 bg-black/80 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-10 shadow-2xl confirm-modal border-[6px] border-[#F7F4EB] text-center">
            <div class="w-20 h-20 bg-morandi/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="alert-triangle" class="text-morandi w-10 h-10"></i>
            </div>
            <h3 id="confirm-title" class="text-2xl font-black text-[#1C1912] mb-3 tracking-tighter">確認動作</h3>
            <p id="confirm-message" class="text-sm font-bold text-gray-400 mb-8 leading-relaxed">確定執行此操作嗎？</p>
            <div class="flex gap-4">
                <button onclick="window.closeConfirmModal()" class="flex-1 py-5 bg-gray-100 rounded-2xl font-black text-gray-500 active:scale-95">取消</button>
                <button id="confirm-action-btn" class="flex-1 py-5 bg-dark-green text-white rounded-2xl font-black shadow-lg shadow-dark-green/30 active:scale-95">確定</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, writeBatch 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'swiss-pro-v37-master';

        // --- 核心狀態 ---
        let appMainTitle = "SWISS 2026";
        let currentTab = 'schedule';
        let currentActiveDay = '2026-03-18';
        let members = ["Zora", "旅伴A", "旅伴B"];
        const APP_USER = "Zora"; 
        const RATE_CHF = 36.8;

        let schedules = [];
        let expenses = [];
        let chatMessages = [];
        let todos = [];
        let dailyMetadata = {};

        const SWISS_DAYS = Array.from({length: 13}, (_, i) => ({ id: `2026-03-${18+i}`, label: `Day ${i+1}`, date: `3/${18+i}` }));

        // --- 完整還原：13 天分鐘級定稿行程 ---
        const INITIAL_SCHEDULES = [
            { date: '2026-03-18', time: '12:25', title: '抵達蘇黎世機場', city: '蘇黎世', cat: 'flight', note: '入境辦理、行李、買水點心', order: 1 },
            { date: '2026-03-18', time: '13:45', title: 'Zurich Airport 出發', city: '蘇黎世', cat: 'transport', note: '火車前往 Interlaken Ost', order: 2 },
            { date: '2026-03-18', time: '16:45', title: '飯店 Check-in', city: '因特拉肯', cat: 'hotel', note: '放行李休息', order: 3 },
            { date: '2026-03-18', time: '17:45', title: '阿勒河岸 & Hohematte 草地', city: '因特拉肯', cat: 'spot', note: '黃昏拍攝', order: 4 },
            { date: '2026-03-19', time: '08:30', title: 'Interlaken Ost 出發', city: '格林德瓦', cat: 'transport', order: 1 },
            { date: '2026-03-19', time: '09:30', title: '搭乘 Eiger Express', city: '格林德瓦', cat: 'transport', order: 2 },
            { date: '2026-03-19', time: '10:15', title: '抵達少女峰觀景台', city: '少女峰', cat: 'spot', note: '斯芬克斯、阿萊奇冰川', order: 3 },
            { date: '2026-03-19', time: '16:30', title: 'Grindelwald 街拍', city: '格林德瓦', cat: 'spot', order: 4 },
            { date: '2026-03-20', time: '09:55', title: '抵達 First 菲斯特山', city: '格林德瓦', cat: 'spot', order: 1 },
            { date: '2026-03-20', time: '14:30', title: '抵達 Lauterbrunnen 瀑布谷', city: '勞特布龍嫩', cat: 'spot', order: 2 },
            { date: '2026-03-20', time: '17:30', title: 'Wengen 溫根小鎮', city: '溫根', cat: 'spot', order: 3 },
            { date: '2026-03-21', time: '10:00', title: 'Mürren 米倫村落拍攝', city: '米倫', cat: 'spot', order: 1 },
            { date: '2026-03-21', time: '12:00', title: '雪朗峰 Schilthorn', city: '米倫', cat: 'spot', order: 2 },
            { date: '2026-03-21', time: '17:00', title: 'Lauterbrunnen 黃昏拍攝', city: '勞特布龍嫩', cat: 'spot', order: 3 },
            { date: '2026-03-22', time: '08:30', title: '黃金列車前往琉森', city: '琉森', cat: 'transport', order: 1 },
            { date: '2026-03-22', time: '10:30', title: '琉森 卡貝爾橋 & 老城', city: '琉森', cat: 'spot', order: 2 },
            { date: '2026-03-22', time: '14:00', title: '垂死獅子像', city: '琉森', cat: 'spot', order: 3 },
            { date: '2026-03-23', time: '13:30', title: '抵達米蘭 Milano Centrale', city: '米蘭', cat: 'transport', order: 1 },
            { date: '2026-03-23', time: '15:30', title: 'Navigli Grande 運河區', city: '米蘭', cat: 'spot', order: 2 },
            { date: '2026-03-24', time: '09:30', title: '米蘭主教座堂 Duomo', city: '米蘭', cat: 'spot', order: 1 },
            { date: '2026-03-24', time: '14:00', title: '維托里奧拱廊 & 精品購物', city: '米蘭', cat: 'spot', order: 2 },
            { date: '2026-03-25', time: '16:00', title: '抵達 Zermatt 策馬特', city: '策馬特', cat: 'transport', order: 1 },
            { date: '2026-03-25', time: '16:30', title: '策馬特街景 & 初見馬特洪峰', city: '策馬特', cat: 'spot', order: 2 },
            { date: '2026-03-26', time: '05:45', title: '馬特洪峰日出拍攝', city: '策馬特', cat: 'spot', order: 1 },
            { date: '2026-03-26', time: '09:30', title: '教堂橋 & 老村 Hinterdorf', city: '策馬特', cat: 'spot', order: 2 },
            { date: '2026-03-27', time: '09:30', title: 'Gornergrat 觀景台', city: '策馬特', cat: 'spot', order: 1 },
            { date: '2026-03-27', time: '12:00', title: 'Riffelsee 倒影拍攝', city: '策馬特', cat: 'spot', order: 2 },
            { date: '2026-03-28', time: '09:30', title: 'Sunnegga 蘇內加倒影湖', city: '策馬特', cat: 'spot', order: 1 },
            { date: '2026-03-28', time: '12:00', title: 'Findeln 芬德倫山村拍攝', city: '策馬特', cat: 'spot', order: 2 },
            { date: '2026-03-29', time: '09:00', title: '策馬特備用日 / 休息補拍', city: '策馬特', cat: 'spot', order: 1 },
            { date: '2026-03-30', time: '12:00', title: '抵達蘇黎世機場', city: '蘇黎世', cat: 'transport', order: 1 },
            { date: '2026-03-30', time: '15:30', title: '蘇黎世起飛回程 (EK0088)', city: '蘇黎世', cat: 'flight', order: 2 }
        ];

        // --- 強制啟動 ---
        const forceHideSpinner = () => {
            const spinner = document.getElementById('loading-spinner');
            if (spinner) spinner.style.display = 'none';
            render();
        };

        async function startApp() {
            const timeout = setTimeout(forceHideSpinner, 2500);
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                onAuthStateChanged(auth, (user) => { 
                    if (user) { clearTimeout(timeout); initRealtimeSync(); }
                });
            } catch (err) {
                console.error("Auth failed:", err);
                forceHideSpinner();
            }
        }

        function initRealtimeSync() {
            const path = (coll) => collection(db, 'artifacts', appId, 'public', 'data', coll);
            const err = (e) => console.error("Sync Error:", e);

            onSnapshot(path('schedules'), (snap) => {
                if (snap.empty) {
                    INITIAL_SCHEDULES.forEach(i => addDoc(path('schedules'), { ...i, done: false, timestamp: Date.now() }));
                } else {
                    schedules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                }
                forceHideSpinner();
            }, err);

            onSnapshot(path('expenses'), (snap) => { expenses = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, err);
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'members', 'list'), (snap) => { if (snap.exists()) members = snap.data().list || ["Zora"]; render(); }, err);
            onSnapshot(path('todos'), (snap) => { todos = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, err);
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), (d) => { if (d.exists()) { appMainTitle = d.data().title; dailyMetadata = d.data().dailyMeta || {}; render(); } }, err);
        }

        // --- 核心渲染與函數 (全部明確掛載至 window) ---
        function render() {
            const container = document.getElementById('app-content');
            if (!container) return;
            window.updateNavStyles();
            document.getElementById('app-main-title').value = appMainTitle;

            if (currentTab === 'schedule') {
                renderSchedulePage(container);
            } else if (currentTab === 'booking') {
                renderBookingPage(container);
            } else if (currentTab === 'expense') {
                renderExpensePage(container);
            } else if (currentTab === 'planning') {
                renderPlanningPage(container);
            } else if (currentTab === 'chat') {
                renderChatPage(container);
            }
            lucide.createIcons();
        }

        function updateNavStyles() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-[#8E9775]', 'scale-110');
                btn.classList.add('text-white/30');
            });
            const activeBtn = document.getElementById(`btn-${currentTab}`);
            if (activeBtn) { activeBtn.classList.replace('text-white/30', 'text-[#8E9775]'); activeBtn.classList.add('scale-110'); }
        }

        function renderSchedulePage(container) {
            const meta = dailyMetadata[currentActiveDay] || { title: '未命名行程主題', location: '瑞士', weather: '--', rain: '--', visibility: '--' };
            container.innerHTML = `
                <div class="bg-blue-500 rounded-[2.5rem] p-6 text-white shadow-xl flex justify-between items-center mb-8 relative overflow-hidden">
                    <div class="z-10 flex-1">
                        <div class="flex items-center gap-2 mb-2"><i data-lucide="map-pin" class="w-4 h-4 opacity-60"></i><span class="text-[10px] font-black uppercase tracking-widest opacity-60">${meta.location} Weather</span></div>
                        <h3 class="text-2xl font-black mb-1">${meta.weather}</h3>
                        <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-[11px] font-bold opacity-80"><span>降雨: ${meta.rain}</span><span>能見度: ${meta.visibility}</span></div>
                    </div>
                    <i data-lucide="sun" class="w-16 h-16 opacity-30"></i>
                </div>
                <div class="bg-white/40 rounded-[2.5rem] p-6 mb-6 border-2 border-white shadow-inner animate-fade-in">
                    <p class="text-[10px] font-black uppercase text-morandi mb-3 tracking-widest">Daily Summary / 定稿大綱</p>
                    <div class="space-y-3 mt-4">${renderSummaryTable()}</div>
                </div>
                <div class="mb-8 px-4 py-5 bg-white/30 rounded-3xl border-b-[6px] border-morandi shadow-lg animate-fade-in">
                    <p class="text-[9px] font-black uppercase text-morandi opacity-60 mb-1 leading-none font-mono tracking-widest">Today's Topic</p>
                    <input onchange="window.askConfirm(() => window.saveDailyTitle(this.value), '更新主題', '確定更換今日主題？')" class="bg-transparent border-none text-morandi font-black text-2xl outline-none w-full" value="${meta.title}">
                </div>
                <div class="flex gap-4 overflow-x-auto pb-6 no-scrollbar touch-pan-x">${SWISS_DAYS.map(day => `
                    <button onclick="window.selectDay('${day.id}')" class="flex-shrink-0 flex flex-col items-center justify-center min-w-[75px] h-[75px] rounded-[2.2rem] transition-all border-[3.5px] ${day.id === currentActiveDay ? 'date-active' : 'bg-white/40 text-[#1C1912]/40 border-transparent'}">
                        <span class="text-[9px] uppercase mb-1 opacity-70">${day.label}</span>
                        <span class="text-base font-bold font-mono leading-none mt-1">${day.date}</span>
                    </button>`).join('')}</div>
                <div class="relative pl-14 space-y-10 mt-10" id="schedule-container">
                    <div class="absolute left-[1.65rem] top-8 bottom-8 w-[3.5px] bg-[#1C1912]/10 rounded-full"></div>
                    ${renderScheduleItems()}
                </div>`;
        }

        function renderSummaryTable() {
            const items = schedules.filter(s => s.date === currentActiveDay).sort((a,b) => a.time.localeCompare(b.time));
            if (items.length === 0) return `<p class="text-xs italic opacity-30 text-center py-4">本日無摘要資料</p>`;
            return items.map(item => `
                <div class="flex items-center gap-4 text-xs font-bold border-b border-black/5 pb-2 uppercase">
                    <span class="text-morandi font-mono w-10 shrink-0">${item.time}</span>
                    <span class="flex-1 truncate text-[#1C1912]/70 font-black tracking-tight">${item.title}</span>
                </div>`).join('');
        }

        function renderScheduleItems() {
            const items = schedules.filter(s => s.date === currentActiveDay).sort((a,b) => a.time.localeCompare(b.time));
            const firstUndoneIdx = items.findIndex(item => !item.done);
            return items.map((item, idx) => {
                const isRunnerHere = idx === (firstUndoneIdx === -1 ? items.length - 1 : firstUndoneIdx);
                const isLastItem = idx === items.length - 1;
                return `
                    <div class="relative animate-fade-in group">
                        <div onclick="window.toggleSchedule('${item.id}')" class="absolute -left-[3.25rem] top-8 z-20 w-12 h-12 rounded-full border-[5px] border-[#CFC8B3] flex items-center justify-center shadow-xl transition-all ${item.done ? 'bg-green-500 text-white' : 'bg-white'}">
                            ${item.done ? '<i data-lucide="check" class="w-6 h-6 stroke-[4px]"></i>' : (isRunnerHere ? '<span class="text-2xl running-man">🏃</span>' : '<div class="w-3 h-3 rounded-full bg-black/10"></div>')}
                        </div>
                        <div onclick="window.openEditScheduleModal('${item.id}')" class="bg-white rounded-[2.5rem] shadow-[12px_12px_0px_rgba(28,25,18,0.1)] journal-card p-6 relative active:scale-95 transition-all ${item.done ? 'item-done' : 'cursor-pointer'}">
                            <div class="absolute top-0 right-0 w-4 h-full rounded-r-[1.8rem] ${getCatColor(item.cat)}"></div>
                            <div class="flex flex-col gap-4">
                                <div class="flex justify-between items-start">
                                    <span class="text-[10px] font-black bg-[#1C1912]/5 text-[#1C1912]/40 px-3 py-1 rounded-lg tracking-widest uppercase leading-none font-mono">📍 ${item.city || 'Swiss'}</span>

                                    ${item.photo2 ? `<img src="${item.photo2}" class="aspect-square w-full rounded-2xl object-cover journal-card shadow-sm">` : `<div class="aspect-square bg-gray-100 rounded-2xl border-2 border-dashed border-black/5 flex items-center justify-center opacity-40 cursor-pointer active:bg-gray-200" onclick="event.stopPropagation(); window.triggerPhotoUpload('${item.id}', 2)"><i data-lucide="plus" class="text-black/10 w-6 h-6"></i></div>`}

                        ${!isLastItem ? `<div class="ml-4 my-6 p-4 border-l-4 border-dashed border-morandi bg-white/20 rounded-r-2xl text-[10px] font-bold text-dark-green/80 uppercase">AI 助手：預計步行/乘車 30 分鐘，建議查閱 SBB 即時班次。</div>` : ''}

        }

        function renderBookingPage(container) {
            container.innerHTML = `
                <div class="space-y-10 animate-fade-in pb-20 px-1">

                    <!-- 去程 -->
                    <div class="bg-white rounded-[3rem] shadow-2xl border-b-[15px] border-[#AA1D24] mb-8 overflow-hidden journal-card">
                        <div class="bg-[#AA1D24] p-8 text-white flex justify-between items-center font-black italic uppercase leading-none">
                            <div><p class="text-xl tracking-tighter font-black">阿聯酋 • 去程</p><p class="text-[10px] opacity-70 mt-1 uppercase font-mono">EK0387 / EK0087</p></div>
                            <div class="bg-black/20 px-4 py-2 rounded-2xl border border-white/20 text-sm font-mono tracking-widest">3/18 OK</div>
                        </div>
                        <div class="p-10 space-y-8 font-mono">
                            <div class="flex justify-between items-center text-[#1C1912]">
                                <div><p class="text-4xl font-black font-mono leading-none">TPE</p><p class="text-sm font-bold opacity-60 mt-2 leading-none uppercase">00:20</p></div>
                                <i data-lucide="arrow-right" class="opacity-20"></i>
                                <div><p class="text-4xl font-black font-mono leading-none text-morandi">ZRH</p><p class="text-sm font-bold opacity-60 mt-2 leading-none uppercase">12:25</p></div>
                            </div>
                        </div>
                    </div>
                    <!-- 回程航班 (EK0088 / EK0366) -->
                    <div class="bg-white rounded-[3rem] shadow-2xl border-b-[15px] border-dark-green overflow-hidden journal-card opacity-90">
                        <div class="bg-dark-green p-8 text-white flex justify-between items-center font-black italic uppercase leading-none">
                            <div><p class="text-xl tracking-tighter font-black">阿聯酋 • 回程</p><p class="text-[10px] opacity-70 mt-1 uppercase font-mono">EK0088 / EK0366</p></div>
                            <div class="bg-white/10 px-4 py-2 rounded-2xl border border-white/10 text-sm font-mono uppercase tracking-widest">3/30 OK</div>
                        </div>
                        <div class="p-10 space-y-12 font-mono">
                            <div class="flex justify-between items-center border-b border-dashed border-gray-100 pb-6">
                                <div class="text-center text-[#1C1912] font-black"><p class="text-4xl font-mono leading-none">ZRH</p><p class="text-sm text-morandi font-bold mt-2 leading-none font-black uppercase">15:30</p></div>
                                <div class="flex flex-col items-center opacity-30 font-black leading-none"><i data-lucide="arrow-right"></i><span class="text-[10px] mt-1 uppercase">6h 15m</span></div>
                                <div class="text-center opacity-40 font-black leading-none"><p class="text-4xl font-mono leading-none">DXB</p><p class="text-sm mt-2 leading-none font-bold uppercase">23:45</p></div>
                            </div>
                            <div class="flex justify-between items-center pt-4">
                                <div class="text-center opacity-40 font-black leading-none"><p class="text-4xl font-mono leading-none">DXB</p><p class="text-sm mt-2 leading-none font-bold uppercase">03:45</p></div>
                                <div class="flex flex-col items-center opacity-30 font-black leading-none"><i data-lucide="arrow-right"></i><span class="text-[10px] mt-1 uppercase">8h 25m</span></div>
                                <div class="text-center text-[#1C1912] font-black leading-none"><p class="text-4xl font-mono leading-none">TPE</p><p class="text-sm text-morandi font-bold mt-2 leading-none font-black uppercase">16:10</p></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderExpensePage(container) {
            const memberStats = {}; let totalTWD = 0;
            members.forEach(m => memberStats[m] = 0);
            expenses.forEach(e => {
                const amt = e.currency === 'CHF' ? e.amount * RATE_CHF : e.amount;
                totalTWD += amt; if (memberStats[e.user] !== undefined) memberStats[e.user] += amt;
            });
            container.innerHTML = `
                <div class="space-y-8 animate-fade-in pb-20 px-2">
                    <div class="bg-gradient-to-br from-[#1C1912] to-[#4A4433] rounded-[3rem] p-10 text-white shadow-2xl relative overflow-hidden">
                        <p class="text-[12px] font-black uppercase text-morandi mb-4 tracking-[0.5em] leading-none uppercase font-mono">Budget Tracker</p>
                        <h2 class="text-6xl font-black tracking-tighter mb-10 font-mono leading-none mt-2 font-mono uppercase tracking-tight italic"><span class="text-2xl opacity-40 font-black uppercase">NT$</span> ${Math.round(totalTWD).toLocaleString()}</h2>
                        <div class="space-y-3 border-t border-white/10 pt-8">${members.map(m => `<div class="flex justify-between items-center font-black leading-none font-mono uppercase"><span class="text-sm opacity-60 font-bold uppercase tracking-widest leading-none">@${m}</span><span class="text-xl tracking-tighter leading-none">NT$ ${Math.round(memberStats[m]).toLocaleString()}</span></div>`).join('')}</div>
                    </div>
                    <div class="space-y-4">${expenses.map(e => `<div class="bg-white rounded-[2.5rem] p-8 shadow-xl journal-card flex justify-between items-center relative"><div><p class="text-2xl font-black leading-tight tracking-tighter">${e.title}</p><p class="text-[10px] font-black text-morandi uppercase mt-1 leading-none font-mono tracking-widest">@${e.user}</p></div><div class="text-right flex items-center gap-6 font-mono font-black italic"><p class="text-2xl text-morandi leading-none tracking-tighter">${e.currency} ${e.amount}</p><button onclick="window.deleteExpense('${e.id}')" class="text-dark-green transition-all active:scale-75 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`).join('')}</div>
                </div>`;
        }

        function renderPlanningPage(container) {
            container.innerHTML = `
                <div class="space-y-12 animate-fade-in page-content-padding px-2">
                    <div class="bg-white rounded-[3rem] p-8 journal-card flex justify-between items-center shadow-xl active:scale-95 cursor-pointer transition-all border-b-[8px]" onclick="window.openMemberEditor()">
                        <div class="flex items-center gap-4"><div class="w-12 h-12 bg-morandi/10 rounded-2xl flex items-center justify-center text-morandi"><i data-lucide="users"></i></div><div><p class="font-black text-xl text-dark-green uppercase leading-none tracking-tighter">旅伴名單管理</p><p class="text-xs opacity-40 font-bold mt-2 leading-none uppercase tracking-[0.3em] font-mono">Partners</p></div></div>
                        <i data-lucide="chevron-right" class="text-morandi opacity-40"></i>
                    </div>
                    <div class="space-y-6">
                        <h2 class="text-3xl font-black text-dark-green tracking-tighter px-3 flex items-center gap-3"><i data-lucide="check-square" class="text-morandi"></i> 準備清單</h2>
                        <div class="space-y-4">
                            ${todos.map(t => `<div onclick="window.toggleTodo('${t.id}')" class="bg-white rounded-[2.5rem] p-8 flex items-center gap-6 shadow-xl journal-card transition-all ${t.done ? 'opacity-40 grayscale' : 'active:scale-95 shadow-[8px_8px_0px_rgba(74,78,64,0.1)]'}">
                                <div class="w-12 h-12 rounded-2xl flex items-center justify-center border-4 ${t.done ? 'bg-green-500 border-green-500 text-white shadow-lg shadow-green-500/30' : 'border-gray-200 shadow-inner'}">${t.done ? '<i data-lucide="check" class="w-8 h-8 stroke-[4px]"></i>' : ''}</div>
                                <span class="text-2xl font-black flex-1 ${t.done ? 'line-through text-gray-400' : 'text-[#1C1912] tracking-tighter'}">${t.text}</span>
                            </div>`).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderChatPage(container) {
            container.innerHTML = `
                <div class="flex flex-col h-[70vh] animate-fade-in px-2">
                    <h2 class="text-4xl font-black mb-8 text-dark-green tracking-tighter px-3 flex items-center gap-3 leading-none mt-2"><i data-lucide="message-square" class="text-morandi"></i> 成員共享日記</h2>
                    <div class="flex-1 overflow-y-auto space-y-6 px-2 mb-4 no-scrollbar">${chatMessages.map(m => `<div class="flex flex-col ${m.user === APP_USER ? 'items-end' : 'items-start'}"><div class="flex items-center gap-2 mb-1 px-2"><span class="text-[10px] opacity-40 font-black font-mono">@${m.user}</span></div><div class="${m.user === APP_USER ? 'chat-bubble-me shadow-md shadow-morandi/20' : 'bg-white journal-card shadow-sm'} p-5 font-bold max-w-[85%] text-lg leading-relaxed">${m.text}</div></div>`).join('')}</div>
                    <div class="bg-white rounded-[2.5rem] p-4 border-[3.5px] border-[#1C1912] shadow-2xl flex items-center gap-3">
                        <input id="chat-input" class="flex-1 bg-transparent outline-none font-bold px-4 h-12 text-lg" placeholder="留下今天的旅行亮點...">
                        <button onclick="window.sendChat()" class="bg-morandi text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg transition-all active:scale-75"><i data-lucide="send" class="w-6 h-6"></i></button>
                    </div>
                </div>`;
        }

        // --- 核心操作函數 ---
        async function submitNewMember() {
            const input = document.getElementById('new-member-name');
            const name = input?.value?.trim();
            if(!name || members.includes(name)) return;
            const newList = [...members, name];
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', 'list'), { list: newList });
            input.value = '';
            window.openMemberEditor();
        }

        async function uploadPhoto(itemId, slot, input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result;
                const updateObj = {}; updateObj[`photo${slot}`] = base64;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', itemId), updateObj);
            };
            reader.readAsDataURL(file);
        }

        function triggerPhotoUpload(itemId, slot) { 
            const input = document.getElementById(`file-${itemId}-${slot}`);
            if (input) input.click();
        }

        async function toggleSchedule(id) { const s = schedules.find(x => x.id === id); if(s) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id), { done: !s.done }); }
        async function toggleTodo(id) { const t = todos.find(x => x.id === id); if(t) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'todos', id), { done: !t.done }); }
        async function deleteSchedule(id) { window.askConfirm(async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id)); }, "刪除行程", "確定刪除此項行程嗎？"); }
        async function deleteExpense(id) { window.askConfirm(async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', id)); }, "刪除記帳", "確定刪除支出紀錄？"); }
        async function removeMember(idx) { window.askConfirm(async () => { const newList = [...members]; newList.splice(idx,1); await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', 'list'), { list: newList }); window.openMemberEditor(); }, "移除旅伴", "確認移除此成員？"); }
        function saveAppTitle(val) { setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), { title: val }, { merge: true }); }
        function saveDailyTitle(val) { const newMeta = {...dailyMetadata}; if(!newMeta[currentActiveDay]) newMeta[currentActiveDay] = {}; newMeta[currentActiveDay].title = val; setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), { dailyMeta: newMeta }, { merge: true }); }
        
        function openEditScheduleModal(id) {
            const item = schedules.find(s => s.id == id);
            if (!item) return;
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = "編輯筆記詳情";
            modal.classList.remove('hidden');
            document.getElementById('modal-body').innerHTML = `
                <div class="space-y-4 animate-fade-in">
                    <input id="edit-title" value="${item.title}" class="w-full p-6 rounded-2xl border-4 border-gray-100 font-black outline-none focus:border-morandi tracking-tighter text-xl">
                    <textarea id="edit-details" rows="6" class="w-full p-6 rounded-2xl border-4 border-gray-100 font-black placeholder-gray-300 outline-none focus:border-morandi tracking-tighter" placeholder="詳細備註...">${item.details || ''}</textarea>
                    <button onclick="window.saveEditSchedule('${id}')" class="w-full bg-dark-green text-white py-6 rounded-[2.5rem] font-black shadow-xl active:scale-95 uppercase tracking-[0.2em] font-mono">Confirm Update</button>
                </div>`;
            lucide.createIcons();
        }

        async function saveEditSchedule(id) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id), {
                title: document.getElementById('edit-title').value,
                details: document.getElementById('edit-details').value
            });
            window.closeModal();
        }

        function openMemberEditor() {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = "旅伴名單管理";
            modal.classList.remove('hidden');
            document.getElementById('modal-body').innerHTML = `
                <div class="space-y-6 animate-fade-in">
                    <div class="grid grid-cols-1 gap-3 max-h-[40vh] overflow-y-auto no-scrollbar">${members.map((m, idx) => `
                        <div class="bg-white p-5 rounded-2xl border-2 border-black/5 flex justify-between items-center group shadow-sm transition-all">
                            <input type="text" onchange="window.updateMemberName(${idx}, this.value)" class="font-black text-lg bg-transparent outline-none flex-1 font-mono tracking-tighter" value="${m}">
                            ${m !== APP_USER ? `<button onclick="window.removeMember(${idx})" class="text-dark-green active:scale-75 transition-all p-2"><i data-lucide="x" class="w-5 h-5"></i></button>` : '<span class="text-[8px] font-black text-morandi uppercase tracking-[0.2em] font-mono">Owner</span>'}
                        </div>`).join('')}</div>
                    <div class="flex gap-3"><input id="new-member-name" placeholder="輸入名字..." class="flex-1 p-5 rounded-2xl border-4 border-gray-100 font-black outline-none shadow-inner"><button onclick="window.submitNewMember()" class="bg-morandi text-white px-8 rounded-2xl font-black active:scale-95 shadow-lg">+ 新增</button></div>
                    <button onclick="window.closeModal()" class="w-full py-6 bg-dark-green text-white rounded-[2rem] font-black mt-4 active:scale-95 shadow-xl uppercase font-mono tracking-widest text-sm">Save & Exit</button>
                </div>`;
            lucide.createIcons();
        }

        function openAddModal() {
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = currentTab === 'schedule' ? "新增旅程項目" : currentTab === 'expense' ? "紀錄日常費用" : "新增事項";
            modal.classList.remove('hidden');

            if (currentTab === 'schedule') {
                body.innerHTML = `<div class="space-y-5 animate-fade-in"><div class="grid grid-cols-2 gap-4 font-mono font-black"><input id="add-time" type="time" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none focus:border-morandi" value="10:00"><input id="add-city" placeholder="城市" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none focus:border-morandi"></div><input id="add-title" placeholder="景點名稱或交通大綱" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none shadow-inner text-xl"><button onclick="window.submitSchedule()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl active:scale-95 shadow-xl tracking-[0.1em] uppercase border-b-[8px] border-black/10 font-mono">Confirm Add</button></div>`;
            } else if (currentTab === 'expense') {
                body.innerHTML = `<div class="space-y-5"><select id="ex-user" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">${members.map(m => `<option value="${m}">${m}</option>`).join('')}</select><input id="ex-title" placeholder="支出品項內容" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none shadow-inner"><div class="grid grid-cols-2 gap-4"><input id="ex-amount" type="number" placeholder="金額" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none"><select id="ex-currency" class="p-6 rounded-3xl border-4 border-gray-100 font-black outline-none shadow-inner font-mono font-black"><option value="CHF">CHF</option><option value="TWD">TWD</option></select></div><button onclick="window.submitExpense()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl active:scale-95 shadow-xl font-mono uppercase tracking-widest border-b-[8px] border-black/10">Record Now</button></div>`;
            } else { body.innerHTML = `<input id="todo-text" placeholder="需要準備什麼？" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none shadow-inner"><button onclick="window.submitTodo()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl mt-4 active:scale-95 shadow-xl uppercase font-mono border-b-[8px] border-black/10">Confirm</button>`; }
            lucide.createIcons();
        }

        // --- 通用輔助 ---
        function askConfirm(action, title, message) { const overlay = document.getElementById('confirm-overlay'); document.getElementById('confirm-title').innerText = title; document.getElementById('confirm-message').innerText = message; overlay.classList.remove('hidden'); document.getElementById('confirm-action-btn').onclick = () => { action(); window.closeConfirmModal(); }; }
        function closeConfirmModal() { document.getElementById('confirm-overlay').classList.add('hidden'); }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
        function switchTab(tabId) { currentTab = tabId; render(); }
        function selectDay(dayId) { currentActiveDay = dayId; render(); }
        function getCatColor(cat) { return { spot: 'bg-[#A7B09E]', transport: 'bg-[#9BAEBC]', hotel: 'bg-[#E0D8C3]', flight: 'bg-dark-green' }[cat] || 'bg-gray-300'; }
        async function sendChat() { const input = document.getElementById('chat-input'); if(!input.value) return; await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chat'), { user: APP_USER, text: input.value, timestamp: Date.now() }); input.value = ''; }
        function updateMemberName(idx, val) { if(val) members[idx] = val; }

        async function submitSchedule() {
            const title = document.getElementById('add-title')?.value;
            if(!title) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'schedules'), { date: currentActiveDay, time: document.getElementById('add-time').value, city: document.getElementById('add-city').value, title, cat: 'spot', done: false, timestamp: Date.now() });
            window.closeModal();
        }
        async function submitExpense() {
            const title = document.getElementById('ex-title')?.value;
            if(!title) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), { title, amount: parseFloat(document.getElementById('ex-amount').value), currency: document.getElementById('ex-currency').value, user: document.getElementById('ex-user').value, timestamp: Date.now() });
            window.closeModal();
        }
        async function submitTodo() { 
            const text = document.getElementById('todo-text')?.value;
            if(!text) return; 
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'todos'), { text, done: false, timestamp: Date.now() }); 
            window.closeModal(); 
        }

        // --- 全域對象掛載 (關鍵修復) ---
        Object.assign(window, { 
            switchTab, selectDay, toggleSchedule, deleteSchedule, deleteExpense, toggleTodo, 
            openMemberEditor, updateMemberName, removeMember, submitNewMember, sendChat, 
            saveDailyTitle, saveAppTitle, openAddModal, closeModal, submitSchedule, 
            submitExpense, submitTodo, askConfirm, closeConfirmModal, triggerPhotoUpload, 
            uploadPhoto, openEditScheduleModal, saveEditSchedule, forceHideSpinner, updateNavStyles, render 
        });

        window.onload = startApp;
    </script>
