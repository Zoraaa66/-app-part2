<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SWISS 2026 Shared Diary</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel for JSX transformation (Fixed Version) -->
  <script src="https://unpkg.com/@babel/standalone@7.24.6/babel.min.js"></script>

  <!-- Google Font: Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>

  <!-- Import Map: 告訴瀏覽器哪裡可以下載這些套件 -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
  </script>
</head>
<body class="bg-[#CFC8B3]">
  <!-- React 掛載點 -->
  <div id="root"></div>

  <!-- 
    修正說明：
    1. data-presets="react": 強制只編譯 React JSX，跳過 preset-env 檢查，解決 targets error。
    2. data-type="module": 保持模組特性以支援 import。
  -->
  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp, getApps } from 'firebase/app';
    import { 
      getFirestore, collection, doc, onSnapshot, 
      addDoc, updateDoc, deleteDoc, setDoc
    } from 'firebase/firestore';
    import { 
      getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken 
    } from 'firebase/auth';
    import { 
      Calendar, Plus, Map as MapIcon, 
      Check, Trash2, ArrowRight, Wallet, 
      User, Layers, RefreshCw, ChevronRight, 
      Camera as CameraIcon, Info, CheckSquare,
      AlertCircle, MapPin, CreditCard, Edit3, Send
    } from 'lucide-react';

    /**
     * --- 1. 核心環境設定 (已修正為安全模式) ---
     */
    const getFirebaseConfig = () => {
        try {
            if (typeof __firebase_config !== 'undefined') {
                return JSON.parse(__firebase_config);
            }
            // 本地測試用的假配置，防止報錯
            return { apiKey: "demo-key", authDomain: "demo.firebaseapp.com", projectId: "demo" };
        } catch (e) {
            console.error("Firebase config parse error", e);
            return {};
        }
    };

    const firebaseConfig = getFirebaseConfig();
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'swiss-trip-final-v43';

    // 初始化 Firebase
    let firebaseApp;
    let auth;
    let db;

    try {
        firebaseApp = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);
    } catch (err) {
        console.error("Firebase Initialization Error:", err);
    }

    // 莫蘭迪核心顏色定義
    const CATEGORY_COLORS = {
      flight: 'bg-[#C25E5E]',
      transport: 'bg-[#9BAEBC]',
      hotel: 'bg-[#E0D8C3]',
      spot: 'bg-[#A7B09E]'
    };

    const RATE_CHF = 36.8;

    // --- 完整重灌：13 天分鐘級最終定稿行程 ---
    const INITIAL_SCHEDULES = [
      { date: '2026-03-18', time: '12:25', title: '抵達蘇黎世機場', city: '蘇黎世', category: 'flight', note: '入境辦理、行李、買水點心', details: '12:25–13:40 入境、領行李。13:45 出發火車。', order: 1 },
      { date: '2026-03-18', time: '13:45', title: '蘇黎世機場 出發', city: '蘇黎世', category: 'transport', note: '前往 Interlaken Ost', order: 2 },
      { date: '2026-03-18', time: '16:45', title: '飯店入住 Check-in', city: '因特拉肯', category: 'hotel', note: '放行李休息 (45分)', order: 3 },
      { date: '2026-03-18', time: '17:45', title: '阿勒河岸 & Hohematte 草地', city: '因特拉肯', category: 'spot', note: '黃昏拍攝 (當日戶外 2.5h)', order: 4 },
      { date: '2026-03-19', time: '08:30', title: 'Interlaken Ost 出發', city: '因特拉肯', category: 'transport', order: 1 },
      { date: '2026-03-19', time: '10:15', title: '抵達少女峰 Jungfraujoch', city: '少女峰', category: 'spot', note: '斯芬克斯、阿萊奇冰川、冰原平台', order: 2 },
      { date: '2026-03-19', time: '16:30', title: 'Grindelwald 村落街拍', city: '格林德瓦', category: 'spot', note: '停留 2 小時拍攝', order: 3 },
      { date: '2026-03-20', time: '09:55', title: '抵達 First 菲斯特山', city: '格林德瓦', category: 'spot', note: '懸崖步道 & Bachalpsee', order: 1 },
      { date: '2026-03-20', time: '14:30', title: '抵達 Lauterbrunnen 瀑布谷', city: '勞特布龍嫩', category: 'spot', note: '施陶巴赫瀑布', order: 2 },
      { date: '2026-03-20', time: '17:30', title: 'Wengen 溫根小鎮', city: '溫根', category: 'spot', note: '街拍 1 小時', order: 3 },
      { date: '2026-03-21', time: '10:00', title: 'Mürren 米倫村落拍攝', city: '米倫', category: 'spot', order: 1 },
      { date: '2026-03-21', time: '17:00', title: 'Lauterbrunnen 黃昏補拍', city: '勞特布龍嫩', category: 'spot', order: 2 },
      { date: '2026-03-22', time: '08:30', title: '黃金列車前往琉森', city: '因特拉肯', category: 'transport', order: 1 },
      { date: '2026-03-22', time: '10:30', title: '卡貝爾橋 & 老城', city: '琉森', category: 'spot', order: 2 },
      { date: '2026-03-23', time: '13:30', title: '抵達米蘭 Milano Centrale', city: '米蘭', category: 'transport', order: 1 },
      { date: '2026-03-24', time: '09:30', title: '米蘭主教座堂 Duomo', city: '米蘭', category: 'spot', order: 1 },
      { date: '2026-03-25', time: '16:00', title: '抵達 Zermatt 策馬特', city: '策馬特', category: 'hotel', order: 1 },
      { date: '2026-03-26', time: '05:45', title: '馬特洪峰 日出藍調', city: '策馬特', category: 'spot', order: 1 },
      { date: '2026-03-27', time: '09:30', title: 'Gornergrat 觀景台', city: '策馬特', category: 'spot', order: 1 },
      { date: '2026-03-28', time: '09:30', title: 'Sunnegga 倒影湖', city: '策馬特', category: 'spot', order: 1 },
      { date: '2026-03-29', time: '09:00', title: '策馬特備用休息日', city: '策馬特', category: 'spot', order: 1 },
      { date: '2026-03-30', time: '12:00', title: '抵達蘇黎世機場', city: '蘇黎世', category: 'transport', order: 1 },
      { date: '2026-03-30', time: '15:30', title: '蘇黎世起飛回程 (EK0088)', city: '蘇黎世', category: 'flight', note: '經杜拜返台', order: 2 }
    ];

    const SWISS_DAYS = Array.from({length: 13}, (_, i) => {
      const d = new Date(2026, 2, 18 + i);
      const weekday = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
      return { id: `2026-03-${18+i}`, label: `Day ${i+1}`, date: `3/${18+i}(${weekday})` };
    });

    /**
     * --- 2. 通用元件 ---
     */
    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[1000] flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md font-black">
          <div className="bg-[#F7F4EB] w-full max-w-lg rounded-t-[3.5rem] sm:rounded-[3.5rem] p-8 shadow-2xl overflow-y-auto max-h-[90vh] border-t-8 border-[#8E9775] border-x-[6px] border-white animate-fade-in">
            <div className="flex justify-between items-center mb-8">
              <h2 className="text-3xl font-black text-[#1C1912] tracking-tighter">{title}</h2>
              <button onClick={onClose} className="p-3 bg-white rounded-full shadow-lg text-gray-400">✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    };

    /**
     * --- 3. App 主程式 ---
     */
    function App() {
      const [activeTab, setActiveTab] = useState('schedule');
      const [selectedDay, setSelectedDay] = useState('2026-03-18');
      const [user, setUser] = useState(null);
      const [schedules, setSchedules] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [todos, setTodos] = useState([]);
      const [members, setMembers] = useState(["Zora", "旅伴A", "旅伴B"]);
      const [dailyMeta, setDailyMeta] = useState({});
      const [appTitle, setAppTitle] = useState("SWISS 2026");
      
      const [isLoading, setIsLoading] = useState(true);
      const [isAddingModalOpen, setIsAddingModalOpen] = useState(false);
      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [confirmData, setConfirmData] = useState(null);

      // --- 身分驗證 (解決 Permission Denied 的關鍵) ---
      useEffect(() => {
        if (!auth) return;
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Auth Init Error:", err);
          }
        };
        initAuth();
        const unsubAuth = onAuthStateChanged(auth, (u) => {
          if (u) {
            setUser(u);
          } else {
            setIsLoading(false);
          }
        });
        
        // 超時保險絲
        const timer = setTimeout(() => setIsLoading(false), 5000);
        return () => { unsubAuth(); clearTimeout(timer); };
      }, []);

      // --- 資料監聽器 (必須等待 user 驗證完成) ---
      useEffect(() => {
        if (!user || !db) return;

        const publicRef = (collName) => collection(db, 'artifacts', appId, 'public', 'data', collName);
        const errorFn = (err) => console.error("Firestore Permission Error:", err);

        const unsubS = onSnapshot(publicRef('schedules'), (snap) => {
          if (snap.empty) {
            INITIAL_SCHEDULES.forEach(i => addDoc(publicRef('schedules'), { ...i, done: false, timestamp: Date.now() }));
          } else {
            setSchedules(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          }
          setIsLoading(false);
        }, errorFn);

        const unsubE = onSnapshot(publicRef('expenses'), (snap) => {
          setExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }, errorFn);

        const unsubM = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'members'), (snap) => {
          if (snap.exists()) setMembers(snap.data().list);
        }, errorFn);

        const unsubT = onSnapshot(publicRef('todos'), (snap) => {
          setTodos(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }, errorFn);

        const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), (snap) => {
          if (snap.exists()) {
            setAppTitle(snap.data().title || "SWISS 2026");
            setDailyMeta(snap.data().dailyMeta || {});
          }
        }, errorFn);

        return () => { unsubS(); unsubE(); unsubM(); unsubT(); unsubSettings(); };
      }, [user]);

      // --- 互動功能 ---
      const askConfirm = (action, title, message) => setConfirmData({ action, title, message });

      const handleUpdateAppTitle = async (val) => {
        if (!user || !db) return;
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), { title: val }, { merge: true });
      };

      const handleUpdateDailyTitle = async (val) => {
        if (!user || !db) return;
        const newMeta = { ...dailyMeta, [selectedDay]: { ...dailyMeta[selectedDay], title: val } };
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), { dailyMeta: newMeta }, { merge: true });
      };

      const toggleSchedule = async (id, status) => {
        if (!user || !db) return;
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id), { done: !status });
      };

      const deleteSchedule = (id) => askConfirm(async () => {
        if (!user || !db) return;
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id));
        setConfirmData(null);
      }, "刪除行程", "確定要刪除這項行程嗎？");

      const handleAddMember = async (name) => {
        if (!name || members.includes(name) || !user || !db) return;
        const newList = [...members, name];
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'members'), { list: newList });
      };

      const handleDeleteMember = (idx) => askConfirm(async () => {
        if (!user || !db) return;
        const newList = members.filter((_, i) => i !== idx);
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'members'), { list: newList });
        setConfirmData(null);
      }, "移除成員", "確定要移除此旅伴？");

      const handleUploadPhoto = async (itemId, slot, file) => {
        if (!file || !user || !db) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
          const updateObj = {}; updateObj[`photo${slot}`] = e.target.result;
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', itemId), updateObj);
        };
        reader.readAsDataURL(file);
      };

      // --- 計算 ---
      const currentItems = useMemo(() => 
        schedules.filter(s => s.date === selectedDay).sort((a,b) => a.time.localeCompare(b.time)),
      [schedules, selectedDay]);

      const totalExpenseTWD = useMemo(() => 
        expenses.reduce((acc, ex) => acc + (ex.amount * (ex.currency === 'CHF' ? RATE_CHF : 1)), 0),
      [expenses]);
      
      const toggleTodo = async (id, status) => {
          if (!user || !db) return;
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'todos', id), { done: !status });
      };

      return (
        <div className="min-h-screen bg-[#CFC8B3] text-[#1C1912] font-sans overflow-x-hidden select-none font-black">
          
          {/* 載入中遮罩 */}
          {isLoading && (
            <div className="fixed inset-0 z-[2000] bg-[#CFC8B3] flex flex-col items-center justify-center font-black">
              <RefreshCw className="animate-spin text-[#8E9775] mb-4" size={48} />
              <p className="font-black text-[#4A4E40] tracking-widest text-xs uppercase font-black">Connecting Swiss Cloud...</p>
            </div>
          )}

          {/* 頂部 Header */}
          <header className="sticky top-0 z-[100] bg-[#CFC8B3]/95 backdrop-blur-xl px-6 py-10 flex justify-between items-center border-b-[3px] border-black/10 shadow-2xl font-black">
            <div className="flex items-center gap-5">
              <div className="w-16 h-16 bg-[#1C1912] rounded-[2.2rem] flex items-center justify-center text-[#CFC8B3] shadow-xl rotate-3 border-4 border-white/10">
                <MapIcon size={32} strokeWidth={3} />
              </div>
              <div className="flex-1 font-black">
                <input 
                  value={appTitle} 
                  onChange={(e) => setAppTitle(e.target.value)}
                  onBlur={(e) => handleUpdateAppTitle(e.target.value)}
                  className="bg-transparent font-black text-3xl tracking-tighter w-full outline-none border-none focus:text-[#8E9775]"
                />
                <p className="text-[10px] text-[#8E9775] font-black uppercase tracking-[0.5em] opacity-80 leading-none mt-1 uppercase font-mono">Shared Diary</p>
              </div>
            </div>
            <button onClick={() => setIsAddingModalOpen(true)} className="bg-[#8E9775] text-white w-14 h-14 rounded-[1.5rem] shadow-2xl flex items-center justify-center border-[4px] border-white active:scale-50 transition-all shadow-lg">
              <Plus size={32} strokeWidth={5} />
            </button>
          </header>

          <main className="px-6 py-8 max-w-lg mx-auto min-h-[70vh] font-black page-content-padding">
            
            {/* 行程分頁 */}
            {activeTab === 'schedule' && (
              <div className="space-y-6 animate-fade-in font-black">
                <div className="bg-blue-500 rounded-[2.5rem] p-6 text-white shadow-xl flex justify-between items-center mb-8 relative overflow-hidden font-black shadow-lg">
                  <div className="z-10 flex-1 font-black">
                    <div className="flex items-center gap-2 mb-2 font-black"><MapPin size={16} /><span className="text-[10px] font-black uppercase tracking-widest opacity-60">Swiss Weather</span></div>
                    <h3 className="text-2xl font-black mb-1">晴時多雲</h3>
                    <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-[11px] font-bold opacity-80 font-black tracking-tight mt-1 uppercase"><span>降雨: 10%</span><span>能見度: 15km</span></div>
                  </div>
                  <MapIcon size={64} className="opacity-20 rotate-12" />
                </div>

                <div className="bg-white/40 rounded-[2.5rem] p-6 mb-6 border-2 border-white shadow-inner font-black">
                  <p className="text-[10px] font-black uppercase text-[#8E9775] mb-3 tracking-widest leading-none font-black uppercase">Daily Summary 大綱</p>
                  <div className="space-y-3 mt-4 font-black">
                    {currentItems.map(item => (
                      <div key={item.id} className="flex items-center gap-4 text-xs font-black border-b border-black/5 pb-2 uppercase font-black">
                        <span className="text-[#8E9775] font-mono w-10 shrink-0 font-black">{item.time}</span>
                        <span className="flex-1 truncate text-[#1C1912]/70 font-black">{item.title}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex gap-4 overflow-x-auto pb-6 no-scrollbar touch-pan-x font-black">
                  {SWISS_DAYS.map(day => (
                    <button 
                      key={day.id} 
                      onClick={() => setSelectedDay(day.id)}
                      className={`flex-shrink-0 flex flex-col items-center justify-center min-w-[85px] h-[85px] rounded-[2.2rem] transition-all border-[3.5px] ${selectedDay === day.id ? 'date-active scale-110 shadow-lg' : 'bg-white/40 text-[#1C1912]/40 border-transparent font-black'}`}
                    >
                      <span className="text-[9px] font-black opacity-70 uppercase tracking-widest leading-none mb-1">{day.label}</span>
                      <span className="text-[13px] font-black font-mono leading-none">{day.date.split('(')[0]}</span>
                    </button>
                  ))}
                </div>

                <div className="relative pl-14 space-y-10 mt-10 font-black pb-20">
                  <div className="absolute left-[1.65rem] top-8 bottom-8 w-[3.5px] bg-[#1C1912]/10 rounded-full font-black" />
                  {currentItems.map((item, idx) => {
                    const isRunner = idx === currentItems.findIndex(i => !i.done);
                    return (
                      <div key={item.id} className="relative animate-fade-in group font-black">
                        <div 
                          onClick={() => toggleSchedule(item.id, item.done)}
                          className={`absolute -left-[3.25rem] top-8 z-20 w-12 h-12 rounded-full border-[5px] border-[#CFC8B3] flex items-center justify-center shadow-xl transition-all ${item.done ? 'bg-green-500 text-white shadow-green-200' : 'bg-white'}`}
                        >
                          {item.done ? <Check size={24} strokeWidth={4} /> : (isRunner ? <span className="text-2xl animate-bounce">🏃</span> : <div className="w-3 h-3 rounded-full bg-black/10" />)}
                        </div>
                        
                        <div onClick={() => setEditingItem(item)} className={`bg-white rounded-[2.5rem] journal-card p-6 relative active:scale-95 transition-all ${item.done ? 'opacity-50 grayscale border-transparent' : 'cursor-pointer hover:border-[#8E9775] shadow-xl'}`}>
                          <div className={`absolute top-0 right-0 w-4 h-full rounded-r-[1.8rem] ${CATEGORY_COLORS[item.category] || 'bg-gray-400'}`} />
                          <div className="flex flex-col gap-4 font-black">
                            <div className="flex justify-between items-start font-black">
                              <span className="text-[10px] font-black bg-[#1C1912]/5 text-[#1C1912]/40 px-3 py-1 rounded-lg tracking-widest uppercase font-black">📍 {item.city}</span>
                              <button onClick={(e) => {e.stopPropagation(); deleteSchedule(item.id)}} className="text-[#4A4E40] opacity-20 hover:opacity-100 p-1 font-black transition-opacity"><Trash2 size={18}/></button>
                            </div>
                            <div className="flex flex-col gap-1 font-black">
                              <span className="text-sm font-black text-[#8E9775] font-mono tracking-tighter leading-none italic uppercase font-black italic">{item.time}</span>
                              <h3 className="text-xl font-black text-[#1C1912] leading-tight flex-1 pr-4 tracking-tighter font-black font-black uppercase font-black tracking-tight">{item.title}</h3>
                            </div>
                            <div className="grid grid-cols-2 gap-2 font-black">
                              {[1, 2].map(slot => (
                                <div key={slot} className="relative group/photo aspect-square bg-gray-100 rounded-2xl border-2 border-dashed border-black/5 flex items-center justify-center overflow-hidden font-black">
                                  {item[`photo${slot}`] ? <img src={item[`photo${slot}`]} className="w-full h-full object-cover" /> : <CameraIcon className="text-black/10" size={32} />}
                                  <input type="file" accept="image/*" onClick={(e) => e.stopPropagation()} onChange={(e) => handleUploadPhoto(item.id, slot, e.target.files[0])} className="absolute inset-0 opacity-0 cursor-pointer font-black" />
                                </div>
                              ))}
                            </div>
                            {item.note && <p className="text-[12px] text-[#1C1912]/60 font-black italic border-l-[4px] border-[#8E9775]/20 pl-4 py-1 leading-relaxed bg-black/5 rounded-r-xl font-black italic font-black italic">“ {item.note} ”</p>}
                            {item.details && <p className="text-[10px] font-black text-[#8E9775] flex items-center gap-1 uppercase tracking-widest opacity-60 font-black font-black uppercase tracking-widest leading-none"><Info size={12}/> 詳細備註</p>}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                  <div key={idx} className="bg-white p-6 rounded-[2rem] border-2 border-black/5 flex justify-between items-center group shadow-xl transition-all font-black uppercase tracking-tight font-black font-black font-black font-black font-black font-black font-black">
                    <span className="font-black text-2xl font-mono tracking-tighter font-black italic uppercase leading-none font-black font-black font-black font-black font-black font-black font-black">@{m}</span>
                    <button onClick={() => handleDeleteMember(idx)} className="text-red-200 hover:text-red-500 p-3 font-black transition-all p-3 bg-gray-50 rounded-2xl shadow-sm font-black font-black font-black font-black font-black font-black font-black"><Trash2 size={22}/></button>
                  </div>
                ))}
              </div>
              <div className="flex gap-4 font-black uppercase font-black font-black font-black font-black font-black font-black font-black">
                <input id="new-member-input" placeholder="夥伴名字..." className="flex-1 p-7 rounded-[2rem] border-4 border-gray-100 shadow-inner font-black uppercase shadow-inner uppercase font-black uppercase text-xl outline-none focus:border-[#8E9775] transition-colors font-black font-black font-black font-black font-black font-black font-black font-black" />
                <button onClick={() => {
                  const input = document.getElementById('new-member-input');
                  handleAddMember(input.value);
                  input.value = "";
                }} className="bg-[#8E9775] text-white px-10 rounded-[2rem] font-black active:scale-95 shadow-lg font-black uppercase font-black tracking-widest shadow-lg shadow-[#8E9775]/30 font-black font-black font-black font-black font-black font-black font-black">新增</button>
              </div>
              <button onClick={() => setIsMemberModalOpen(false)} className="w-full py-9 bg-[#4A4E40] text-white rounded-[3rem] font-black mt-4 shadow-xl active:scale-95 uppercase tracking-widest font-black uppercase tracking-widest shadow-2xl font-black font-black font-black font-black font-black font-black font-black font-black">完成名單更新</button>
            </div>
          </Modal>

          <Modal isOpen={!!editingItem} onClose={() => setEditingItem(null)} title="筆記詳情編輯">
            <div className="space-y-6 font-black animate-fade-in font-black tracking-tight uppercase font-black font-black font-black font-black font-black font-black">
              <input 
                value={editingItem?.title || ""} 
                onChange={(e) => setEditingItem({...editingItem, title: e.target.value})}
                className="w-full p-8 rounded-[2rem] border-4 border-gray-100 font-black outline-none tracking-tighter text-2xl font-black shadow-inner uppercase focus:border-[#8E9775] font-black font-black font-black font-black font-black font-black font-black font-black" 
              />
              <textarea 
                rows="6" 
                placeholder="在此記錄詳細資訊..."
                value={editingItem?.details || ""}
                onChange={(e) => setEditingItem({...editingItem, details: e.target.value})}
                className="w-full p-8 rounded-[2rem] border-4 border-gray-100 font-black placeholder-gray-300 outline-none tracking-tighter font-black shadow-inner leading-relaxed uppercase focus:border-[#8E9775] text-xl font-black font-black font-black font-black font-black font-black font-black font-black"
              />
              <button 
                onClick={async () => {
                  await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', editingItem.id), {
                    title: editingItem.title,
                    details: editingItem.details
                  });
                  setEditingItem(null);
                }}
                className="w-full bg-[#4A4E40] text-white py-9 rounded-[3.5rem] font-black shadow-xl active:scale-95 uppercase font-black shadow-2xl font-black uppercase tracking-widest font-black font-black font-black font-black font-black font-black font-black font-black"
              >
                儲存筆記內容
              </button>
            </div>
          </Modal>

          {/* 確認彈窗 */}
          {confirmData && (
            <div className="fixed inset-0 z-[2000] flex items-center justify-center p-6 bg-black/90 backdrop-blur-md font-black animate-fade-in font-black font-black font-black font-black">
              <div className="bg-white w-full max-w-sm rounded-[3.5rem] p-14 shadow-2xl confirm-modal border-[8px] border-[#F7F4EB] text-center font-black shadow-2xl font-black tracking-tight font-black font-black font-black font-black font-black">
                <div className="w-24 h-24 bg-[#8E9775]/10 rounded-full flex items-center justify-center mx-auto mb-10 font-black shadow-inner font-black font-black font-black font-black font-black font-black"><AlertCircle className="text-[#8E9775] w-14 h-14" strokeWidth={3} /></div>
                <h3 className="text-3xl font-black text-[#1C1912] mb-5 tracking-tighter uppercase font-black italic font-black font-black font-black font-black font-black font-black">{confirmData.title}</h3>
                <p className="text-sm font-black text-gray-400 mb-12 leading-relaxed font-black uppercase tracking-widest font-black font-black font-black font-black font-black font-black">{confirmData.message}</p>
                <div className="flex gap-6 font-black font-black font-black font-black font-black font-black font-black">
                  <button onClick={() => setConfirmData(null)} className="flex-1 py-7 bg-gray-100 rounded-3xl font-black text-gray-500 active:scale-95 font-black uppercase tracking-widest text-xs shadow-sm font-black font-black font-black font-black">取消</button>
                  <button onClick={confirmData.action} className="flex-1 py-7 bg-[#4A4E40] text-white rounded-3xl font-black shadow-lg shadow-[#4A4E40]/30 active:scale-95 font-black uppercase tracking-widest text-xs shadow-lg font-black uppercase font-black uppercase font-black font-black font-black font-black font-black">確定執行</button>
                </div>
              </div>
            </div>
          )}

          <style>{`
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
            @keyframes fade-in { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
            .animate-fade-in { animation: fade-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
            .item-done { opacity: 0.4; filter: grayscale(1); border-color: rgba(0,0,0,0.05) !important; transform: scale(0.98); }
            .journal-card { border-width: 3px; border-color: #4A4433; border-style: solid; box-shadow: 18px 18px 0px rgba(0,0,0,0.1); transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
            .page-content-padding { padding-bottom: 500px; }
            .date-active { background-color: #8E9775 !important; color: white !important; border-color: white !important; transform: scale(1.2) rotate(-3deg); box-shadow: 0 20px 45px -5px rgba(142, 151, 117, 0.7); font-weight: 900; }
            input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(47%) sepia(13%) saturate(583%) hue-rotate(36deg) brightness(97%) contrast(87%); transform: scale(1.8); }
          `}</style>

        </div>
      );
    }
    
    // 將 App 掛載到頁面上
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
