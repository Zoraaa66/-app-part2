<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swiss Diary 2026 - Cloud Flagship v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --morandi-green: #8E9775;
            --morandi-dark: #4A4E40;
            --morandi-light: #E1E5D5;
            --journal-bg: #CFC8B3;
        }

        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: var(--journal-bg); color: #1C1912; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        
        .date-active { background-color: var(--morandi-green); color: white; border-color: white; transform: scale(1.1); font-weight: 900; box-shadow: 0 10px 15px -3px rgba(142, 151, 117, 0.4); }
        .text-morandi { color: var(--morandi-green); }
        .bg-morandi { background-color: var(--morandi-green); }
        .text-dark-green { color: var(--morandi-dark); }
        .bg-dark-green { background-color: var(--morandi-dark); }

        .item-done { opacity: 0.6; filter: grayscale(0.7); background-color: #E2E8F0 !important; border-color: transparent !important; }
        .running-man { transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        
        .chat-bubble-me { border-radius: 1.5rem; border-bottom-right-radius: 0.2rem; background-color: var(--morandi-green); color: white; }
        .confirm-modal { animation: pop-up 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop-up { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .journal-card { border-width: 3px; border-color: #4A4433; border-style: solid; }
        .loading-overlay { background: var(--journal-bg); z-index: 1000; transition: opacity 0.5s ease; }
        .page-content-padding { padding-bottom: 150px; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden select-none">

    <!-- 載入中遮罩 -->
    <div id="loading-spinner" class="fixed inset-0 flex flex-col items-center justify-center loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-morandi border-t-transparent"></div>
        <p class="mt-4 font-black text-dark-green tracking-widest uppercase text-xs">Synchronizing Swiss Pro Data...</p>
    </div>

    <!-- 頂部標題列 -->
    <header class="sticky top-0 z-50 bg-[#CFC8B3]/95 backdrop-blur-xl px-6 py-10 flex justify-between items-center border-b-[3px] border-black/10 shadow-2xl">
        <div class="flex items-center gap-5">
            <div class="w-16 h-16 bg-[#1C1912] rounded-[2.2rem] flex items-center justify-center text-[#CFC8B3] shadow-xl rotate-3 border-4 border-white/10">
                <i data-lucide="map"></i>
            </div>
            <div class="flex-1">
                <input id="app-main-title" type="text" value="SWISS 2026" onchange="askConfirm(() => saveAppTitle(this.value), '更改標題', '確定要更改旅程主標題嗎？')" class="bg-transparent font-black text-3xl tracking-tighter w-full outline-none border-none focus:text-dark-green transition-colors">
                <p class="text-[10px] text-morandi font-black uppercase tracking-[0.5em] opacity-80">Shared Travel Diary</p>
            </div>
        </div>
        <button onclick="openAddModal()" class="bg-morandi text-white w-14 h-14 rounded-[1.5rem] shadow-2xl flex items-center justify-center border-[4px] border-white active:scale-50 transition-all">
            <i data-lucide="plus" class="stroke-[4px]"></i>
        </button>
    </header>

    <main id="app-content" class="px-6 py-8 max-w-lg mx-auto min-h-[70vh] page-content-padding">
        <!-- 內容動態填充 -->
    </main>

    <!-- 底部導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1C1912]/98 backdrop-blur-3xl px-2 py-6 flex justify-around items-center z-[60] rounded-t-[4rem] shadow-[0_-30px_100px_rgba(0,0,0,0.6)] border-t border-white/10 max-w-lg mx-auto">
        <button onclick="switchTab('schedule')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-schedule">
            <i data-lucide="calendar" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">行程</span>
        </button>
        <button onclick="switchTab('booking')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-booking">
            <i data-lucide="layers" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">憑證</span>
        </button>
        <button onclick="switchTab('expense')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-expense">
            <i data-lucide="wallet" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">記帳</span>
        </button>
        <button onclick="switchTab('planning')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-planning">
            <i data-lucide="check-square" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">準備</span>
        </button>
        <button onclick="switchTab('chat')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-chat">
            <i data-lucide="message-square" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">日記</span>
        </button>
    </nav>

    <!-- 萬能彈窗 Modal -->
    <div id="modal-overlay" class="fixed inset-0 z-[100] hidden flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="bg-[#F7F4EB] w-full max-w-lg rounded-t-[3.5rem] sm:rounded-[3.5rem] p-8 shadow-2xl overflow-y-auto max-h-[90vh] border-t-8 border-morandi border-x-[6px] border-white">
            <div class="flex justify-between items-center mb-8">
                <h2 id="modal-title" class="text-3xl font-black text-[#1C1912] tracking-tighter">標題</h2>
                <button onclick="closeModal()" class="p-3 bg-white rounded-full shadow-lg text-gray-400 active:scale-75 transition-all">✕</button>
            </div>
            <div id="modal-body" class="space-y-6"></div>
        </div>
    </div>

    <!-- 二次確認彈窗 -->
    <div id="confirm-overlay" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-6 bg-black/80 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-10 shadow-2xl confirm-modal border-[6px] border-[#F7F4EB] text-center">
            <div class="w-20 h-20 bg-morandi/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="alert-triangle" class="text-morandi w-10 h-10"></i>
            </div>
            <h3 id="confirm-title" class="text-2xl font-black text-[#1C1912] mb-3 tracking-tighter">確認動作</h3>
            <p id="confirm-message" class="text-sm font-bold text-gray-400 mb-8 leading-relaxed">您確定要執行此操作嗎？</p>
            <div class="flex gap-4">
                <button onclick="closeConfirmModal()" class="flex-1 py-5 bg-gray-100 rounded-2xl font-black text-gray-500 active:scale-95">取消</button>
                <button id="confirm-action-btn" class="flex-1 py-5 bg-dark-green text-white rounded-2xl font-black shadow-lg shadow-dark-green/30 active:scale-95">確定</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, writeBatch 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'swiss-pro-v3-final';

        // --- 核心狀態 ---
        let appMainTitle = "SWISS 2026";
        let currentTab = 'schedule';
        let currentActiveDay = '2026-03-18';
        let members = ["Zora", "成員A", "成員B"];
        const APP_USER = "Zora"; 
        const RATE_CHF = 36.8;

        let schedules = [];
        let expenses = [];
        let chatMessages = [];
        let todos = [];
        let dailyMetadata = {};

        const SWISS_DAYS = Array.from({length: 13}, (_, i) => ({ id: `2026-03-${18+i}`, label: `Day ${i+1}`, date: `3/${18+i}` }));

        // --- 13 天定稿版行程數據 (分鐘級) ---
        const INITIAL_DATA_PLANS = [
            { date: '2026-03-18', time: '12:25', title: '抵達蘇黎世機場', city: '蘇黎世', cat: 'flight', note: '入境、領行李、買水/點心 (75分)', order: 1 },
            { date: '2026-03-18', time: '13:45', title: 'Zurich Airport 出發', city: '蘇黎世', cat: 'transport', note: '火車前往 Interlaken Ost', order: 2 },
            { date: '2026-03-18', time: '16:45', title: '飯店入住 Check-in', city: '因特拉肯', cat: 'hotel', note: '放行李 (45分)', order: 3 },
            { date: '2026-03-18', time: '17:45', title: 'Aare River & Hohematte 草地', city: '因特拉肯', cat: 'spot', note: '黃昏+藍調拍攝', order: 4 },

            { date: '2026-03-19', time: '08:30', title: 'Interlaken Ost 出發', city: '因特拉肯', cat: 'transport', order: 1 },
            { date: '2026-03-19', time: '09:30', title: '搭乘 Eiger Express 艾格快線', city: '格林德瓦', cat: 'transport', order: 2 },
            { date: '2026-03-19', time: '10:15', title: '抵達少女峰 Jungfraujoch', city: '少女峰', cat: 'spot', note: '斯芬克斯、阿萊奇冰川、冰原平台', order: 3 },
            { date: '2026-03-19', time: '16:30', title: 'Grindelwald 村落街拍', city: '格林德瓦', cat: 'spot', note: '停留 2 小時', order: 4 },

            { date: '2026-03-20', time: '09:55', title: '抵達 First 菲斯特山', city: '格林德瓦', cat: 'spot', note: '懸崖步道 & Bachalpsee', order: 1 },
            { date: '2026-03-20', time: '14:30', title: '抵達 Lauterbrunnen 瀑布谷', city: '勞特布龍嫩', cat: 'spot', note: '施陶巴赫瀑布', order: 2 },
            { date: '2026-03-20', time: '17:30', title: 'Wengen 溫根小鎮', city: '溫根', cat: 'spot', note: '街拍 1 小時', order: 3 },

            { date: '2026-03-21', time: '09:45', title: '抵達 Mürren 米倫', city: '米倫', cat: 'spot', note: '村落拍攝', order: 1 },
            { date: '2026-03-21', time: '12:00', title: '雪朗峰 Schilthorn', city: '米倫', cat: 'spot', note: '決策點：雲多則留在米倫', order: 2 },
            { date: '2026-03-21', time: '17:00', title: 'Lauterbrunnen 黃昏逆光', city: '勞特布龍嫩', cat: 'spot', order: 3 },

            { date: '2026-03-22', time: '10:30', title: '抵達琉森 Luzern', city: '琉森', cat: 'spot', note: '黃金列車系統', order: 1 },
            { date: '2026-03-22', time: '14:00', title: '垂死獅子像 & 老城', city: '琉森', cat: 'spot', order: 2 },
            { date: '2026-03-22', time: '17:30', title: '因特拉肯河岸藍調', city: '因特拉肯', cat: 'spot', order: 3 },

            { date: '2026-03-23', time: '13:30', title: '抵達米蘭 Milano Centrale', city: '米蘭', cat: 'transport', order: 1 },
            { date: '2026-03-23', time: '15:30', title: 'Navigli Grande 大運河區', city: '米蘭', cat: 'spot', order: 2 },

            { date: '2026-03-24', time: '09:30', title: '米蘭主教座堂 Duomo', city: '米蘭', cat: 'spot', order: 1 },
            { date: '2026-03-24', time: '14:00', title: '拱廊 & 精品購物', city: '米蘭', cat: 'spot', order: 2 },

            { date: '2026-03-25', time: '16:00', title: '抵達 Zermatt 策馬特', city: '策馬特', cat: 'transport', order: 1 },
            { date: '2026-03-25', time: '16:30', title: '小鎮街景 & 初見峰', city: '策馬特', cat: 'spot', order: 2 },

            { date: '2026-03-26', time: '05:45', title: '馬特洪峰日出拍攝', city: '策馬特', cat: 'spot', order: 1 },
            { date: '2026-03-26', time: '09:30', title: '教堂橋 & 老村 Hinterdorf', city: '策馬特', cat: 'spot', order: 2 },

            { date: '2026-03-27', time: '09:30', title: 'Gornergrat 觀景台', city: '策馬特', cat: 'spot', order: 1 },
            { date: '2026-03-27', time: '12:00', title: 'Riffelsee 倒影湖拍攝', city: '策馬特', cat: 'spot', order: 2 },

            { date: '2026-03-28', time: '09:30', title: 'Sunnegga 倒影湖', city: '策馬特', cat: 'spot', order: 1 },
            { date: '2026-03-28', time: '12:00', title: 'Findeln 芬德倫山村', city: '策馬特', cat: 'spot', order: 2 },

            { date: '2026-03-29', time: '09:00', title: '策馬特備用日', city: '策馬特', cat: 'spot', note: '自由補拍/休息', order: 1 },

            { date: '2026-03-30', time: '12:00', title: '抵達蘇黎世機場', city: '蘇黎世', cat: 'transport', order: 1 },
            { date: '2026-03-30', time: '15:30', title: '蘇黎世起飛回程 (EK0088)', city: '蘇黎世', cat: 'flight', order: 2 }
        ];

        // --- 授權與同步 ---
        async function startApp() {
            // 超時保險：如果連線超過 5 秒，強制隱藏轉圈圈
            setTimeout(() => {
                const spinner = document.getElementById('loading-spinner');
                if (spinner) spinner.classList.add('hidden');
            }, 5000);

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                onAuthStateChanged(auth, (user) => { if (user) initRealtimeSync(); });
            } catch (err) {
                console.error("Auth Error:", err);
                document.getElementById('loading-spinner').classList.add('hidden');
            }
        }

        function initRealtimeSync() {
            const publicPath = (coll) => collection(db, 'artifacts', appId, 'public', 'data', coll);
            const errorFn = (err) => { console.error("Sync Error:", err); document.getElementById('loading-spinner').classList.add('hidden'); };

            onSnapshot(publicPath('schedules'), (snap) => {
                if (snap.empty) {
                    INITIAL_DATA_PLANS.forEach(i => addDoc(publicPath('schedules'), { ...i, done: false, timestamp: Date.now() }));
                } else {
                    schedules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                }
                document.getElementById('loading-spinner').classList.add('hidden');
            }, errorFn);

            onSnapshot(publicPath('expenses'), (snap) => { expenses = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, errorFn);
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'members', 'list'), (snap) => { if (snap.exists()) members = snap.data().list || ["Zora"]; render(); }, errorFn);
            onSnapshot(publicPath('todos'), (snap) => { todos = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, errorFn);
            onSnapshot(publicPath('chat'), (snap) => { chatMessages = snap.docs.map(d => d.data()).sort((a,b) => a.timestamp - b.timestamp); render(); }, errorFn);
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), (d) => { if (d.exists()) { appMainTitle = d.data().title || "SWISS 2026"; dailyMetadata = d.data().dailyMeta || {}; render(); } }, errorFn);
        }

        // --- 渲染核心 ---
        function render() {
            const container = document.getElementById('app-content');
            if (!container) return;
            updateNavStyles();
            document.getElementById('app-main-title').value = appMainTitle;

            if (currentTab === 'schedule') {
                const meta = dailyMetadata[currentActiveDay] || { title: '未命名行程主題', location: '瑞士', weather: '--', rain: '--', visibility: '--', fog: '--' };
                container.innerHTML = `
                    <div class="bg-blue-500 rounded-[2.5rem] p-6 text-white shadow-xl flex justify-between items-center mb-8 relative overflow-hidden animate-fade-in">
                        <div class="z-10 flex-1">
                            <div class="flex items-center gap-2 mb-2"><i data-lucide="map-pin" class="w-4 h-4 opacity-60"></i><span class="text-[10px] font-black opacity-60 tracking-widest">${meta.location} Weather</span></div>
                            <h3 class="text-2xl font-black mb-1">${meta.weather}</h3>
                            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-[11px] font-bold opacity-80"><span>降雨: ${meta.rain}</span><span>能見度: ${meta.visibility}</span></div>
                        </div>
                        <i data-lucide="sun" class="w-16 h-16 opacity-30"></i>
                    </div>
                    <div class="bg-white/40 rounded-[2.5rem] p-6 mb-6 border-2 border-white shadow-inner">
                        <p class="text-[10px] font-black uppercase text-morandi mb-3">Daily Minutes / 分鐘行程表</p>
                        <div class="space-y-3">${renderSummaryTable()}</div>
                    </div>
                    <div class="mb-8 px-4 py-5 bg-white/30 rounded-3xl border-b-[6px] border-morandi shadow-lg">
                        <p class="text-[9px] font-black uppercase text-morandi opacity-60 mb-1">Today's Journey Topic</p>
                        <input onchange="askConfirm(() => saveDailyTitle(this.value), '更新主題', '確定更換今日主題？')" class="bg-transparent border-none text-morandi font-black text-2xl outline-none w-full" value="${meta.title}">
                    </div>
                    <div class="flex gap-4 overflow-x-auto pb-6 no-scrollbar touch-pan-x" id="date-scroll">${renderDateButtons()}</div>
                    <div class="relative pl-14 space-y-10 mt-10" id="schedule-container">
                        <div class="absolute left-[1.65rem] top-8 bottom-8 w-[3.5px] bg-[#1C1912]/10 rounded-full"></div>
                        ${renderScheduleItems()}
                    </div>`;
            } else if (currentTab === 'booking') { renderBookingPage(container); }
            else if (currentTab === 'expense') { renderExpensePage(container); }
            else if (currentTab === 'planning') { renderPlanningPage(container); }
            else if (currentTab === 'chat') { renderChatPage(container); }
            lucide.createIcons();
        }

        function renderDateButtons() {
            return SWISS_DAYS.map(day => `
                <button onclick="selectDay('${day.id}')" class="flex-shrink-0 flex flex-col items-center justify-center min-w-[75px] h-[75px] rounded-[2.2rem] transition-all border-[3.5px] ${day.id === currentActiveDay ? 'date-active' : 'bg-white/40 text-[#1C1912]/40 border-transparent'}">
                    <span class="text-[9px] uppercase mb-1 opacity-70">${day.label}</span>
                    <span class="text-base font-bold font-mono">${day.date}</span>
                </button>`).join('');
        }

        function renderSummaryTable() {
            const items = schedules.filter(s => s.date === currentActiveDay).sort((a,b) => a.time.localeCompare(b.time));
            if (items.length === 0) return `<p class="text-xs italic opacity-30 text-center py-4">本日行程計畫中...</p>`;
            return items.map(item => `
                <div class="flex items-center gap-4 text-xs font-bold border-b border-black/5 pb-2 uppercase">
                    <span class="text-morandi font-mono w-10 shrink-0">${item.time}</span>
                    <span class="flex-1 truncate">${item.title}</span>
                </div>`).join('');
        }

        function renderScheduleItems() {
            const items = schedules.filter(s => s.date === currentActiveDay).sort((a,b) => a.time.localeCompare(b.time));
            const firstUndoneIdx = items.findIndex(item => !item.done);
            return items.map((item, idx) => {
                const isRunnerHere = idx === (firstUndoneIdx === -1 ? items.length - 1 : firstUndoneIdx);
                const isLastItem = idx === items.length - 1;
                return `
                    <div class="relative animate-fade-in group">
                        <div onclick="toggleSchedule('${item.id}')" class="absolute -left-[3.25rem] top-8 z-20 w-12 h-12 rounded-full border-[5px] border-[#CFC8B3] flex items-center justify-center shadow-xl transition-all ${item.done ? 'bg-green-500' : 'bg-white'}">
                            ${item.done ? '<i data-lucide="check" class="text-white w-6 h-6 stroke-[4px]"></i>' : (isRunnerHere ? '<span class="text-2xl running-man">🏃</span>' : '<div class="w-3 h-3 rounded-full bg-black/10"></div>')}
                        </div>
                        <div onclick="openEditScheduleModal('${item.id}')" class="bg-white rounded-[2.5rem] shadow-[12px_12px_0px_rgba(28,25,18,0.1)] journal-card p-6 relative active:scale-95 transition-all ${item.done ? 'item-done' : 'cursor-pointer'}">
                            <div class="absolute top-0 right-0 w-4 h-full rounded-r-[1.8rem] ${getCatColor(item.cat)}"></div>
                            <div class="flex flex-col gap-4">
                                <div class="flex justify-between items-start">
                                    <span class="text-[10px] font-black bg-[#1C1912]/5 text-[#1C1912]/40 px-3 py-1 rounded-lg tracking-widest uppercase">📍 ${item.city || 'Swiss'}</span>
                                    <button onclick="event.stopPropagation(); deleteSchedule('${item.id}')" class="text-dark-green opacity-20 hover:opacity-100 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-sm font-black text-morandi font-mono tracking-tighter">${item.time}</span>
                                    <h3 class="text-xl font-black text-[#1C1912] leading-tight flex-1 pr-4">${item.title}</h3>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    ${item.photo1 ? `<img src="${item.photo1}" class="aspect-square w-full rounded-2xl object-cover journal-card">` : `<div class="aspect-square bg-gray-100 rounded-2xl border-2 border-dashed border-black/5 flex items-center justify-center cursor-pointer active:bg-gray-200" onclick="event.stopPropagation(); triggerPhotoUpload('${item.id}', 1)"><i data-lucide="camera" class="text-black/10 w-6 h-6"></i></div>`}
                                    ${item.photo2 ? `<img src="${item.photo2}" class="aspect-square w-full rounded-2xl object-cover journal-card">` : `<div class="aspect-square bg-gray-100 rounded-2xl border-2 border-dashed border-black/5 flex items-center justify-center opacity-40 cursor-pointer active:bg-gray-200" onclick="event.stopPropagation(); triggerPhotoUpload('${item.id}', 2)"><i data-lucide="plus" class="text-black/10 w-6 h-6"></i></div>`}
                                </div>
                                ${item.note ? `<p class="text-[12px] text-[#1C1912]/60 font-bold italic border-l-[4px] border-morandi/20 pl-4 py-1 leading-relaxed bg-black/5 rounded-r-xl">“ ${item.note} ”</p>` : ''}
                            </div>
                        </div>
                        ${!isLastItem ? `<div class="ml-4 my-6 p-4 border-l-4 border-dashed border-morandi bg-white/20 rounded-r-2xl text-[10px] font-bold text-dark-green/80 uppercase tracking-tight">AI 交通助手：建議使用 Google Maps 實時導航。</div>` : ''}
                        <input type="file" id="file-${item.id}-1" class="hidden" accept="image/*" onchange="uploadPhoto('${item.id}', 1, this)">
                        <input type="file" id="file-${item.id}-2" class="hidden" accept="image/*" onchange="uploadPhoto('${item.id}', 2, this)">
                    </div>`;
            }).join('');
        }

        function renderBookingPage(container) {
            container.innerHTML = `
                <div class="space-y-10 animate-fade-in pb-20 px-1">
                    <h2 class="text-4xl font-black text-dark-green flex items-center gap-4 px-2 tracking-tighter"><i data-lucide="layers" class="text-morandi"></i> 航班憑證</h2>
                    <!-- 去程 -->
                    <div class="bg-white rounded-[3rem] shadow-2xl border-b-[15px] border-[#AA1D24] mb-8 overflow-hidden journal-card">
                        <div class="bg-[#AA1D24] p-8 text-white flex justify-between items-center font-black italic uppercase leading-none">
                            <div><p class="text-xl tracking-tighter">阿聯酋 • 去程</p><p class="text-[10px] opacity-70 mt-1 uppercase">EK0387 / EK0087</p></div>
                            <div class="bg-black/20 px-4 py-2 rounded-2xl border border-white/20 text-sm">3/18 OK</div>
                        </div>
                        <div class="p-10 space-y-8 font-mono">
                            <div class="flex justify-between items-center text-[#1C1912]">
                                <div><p class="text-4xl font-black">TPE</p><p class="text-sm font-bold opacity-60">00:20</p></div>
                                <i data-lucide="arrow-right"></i>
                                <div><p class="text-4xl font-black opacity-40">DXB</p><p class="text-sm">06:10</p></div>
                            </div>
                            <div class="flex justify-between items-center pt-2">
                                <div class="text-center opacity-40"><p class="text-4xl">DXB</p><p class="text-sm">08:25</p></div>
                                <i data-lucide="arrow-right"></i>
                                <div class="text-center text-[#1C1912]"><p class="text-4xl font-black">ZRH</p><p class="text-sm text-morandi font-bold">12:25</p></div>
                            </div>
                        </div>
                    </div>
                    <!-- 回程航班 (EK0088 / EK0366) -->
                    <div class="bg-white rounded-[3rem] shadow-2xl border-b-[15px] border-dark-green overflow-hidden journal-card opacity-90">
                        <div class="bg-dark-green p-8 text-white flex justify-between items-center font-black italic uppercase leading-none">
                            <div><p class="text-xl tracking-tighter">阿聯酋 • 回程</p><p class="text-[10px] opacity-70 mt-1 uppercase">EK0088 / EK0366</p></div>
                            <div class="bg-white/10 px-4 py-2 rounded-2xl border border-white/10 text-sm font-mono uppercase">Confirmed</div>
                        </div>
                        <div class="p-10 space-y-12 font-mono">
                            <div class="flex justify-between items-center border-b border-dashed pb-6">
                                <div class="text-center text-[#1C1912]"><p class="text-4xl font-black">ZRH</p><p class="text-sm text-morandi font-bold mt-1">15:30</p></div>
                                <div class="flex flex-col items-center opacity-30 font-black"><i data-lucide="arrow-right"></i><span class="text-[10px]">6h 15m</span></div>
                                <div class="text-center opacity-40"><p class="text-4xl font-black">DXB</p><p class="text-sm">23:45</p></div>
                            </div>
                            <div class="flex justify-between items-center pt-4">
                                <div class="text-center opacity-40"><p class="text-4xl font-black">DXB</p><p class="text-sm">03:45</p></div>
                                <div class="flex flex-col items-center opacity-30 font-black"><i data-lucide="arrow-right"></i><span class="text-[10px]">8h 25m</span></div>
                                <div class="text-center text-[#1C1912]"><p class="text-4xl font-black">TPE</p><p class="text-sm text-morandi font-bold mt-1 uppercase">16:10</p></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderExpensePage(container) {
            const memberStats = {}; let totalTWD = 0;
            members.forEach(m => memberStats[m] = 0);
            expenses.forEach(e => {
                const amt = e.currency === 'CHF' ? e.amount * RATE_CHF : e.amount;
                totalTWD += amt; if (memberStats[e.user] !== undefined) memberStats[e.user] += amt;
            });
            container.innerHTML = `
                <div class="space-y-8 animate-fade-in pb-20 px-2">
                    <div class="bg-gradient-to-br from-[#1C1912] to-[#4A4433] rounded-[3rem] p-10 text-white shadow-2xl relative overflow-hidden">
                        <p class="text-[12px] font-black uppercase text-morandi mb-4 tracking-[0.5em]">Budget Stats</p>
                        <h2 class="text-6xl font-black tracking-tighter mb-10 font-mono leading-none"><span class="text-2xl opacity-40">NT$</span> ${Math.round(totalTWD).toLocaleString()}</h2>
                        <div class="space-y-2 border-t border-white/10 pt-8">${members.map(m => `<div class="flex justify-between items-center font-black"><span class="text-sm opacity-60 font-bold">@${m}</span><span class="font-mono">NT$ ${Math.round(memberStats[m]).toLocaleString()}</span></div>`).join('')}</div>
                    </div>
                    <div class="space-y-4">
                        ${expenses.map(e => `
                            <div class="bg-white rounded-[2.5rem] p-8 shadow-xl journal-card flex justify-between items-center relative">
                                <div><p class="text-2xl font-black leading-tight">${e.title}</p><p class="text-[10px] font-black text-morandi uppercase mt-1">@${e.user}</p></div>
                                <div class="text-right flex items-center gap-6">
                                    <p class="text-2xl font-black text-morandi font-mono leading-none">${e.currency} ${e.amount}</p>
                                    <button onclick="deleteExpense('${e.id}')" class="text-dark-green transition-all active:scale-75"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>`).join('')}
                    </div>
                </div>`;
        }

        function renderPlanningPage(container) {
            container.innerHTML = `
                <div class="space-y-12 animate-fade-in pb-48 px-2">
                    <div class="bg-white rounded-[3rem] p-8 journal-card flex justify-between items-center shadow-xl active:scale-95 cursor-pointer" onclick="openMemberEditor()">
                        <div class="flex items-center gap-4"><div class="w-12 h-12 bg-morandi/10 rounded-2xl flex items-center justify-center text-morandi"><i data-lucide="users"></i></div><div><p class="font-black text-xl text-dark-green uppercase leading-none mt-1">旅伴管理</p><p class="text-xs opacity-40 font-bold mt-1">點擊編輯旅伴名單</p></div></div>
                        <i data-lucide="chevron-right" class="text-morandi opacity-40"></i>
                    </div>
                    <div class="space-y-6">
                        <h2 class="text-3xl font-black text-dark-green tracking-tighter px-2 flex items-center gap-3"><i data-lucide="check-square" class="text-morandi"></i> 準備清單</h2>
                        ${todos.map(t => `<div onclick="toggleTodo('${t.id}')" class="bg-white rounded-[2.5rem] p-8 flex items-center gap-6 shadow-xl journal-card transition-all ${t.done ? 'opacity-40 grayscale' : 'active:scale-95'}">
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center border-4 ${t.done ? 'bg-green-500 border-green-500 text-white' : 'border-gray-200'}">${t.done ? '<i data-lucide="check" class="w-8 h-8 stroke-[4px]"></i>' : ''}</div>
                            <span class="text-2xl font-black flex-1 ${t.done ? 'line-through text-gray-400' : 'text-[#1C1912]'}">${t.text}</span>
                        </div>`).join('')}
                    </div>
                </div>`;
        }

        function renderChatPage(container) {
            container.innerHTML = `
                <div class="flex flex-col h-[70vh] animate-fade-in px-2">
                    <h2 class="text-4xl font-black mb-8 text-dark-green tracking-tighter px-2 flex items-center gap-3"><i data-lucide="message-square" class="text-morandi"></i> 成員共享日記</h2>
                    <div class="flex-1 overflow-y-auto space-y-6 px-2 mb-4 no-scrollbar">${chatMessages.map(m => `<div class="flex flex-col ${m.user === APP_USER ? 'items-end' : 'items-start'}"><div class="flex items-center gap-2 mb-1 px-2"><span class="text-[10px] opacity-40 font-black">@${m.user}</span></div><div class="${m.user === APP_USER ? 'chat-bubble-me shadow-md' : 'bg-white journal-card'} p-5 font-bold max-w-[85%] text-lg">${m.text}</div></div>`).join('')}</div>
                    <div class="bg-white rounded-[2.5rem] p-4 border-[3.5px] border-[#1C1912] shadow-2xl flex items-center gap-3">
                        <input id="chat-input" class="flex-1 bg-transparent outline-none font-bold px-4 h-12" placeholder="記下心情...">
                        <button onclick="sendChat()" class="bg-morandi text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-75"><i data-lucide="send" class="w-5 h-5"></i></button>
                    </div>
                </div>`;
        }

        // --- 功能函數 ---
        async function submitNewMember() {
            const nameEl = document.getElementById('new-member-name');
            const name = nameEl?.value;
            if(!name || members.includes(name)) return;
            const newList = [...members, name];
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', 'list'), { list: newList });
            nameEl.value = '';
            openMemberEditor(); // 刷新
        }

        function triggerPhotoUpload(itemId, slot) {
            document.getElementById(`file-${itemId}-${slot}`).click();
        }

        async function uploadPhoto(itemId, slot, input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result;
                const updateObj = {};
                updateObj[`photo${slot}`] = base64;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', itemId), updateObj);
            };
            reader.readAsDataURL(file);
        }

        // --- 全域資料操作 ---
        async function toggleSchedule(id) { const s = schedules.find(x => x.id === id); await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id), { done: !s.done }); }
        async function toggleTodo(id) { const t = todos.find(x => x.id === id); await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'todos', id), { done: !t.done }); }
        async function deleteSchedule(id) { askConfirm(async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id)); }, "刪除行程", "確認刪除？"); }
        async function deleteExpense(id) { askConfirm(async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', id)); }, "刪除紀錄", "確認刪除？"); }
        async function removeMember(idx) { askConfirm(async () => { const newList = [...members]; newList.splice(idx,1); await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', 'list'), { list: newList }); openMemberEditor(); }, "移除成員", "確認移除？"); }
        function saveAppTitle(val) { setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), { title: val }, { merge: true }); }
        function saveDailyTitle(val) { const newMeta = {...dailyMetadata}; if(!newMeta[currentActiveDay]) newMeta[currentActiveDay] = {}; newMeta[currentActiveDay].title = val; setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), { dailyMeta: newMeta }, { merge: true }); }
        function openEditScheduleModal(id) { const item = schedules.find(s => s.id == id); if (!item) return; const modal = document.getElementById('modal-overlay'); document.getElementById('modal-title').innerText = "行程細節"; modal.classList.remove('hidden'); document.getElementById('modal-body').innerHTML = `<div class="space-y-4"><input id="edit-title" value="${item.title}" class="w-full p-5 rounded-2xl border-4 border-gray-100 font-black outline-none"><textarea id="edit-details" rows="5" class="w-full p-5 rounded-2xl border-4 border-gray-100 font-black placeholder-gray-300" placeholder="詳細備註...">${item.details || ''}</textarea><button onclick="saveEditSchedule('${id}')" class="w-full bg-dark-green text-white py-6 rounded-2xl font-black">更新並儲存</button></div>`; }
        async function saveEditSchedule(id) { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id), { title: document.getElementById('edit-title').value, details: document.getElementById('edit-details').value }); closeModal(); }

        // --- 通用輔助 ---
        function askConfirm(action, title, message) { const overlay = document.getElementById('confirm-overlay'); document.getElementById('confirm-title').innerText = title; document.getElementById('confirm-message').innerText = message; overlay.classList.remove('hidden'); document.getElementById('confirm-action-btn').onclick = () => { action(); closeConfirmModal(); }; }
        function closeConfirmModal() { document.getElementById('confirm-overlay').classList.add('hidden'); }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
        function switchTab(tabId) { currentTab = tabId; render(); }
        function selectDay(dayId) { currentActiveDay = dayId; render(); }
        function updateNavStyles() { document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('text-[#8E9775]', 'scale-110'); btn.classList.add('text-white/30'); }); const activeBtn = document.getElementById(`btn-${currentTab}`); if (activeBtn) { activeBtn.classList.replace('text-white/30', 'text-[#8E9775]'); activeBtn.classList.add('scale-110'); } }
        function getCatColor(cat) { return { spot: 'bg-[#A7B09E]', transport: 'bg-[#9BAEBC]', hotel: 'bg-[#E0D8C3]', flight: 'bg-dark-green' }[cat] || 'bg-gray-300'; }
        async function sendChat() { const input = document.getElementById('chat-input'); if(!input.value) return; await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chat'), { user: APP_USER, text: input.value, timestamp: Date.now() }); input.value = ''; }
        function openMemberEditor() {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = "旅伴名單管理";
            modal.classList.remove('hidden');
            document.getElementById('modal-body').innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 gap-3 max-h-[40vh] overflow-y-auto no-scrollbar">${members.map((m, idx) => `
                        <div class="bg-white p-5 rounded-2xl border-2 border-black/5 flex justify-between items-center shadow-sm">
                            <input type="text" onchange="updateMemberName(${idx}, this.value)" class="font-black text-lg bg-transparent outline-none flex-1" value="${m}">
                            ${m !== APP_USER ? `<button onclick="removeMember(${idx})" class="text-dark-green p-2 active:scale-75"><i data-lucide="x" class="w-5 h-5"></i></button>` : '<span class="text-[8px] font-black text-morandi uppercase">Owner</span>'}
                        </div>`).join('')}</div>
                    <div class="flex gap-3"><input id="new-member-name" placeholder="名字..." class="flex-1 p-5 rounded-2xl border-4 border-gray-100 font-black outline-none"><button onclick="submitNewMember()" class="bg-morandi text-white px-8 rounded-2xl font-black">新增</button></div>
                    <button onclick="closeModal()" class="w-full py-6 bg-dark-green text-white rounded-[2rem] font-black mt-4">儲存設定</button>
                </div>`;
            lucide.createIcons();
        }

        function openAddModal() {
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = currentTab === 'schedule' ? "新增行程" : currentTab === 'expense' ? "紀錄支出" : "新增事項";
            modal.classList.remove('hidden');

            if (currentTab === 'schedule') {
                body.innerHTML = `
                    <div class="space-y-5">
                        <div class="grid grid-cols-2 gap-4"><input id="add-time" type="time" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none" value="10:00"><input id="add-city" placeholder="城市" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none"></div>
                        <input id="add-title" placeholder="項目名稱" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                        <button onclick="submitSchedule()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl uppercase shadow-2xl">Confirm Save</button>
                    </div>`;
            } else if (currentTab === 'expense') {
                body.innerHTML = `
                    <div class="space-y-5">
                        <select id="ex-user" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">${members.map(m => `<option value="${m}">${m}</option>`).join('')}</select>
                        <input id="ex-title" placeholder="項目" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                        <div class="grid grid-cols-2 gap-4"><input id="ex-amount" type="number" placeholder="金額" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none"><select id="ex-currency" class="p-6 rounded-3xl border-4 border-gray-100 font-black outline-none"><option value="CHF">CHF</option><option value="TWD">TWD</option><option value="EUR">EUR</option></select></div>
                        <button onclick="submitExpense()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl uppercase">Save Record</button>
                    </div>`;
            } else { body.innerHTML = `<input id="todo-text" placeholder="內容..." class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none"><button onclick="submitTodo()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl">Confirm</button>`; }
            lucide.createIcons();
        }

        async function submitSchedule() {
            const title = document.getElementById('add-title').value;
            if(!title) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'schedules'), {
                date: currentActiveDay, time: document.getElementById('add-time').value, city: document.getElementById('add-city').value, title, cat: 'spot', done: false, timestamp: Date.now()
            });
            closeModal();
        }
        async function submitExpense() {
            const title = document.getElementById('ex-title').value;
            if(!title) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), { title, amount: parseFloat(document.getElementById('ex-amount').value), currency: document.getElementById('ex-currency').value, user: document.getElementById('ex-user').value, timestamp: Date.now() });
            closeModal();
        }
        async function submitTodo() { if(!document.getElementById('todo-text').value) return; await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'todos'), { text: document.getElementById('todo-text').value, done: false, timestamp: Date.now() }); closeModal(); }
        function updateMemberName(idx, val) { if(val) members[idx] = val; }

        // --- 全域綁定 ---
        Object.assign(window, { switchTab, selectDay, toggleSchedule, deleteSchedule, deleteExpense, toggleTodo, openMemberEditor, updateMemberName, removeMember, submitNewMember, sendChat, saveDailyTitle, saveAppTitle, openAddModal, closeModal, submitSchedule, submitExpense, submitTodo, askConfirm, closeConfirmModal, triggerPhotoUpload, uploadPhoto, openEditScheduleModal, saveEditSchedule });
        window.onload = startApp;
    </script>
</body>
</html>
