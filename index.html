<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SWISS 2026 Shared Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.4/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #CFC8B3; color: #1C1912; margin: 0; padding: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .journal-card { border: 3px solid #1C1912; box-shadow: 12px 12px 0px rgba(0,0,0,0.1); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); background: white; }
        .journal-card:active { transform: scale(0.98); box-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .date-active { background-color: #8E9775 !important; color: white !important; transform: scale(1.1) rotate(-2deg); box-shadow: 0 10px 20px rgba(142, 151, 117, 0.4); }
        .boarding-pass-dashed { border-top: 2px dashed #E5E7EB; position: relative; }
        .boarding-pass-dashed::before, .boarding-pass-dashed::after { content: ''; position: absolute; top: -10px; width: 20px; height: 20px; background: #CFC8B3; border-radius: 50%; }
        .boarding-pass-dashed::before { left: -13px; }
        .boarding-pass-dashed::after { right: -13px; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp, getApps } from 'firebase/app';
        import { 
          getFirestore, collection, doc, onSnapshot, 
          addDoc, updateDoc, deleteDoc, setDoc, writeBatch
        } from 'firebase/firestore';
        import { 
          getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken 
        } from 'firebase/auth';
        import { 
          Calendar, Plus, Map as MapIcon, Check, Trash2, ArrowRight, Wallet, 
          User, RefreshCw, ChevronRight, CheckSquare, AlertCircle, MapPin, 
          CreditCard, Send, MessageSquare, CloudRain, MoveVertical, Navigation, 
          Camera, Plane, Luggage, Clock, ExternalLink
        } from 'lucide-react';
        import { motion, Reorder, AnimatePresence } from 'framer-motion';

        /**
         * --- ⚠️ 重要：請在此處手動填寫您的 FIREBASE SDK 配置 ---
         */
        const manualFirebaseConfig = {
  apiKey: "AIzaSyCsVnnFIQ6P-PjYNqBMWxxX7bPXI42Y864",
  authDomain: "swiss-trip-ddefe.firebaseapp.com",
  projectId: "swiss-trip-ddefe",
  storageBucket: "swiss-trip-ddefe.firebasestorage.app",
  messagingSenderId: "33141127491",
  appId: "1:33141127491:web:15f97753fc9fef28add7f6",
  measurementId: "G-FPQTFWXKMT"
}; 

        let firebaseApp, db, auth, appId;
        let isConfigMissing = false;

        try {
            const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            const firebaseConfig = manualFirebaseConfig || (rawConfig ? JSON.parse(rawConfig) : null);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'swiss-trip-v5-final';
            
            if (!firebaseConfig || !firebaseConfig.apiKey) {
                isConfigMissing = true;
            } else {
                firebaseApp = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
                db = getFirestore(firebaseApp);
                auth = getAuth(firebaseApp);
            }
        } catch (e) {
            isConfigMissing = true;
            console.error("Firebase Init Error:", e);
        }

        const RATE_CHF = 36.8;
        const CURRENCIES = ["CHF", "TWD", "EUR", "USD", "GBP"];
        const CATEGORY_COLORS = { flight: 'bg-[#AA1D24]', transport: 'bg-[#9BAEBC]', hotel: 'bg-[#E0D8C3]', spot: 'bg-[#A7B09E]' };
        const SWISS_DAYS = Array.from({length: 13}, (_, i) => {
          const d = new Date(2026, 2, 18 + i);
          const weekday = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
          return { id: `2026-03-${18+i}`, label: `Day ${i+1}`, date: `3/${18+i}`, weekday };
        });

        const Modal = ({ isOpen, onClose, title, children }) => {
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 z-[1000] flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <motion.div initial={{ y: "100%" }} animate={{ y: 0 }} className="bg-[#F7F4EB] w-full max-w-lg rounded-t-[3.5rem] sm:rounded-[3.5rem] p-8 shadow-2xl overflow-y-auto max-h-[90vh] border-t-8 border-[#8E9775]">
                <div className="flex justify-between items-center mb-8"><h2 className="text-3xl font-black tracking-tighter">{title}</h2><button onClick={onClose} className="p-3 bg-white rounded-full shadow-lg text-gray-400">✕</button></div>
                {children}
              </motion.div>
            </div>
          );
        };

        function App() {
          const [activeTab, setActiveTab] = useState('schedule');
          const [selectedDay, setSelectedDay] = useState('2026-03-18');
          const [user, setUser] = useState(null);
          const [schedules, setSchedules] = useState([]);
          const [expenses, setExpenses] = useState([]);
          const [notes, setNotes] = useState([]);
          const [members, setMembers] = useState(["Zora"]);
          const [checklist, setChecklist] = useState([]);
          const [bookings, setBookings] = useState([]);
          const [isLoading, setIsLoading] = useState(!isConfigMissing);
          const [isAddingModalOpen, setIsAddingModalOpen] = useState(false);
          const [isPrepCompleteModalOpen, setIsPrepCompleteModalOpen] = useState(false);
          const [confirmData, setConfirmData] = useState(null);
          const [expensePhoto, setExpensePhoto] = useState(null);
            const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);

          // 安全定時器
          useEffect(() => { const timer = setTimeout(() => setIsLoading(false), 6000); return () => clearTimeout(timer); }, []);

          // 身分驗證
          useEffect(() => {
            if (isConfigMissing) return;
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } 
                else { await signInAnonymously(auth); }
              } catch (e) { console.error(e); setIsLoading(false); }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (u) => { setUser(u); if (!u) setIsLoading(false); });
            return () => unsubscribe();
          }, []);

          // 資料監聽
          useEffect(() => {
            if (isConfigMissing || !user) return;
            const publicPath = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);
            const privatePath = (name) => collection(db, 'artifacts', appId, 'users', user.uid, name);
            const errorFn = (err) => { console.error("Firestore error:", err); setIsLoading(false); };

            const unsubS = onSnapshot(publicPath('schedules'), (snap) => { setSchedules(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setIsLoading(false); }, errorFn);
            const unsubE = onSnapshot(publicPath('expenses'), snap => setExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() }))), errorFn);
            const unsubN = onSnapshot(publicPath('notes'), snap => setNotes(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.timestamp - b.timestamp)), errorFn);
            const unsubM = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'members'), snap => { if (snap.exists()) setMembers(snap.data().list); }, errorFn);
            const unsubC = onSnapshot(privatePath('checklist'), snap => setChecklist(snap.docs.map(d => ({ id: d.id, ...d.data() }))), errorFn);
            const unsubB = onSnapshot(publicPath('bookings'), snap => setBookings(snap.docs.map(d => ({ id: d.id, ...d.data() }))), errorFn);
            return () => { unsubS(); unsubE(); unsubN(); unsubM(); unsubC(); unsubB(); };
          }, [user]);

          // 重要：定義 totalExpenseTWD (解決 ReferenceError)
          const totalExpenseTWD = useMemo(() => 
            expenses.reduce((acc, ex) => acc + (ex.amount * (ex.currency === 'CHF' ? RATE_CHF : 1)), 0),
          [expenses]);

          // 如果沒有配置
          if (isConfigMissing) {
            return (
              <div className="min-h-screen flex items-center justify-center p-8 text-center bg-[#CFC8B3] font-black">
                <div className="max-w-md w-full bg-white p-12 rounded-[3rem] shadow-2xl border-4 border-red-500 animate-fade-in">
                  <div className="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-8 text-red-500"><AlertCircle size={48} strokeWidth={3}/></div>
                  <h1 className="text-3xl mb-4 font-black">請填寫資料庫配置</h1>
                  <p className="text-gray-500 leading-relaxed mb-8">目前的程式碼中缺少 Firebase Config。請在 <code className="bg-gray-100 px-2 rounded">index.html</code> 的第 65 行貼上您的配置資訊。</p>
                  <button onClick={() => window.location.reload()} className="w-full bg-black text-white py-5 rounded-2xl uppercase font-black">重新整理</button>
                </div>
              </div>
            );
          }

          const currentItems = useMemo(() => schedules.filter(s => s.date === selectedDay).sort((a, b) => (a.order || 0) - (b.order || 0) || a.time.toString().localeCompare(b.time.toString())), [schedules, selectedDay]);
          const nextRunnerIdx = useMemo(() => currentItems.findIndex(i => !i.done), [currentItems]);
          const expenseSummary = useMemo(() => { const summary = {}; expenses.forEach(ex => { const twd = ex.amount * (ex.currency === 'CHF' ? RATE_CHF : 1); summary[ex.user] = (summary[ex.user] || 0) + twd; }); return summary; }, [expenses]);

          const askConfirm = (title, message, action) => setConfirmData({ title, message, action });
          const handleAddSchedule = async (e) => { e.preventDefault(); const fd = new FormData(e.target); await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'schedules'), { date: selectedDay, time: fd.get('time'), city: fd.get('city'), title: fd.get('title'), note: fd.get('note'), mapUrl: fd.get('mapUrl') || "", category: 'spot', done: false, order: currentItems.length, timestamp: Date.now() }); setIsAddingModalOpen(false); };
          const handleAddExpense = async (e) => { e.preventDefault(); const fd = new FormData(e.target); await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), { user: fd.get('user'), title: fd.get('title'), amount: parseFloat(fd.get('amount')) || 0, currency: fd.get('currency'), photo: expensePhoto, timestamp: Date.now() }); setExpensePhoto(null); setIsAddingModalOpen(false); };
          const handleAddBooking = async (e) => { e.preventDefault(); const fd = new FormData(e.target); await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'bookings'), { type: fd.get('type'), flightNo: fd.get('flightNo'), model: fd.get('model'), date: fd.get('date'), from: fd.get('from'), to: fd.get('to'), departureTime: fd.get('departureTime'), arrivalTime: fd.get('arrivalTime'), transitInfo: fd.get('transitInfo'), duration: fd.get('duration'), timestamp: Date.now() }); setIsAddingModalOpen(false); };
          const handleSendMessage = async (text) => { if (!text.trim() || !user) return; await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'notes'), { text, user: "Zora", timestamp: Date.now() }); };
          const handleAddMember = async (name) => {
    if (!name || members.includes(name) || !user) return;
    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'members'), { list: [...members, name] });
};

const handleDeleteMember = async (idx) => {
    if (!user) return;
    const newList = members.filter((_, i) => i !== idx);
    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'members'), { list: newList });
};
            const toggleChecklist = async (id, status) => { if (!user) return; await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'checklist', id), { done: !status }); };
          const handleReorder = async (newOrder) => { if (!user) return; setSchedules(prev => [...prev.filter(s => s.date !== selectedDay), ...newOrder]); const batch = writeBatch(db); newOrder.forEach((item, index) => { batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', item.id), { order: index }); }); await batch.commit(); };

          useEffect(() => { if (checklist.length > 0 && checklist.every(item => item.done)) setIsPrepCompleteModalOpen(true); }, [checklist]);

          return (
            <div className="min-h-screen pb-40 font-black animate-fade-in font-black">
              {isLoading && <div className="fixed inset-0 z-[2000] bg-[#CFC8B3] flex items-center justify-center font-black"><RefreshCw className="animate-spin text-[#8E9775]" size={48} /></div>}

              <header className="sticky top-0 z-[100] bg-[#CFC8B3]/90 backdrop-blur-md px-6 py-8 flex justify-between items-center border-b-2 border-black/5 shadow-sm">
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 bg-black rounded-2xl flex items-center justify-center text-[#CFC8B3] rotate-3 shadow-lg font-black"><MapIcon size={24} strokeWidth={3} /></div>
                  <div><h1 className="text-2xl tracking-tighter leading-none uppercase font-black">Swiss 2026</h1><p className="text-[10px] text-[#8E9775] tracking-widest uppercase mt-1 opacity-60 font-black">Shared Diary</p></div>
                </div>
                <button onClick={() => setIsAddingModalOpen(true)} className="bg-[#8E9775] text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform font-black"><Plus size={28} strokeWidth={4}/></button>
              </header>

              <main className="px-6 py-6 max-w-lg mx-auto">
                {activeTab === 'schedule' && (
                  <div className="space-y-8 animate-fade-in">
                    {/* 天氣看板 */}
                    <div className="bg-gradient-to-br from-[#8BA6A9] to-[#6C8D91] rounded-[2.5rem] p-6 text-white shadow-xl relative overflow-hidden">
                      <div className="relative z-10">
                        <div className="flex items-center gap-2 mb-2 opacity-80 font-black"><MapPin size={14} /><span className="text-[10px] font-bold uppercase tracking-widest font-black">Interlaken, Switzerland</span></div>
                        <div className="flex justify-between items-end">
                          <div><h3 className="text-4xl font-black leading-none font-mono font-black">3°C / 9°C</h3><p className="text-sm font-bold opacity-90 font-black">晴時多雲 (Partly Cloudy)</p></div>
                          <div className="text-right font-black"><div className="flex items-center justify-end gap-1 text-[11px] font-bold mb-1 font-black"><CloudRain size={12} /> 降雨 15%</div><p className="text-[10px] opacity-60 font-mono font-black">Visibility: 12km</p></div>
                        </div>
                      </div>
                      <MapIcon size={80} className="absolute -bottom-4 -right-4 opacity-10 rotate-12 font-black" />
                    </div>

                    {/* 今日大綱 */}
                    <div className="bg-white/60 rounded-[3rem] p-8 border-2 border-white/50 shadow-inner">
                      <div className="flex justify-between items-center mb-8 font-black">
                        <h3 className="text-xl font-black">今日大綱</h3>
                        <span className="text-[10px] bg-black/5 px-3 py-1 rounded-full opacity-50 font-bold uppercase font-black font-black">Day {SWISS_DAYS.findIndex(d => d.id === selectedDay) + 1}</span>
                      </div>
                      <div className="relative pl-6 space-y-6">
                        <div className="absolute left-[7px] top-2 bottom-2 w-[2px] bg-[#8E9775]/20 font-black"></div>
                        {currentItems.map((item) => (
                          <div key={item.id} className="relative flex items-start gap-4">
                            <div className="absolute -left-[24px] top-1.5 w-3 h-3 rounded-full bg-[#8E9775] border-2 border-white z-10 shadow-sm font-black"></div>
                            <span className="text-[12px] font-mono font-black text-[#8E9775] shrink-0 uppercase italic font-black">{String(item.time || "")}</span>
                            <p className="text-[14px] leading-tight uppercase font-black tracking-tight font-black">{String(item.title || "")}</p>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 日期選擇器 */}
                    <div className="flex gap-4 overflow-x-auto pb-6 no-scrollbar touch-pan-x font-black">
                      {SWISS_DAYS.map(day => (
                        <button key={day.id} onClick={() => setSelectedDay(day.id)} className={`flex-shrink-0 flex flex-col items-center justify-center w-24 h-24 rounded-[2.5rem] transition-all font-black ${selectedDay === day.id ? 'bg-[#8E9775] text-white scale-110 shadow-lg rotate-[-2deg]' : 'bg-white/40 opacity-40'}`}>
                          <span className="text-[10px] uppercase mb-1 font-black leading-none">{day.label}</span>
                          <span className="text-sm font-mono font-black">{day.date}</span>
                        </button>
                      ))}
                    </div>

                    {/* 行程列表與進度小人 */}
                    <div className="relative pl-10 space-y-8 font-black">
                      <div className="absolute left-[18px] top-4 bottom-4 w-[2.5px] bg-[#1C1912]/10 rounded-full font-black"></div>
                      <Reorder.Group axis="y" values={currentItems} onReorder={handleReorder} className="space-y-8">
                        {currentItems.map((item, idx) => (
                          <Reorder.Item key={item.id} value={item} className="relative">
                            {idx === nextRunnerIdx && <div className="absolute -left-[45px] top-4 z-20 animate-bounce text-3xl">🏃‍♂️</div>}
                            <div className={`bg-white rounded-[2.5rem] journal-card p-6 relative ${item.done ? 'opacity-40 grayscale border-transparent' : 'font-black'}`}>
                              <div className={`absolute top-0 right-0 w-3 h-full ${CATEGORY_COLORS[item.category] || 'bg-gray-200'} font-black`} />
                              <div className="flex justify-between items-start mb-4">
                                <span className="text-[10px] bg-black/5 px-3 py-1 rounded-lg uppercase tracking-widest font-black">📍 {String(item.city || "")}</span>
                                <div className="flex gap-2">
                                   <div className="w-6 h-6 rounded-full bg-gray-50 flex items-center justify-center cursor-grab text-gray-300 transition-colors font-black"><MoveVertical size={14} /></div>
                                   <button onClick={() => askConfirm("刪除行程", "確定要刪除這項計畫嗎？", async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', item.id)); setConfirmData(null); })} className="text-red-200 hover:text-red-500 transition-all active:scale-75"><Trash2 size={16}/></button>
                                </div>
                              </div>
                              <div className="flex gap-4">
                                <div className="flex-1 font-black">
                                  <div className="flex items-center gap-3 mb-1 font-black">
                                    <span className="text-xs font-mono font-black text-[#8E9775] italic uppercase">{String(item.time || "")}</span>
                                    <button onClick={() => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', item.id), { done: !item.done })} className={`w-8 h-8 rounded-lg flex items-center justify-center border-2 transition-all font-black ${item.done ? 'bg-green-500 border-green-500 text-white shadow-lg shadow-green-100' : 'border-gray-100 bg-gray-50'}`}><Check size={18} strokeWidth={5}/></button>
                                  </div>
                                  <h4 className="text-xl font-black mb-2 leading-tight uppercase tracking-tight">{String(item.title || "")}</h4>
                                  {item.mapUrl && <a href={String(item.mapUrl)} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-[10px] bg-blue-50 text-blue-600 px-3 py-2 rounded-xl font-black hover:bg-blue-100 transition-colors shadow-sm font-black"><Navigation size={12}/> Google Maps 導航</a>}
                                  {item.note && <p className="text-[12px] text-gray-400 italic mt-2 opacity-80 leading-relaxed font-bold uppercase tracking-tight font-black">“ {item.note} ”</p>}
                                </div>
                              </div>
                              <div className="grid grid-cols-2 gap-3 mt-4">
                                {[1, 2].map(slot => (
                                  <div key={slot} className="relative aspect-square bg-gray-50 rounded-2xl overflow-hidden border-2 border-dashed border-gray-100 flex items-center justify-center group/photo">
                                    {item[`photo${slot}`] ? <img src={String(item[`photo${slot}`])} className="w-full h-full object-cover" /> : <Camera size={24} className="opacity-10"/>}
                                    <input type="file" accept="image/*" onChange={(e) => {
                                      const reader = new FileReader();
                                      reader.onload = async (ev) => {
                                        const updateObj = {}; updateObj[`photo${slot}`] = ev.target.result;
                                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', item.id), updateObj);
                                      };
                                      if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
                                    }} className="absolute inset-0 opacity-0 cursor-pointer" />
                                  </div>
                                ))}
                              </div>
                            </div>
                          </Reorder.Item>
                        ))}
                      </Reorder.Group>
                    </div>
                  </div>
                )}

                {activeTab === 'expense' && (
                  <div className="space-y-8 animate-fade-in font-black">
                    <div className="bg-[#1C1912] rounded-[3rem] p-10 text-white shadow-2xl relative overflow-hidden font-black">
                      <div className="absolute top-6 right-8 text-right opacity-30 font-black uppercase font-black"><p className="text-[10px]">1 CHF = {RATE_CHF} TWD</p></div>
                      <p className="text-[12px] text-[#8E9775] mb-4 uppercase tracking-[0.4em] font-black leading-none font-black">Budget Tracking</p>
                      <h2 className="text-6xl font-black tracking-tighter italic leading-none font-mono mt-4 font-black"><span className="text-xl opacity-40 mr-2 uppercase font-black">NT$</span>{Math.round(totalExpenseTWD).toLocaleString()}</h2>
                      <div className="mt-8 pt-8 border-t border-white/10 grid grid-cols-2 gap-4">
                        {Object.entries(expenseSummary).map(([name, total]) => (
                          <div key={name}><p className="text-[10px] opacity-40 uppercase font-black">@{name}</p><p className="text-sm font-mono font-black uppercase tracking-tight leading-none mt-1 font-black">NT$ {Math.round(total).toLocaleString()}</p></div>
                        ))}
                      </div>
                    </div>
                    {expenses.map(ex => (
                      <div key={ex.id} className="bg-white rounded-[2.5rem] p-8 journal-card flex justify-between items-center relative font-black">
                        <div className="flex gap-4 items-center">
                          {ex.photo && <div className="w-16 h-16 rounded-2xl overflow-hidden border border-black/5 shadow-sm shrink-0"><img src={String(ex.photo)} className="w-full h-full object-cover" /></div>}
                          <div><p className="text-2xl font-black tracking-tight leading-tight uppercase tracking-tight font-black">{String(ex.title || "")}</p><p className="text-[10px] text-[#8E9775] font-mono tracking-widest uppercase mt-1">@{ex.user} • {ex.currency} {ex.amount}</p></div>
                        </div>
                        <div className="text-right flex items-center gap-4 shrink-0 font-black">
                          <p className="text-2xl tracking-tighter italic leading-none font-black font-mono font-black">NT$ {Math.round(ex.amount * (ex.currency === 'CHF' ? RATE_CHF : 1)).toLocaleString()}</p>
                          <button onClick={() => askConfirm("刪除支出", "確定要刪除這筆花費？", async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', ex.id)); setConfirmData(null); })} className="text-red-100 hover:text-red-500 transition-all active:scale-75 font-black"><Trash2 size={16} /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'booking' && (
                  <div className="space-y-10 animate-fade-in font-black font-black">
                    <h2 className="text-4xl font-black tracking-tighter px-2 uppercase font-black">Boarding Pass</h2>
                    {bookings.map((ticket) => (
                      <div key={ticket.id} className="bg-white rounded-[2rem] shadow-xl overflow-hidden border-2 border-black flex flex-col journal-card font-black">
                        <div className={`p-6 text-white flex justify-between items-center ${ticket.type === '去程' ? 'bg-[#AA1D24]' : 'bg-[#1C1912]'}`}>
                          <div className="flex items-center gap-4 font-black"><Plane size={24} /><div><p className="text-xl uppercase tracking-tighter leading-none font-black">{ticket.type} • Emirates</p><p className="text-[10px] opacity-70 font-mono tracking-widest uppercase mt-1 font-bold">{ticket.flightNo} • {ticket.model}</p></div></div>
                          <p className="font-mono text-sm uppercase font-black font-black">{ticket.date}</p>
                        </div>
                        <div className="p-8 grid grid-cols-3 items-center text-center font-mono">
                          <div><p className="text-4xl font-black leading-none uppercase font-black">TPE</p><p className="text-xs text-[#8E9775] font-bold mt-1 uppercase font-black">Dept: {ticket.departureTime}</p></div>
                          <div className="opacity-30 flex flex-col items-center px-2 font-black">
                            <p className="text-[8px] mb-1 font-black uppercase font-black">{ticket.duration}</p>
                            <div className="w-full h-[2px] bg-black relative"><div className="absolute right-0 top-1/2 -translate-y-1/2"><ArrowRight size={12}/></div></div>
                          </div>
                          <div><p className="text-4xl font-black leading-none uppercase font-black font-black">DXB</p><p className="text-xs text-[#8E9775] font-bold mt-1 uppercase font-black">Arrv: {ticket.arrivalTime}</p></div>
                        </div>
                        <div className="px-8 pb-8 flex justify-between items-center boarding-pass-dashed pt-8 font-black font-black">
                           <div className="text-[10px] font-bold opacity-60 uppercase flex items-center gap-2 font-black"><Clock size={12} /> {ticket.transitInfo || "DIRECT FLIGHT"}</div>
                           <button onClick={() => askConfirm("刪除憑證", "確定要刪除這張票券？", async () => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', ticket.id)); setConfirmData(null); })} className="opacity-20 hover:opacity-100 transition-all active:scale-75 font-black"><Trash2 size={16} /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'checklist' && (
                  <div className="space-y-8 animate-fade-in font-black font-black">
                    <div className="bg-[#8E9775] text-white p-10 rounded-[3rem] shadow-xl relative overflow-hidden font-black">
                      <Luggage size={80} className="absolute -bottom-4 -right-4 opacity-10 rotate-12 font-black" />
                      <p className="text-[12px] opacity-70 tracking-widest mb-2 uppercase font-black font-black">Personal Checklist</p>
                      <h2 className="text-4xl tracking-tighter leading-tight font-black uppercase font-black">裝備與備忘</h2>
                    </div>
                    <div className="space-y-4 font-black">
                      {checklist.map(item => (
                        <div key={item.id} className={`bg-white p-6 rounded-[2.5rem] journal-card flex justify-between items-center transition-all ${item.done ? 'opacity-40 grayscale border-transparent' : 'font-black'}`}>
                          <div className="flex items-center gap-4 font-black">
                            <button onClick={() => toggleChecklist(item.id, item.done)} className={`w-10 h-10 rounded-2xl border-2 flex items-center justify-center transition-all ${item.done ? 'bg-green-500 border-green-500 text-white shadow-lg' : 'bg-gray-50'}`}><Check size={24} strokeWidth={4}/></button>
                            <span className={`text-xl font-black uppercase tracking-tight ${item.done ? 'line-through opacity-50' : 'font-black'}`}>{String(item.text || "")}</span>
                          </div>
                          <button onClick={() => deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'checklist', item.id))} className="text-red-100 hover:text-red-500 transition-all active:scale-75 font-black"><Trash2 size={18}/></button>
                        </div>
                      ))}
                      <form onSubmit={async (e) => {
                        e.preventDefault();
                        const input = e.target.elements.itemInput;
                        if (!input.value.trim()) return;
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'checklist'), { text: input.value, done: false, timestamp: Date.now() });
                        input.value = "";
                      }} className="flex gap-3 mt-8 font-black">
                        <input name="itemInput" placeholder="需要帶什麼？" className="flex-1 bg-white p-6 rounded-[2rem] border-2 border-black/5 outline-none font-black shadow-inner focus:border-[#8E9775] transition-all uppercase" />
                        <button type="submit" className="bg-[#1C1912] text-white px-8 rounded-[2rem] font-black active:scale-90 transition-all shadow-lg uppercase font-black">Add</button>
                      </form>
                    </div>
                  </div>
                )}

                {activeTab === 'notebook' && (
                  <div className="space-y-6 animate-fade-in flex flex-col min-h-[60vh] font-black font-black">
                    <h2 className="text-4xl tracking-tighter flex items-center gap-3 font-black uppercase font-black font-black"><MessageSquare className="text-[#8E9775]" size={32} /> Notebook</h2>
                    <div className="flex-1 bg-white/40 rounded-[3rem] p-6 border-2 border-white min-h-[400px] flex flex-col shadow-inner font-black">
                      <div className="flex-1 overflow-y-auto space-y-4 pr-2 no-scrollbar font-black">
                        {notes.map(note => (
                          <div key={note.id} className={`flex flex-col ${note.user === 'Zora' ? 'items-end' : 'items-start'} font-black`}>
                            <span className="text-[9px] font-bold text-[#8E9775] mb-1 px-2 uppercase tracking-widest font-black">@{note.user}</span>
                            <div className={`p-4 rounded-3xl max-w-[85%] text-sm font-bold shadow-sm font-black ${note.user === 'Zora' ? 'bg-[#8E9775] text-white rounded-tr-none font-black' : 'bg-white text-[#1C1912] rounded-tl-none font-black'}`}>{String(note.text || "")}</div>
                          </div>
                        ))}
                      </div>
                      <div className="mt-6 flex gap-3 font-black">
                        <input id="chat-input" placeholder="輸入即時筆記..." className="flex-1 bg-white p-5 rounded-full border-2 border-black/5 shadow-inner text-sm font-bold outline-none focus:border-[#8E9775] transition-all font-black font-black"
                          onKeyDown={async (e) => { if(e.key === 'Enter' && e.target.value.trim()) { await handleSendMessage(e.target.value); e.target.value = ""; } }}
                        />
                        <button onClick={async () => { const input = document.getElementById('chat-input'); if(input.value.trim()) { await handleSendMessage(input.value); input.value = ""; } }} className="w-14 h-14 bg-black text-white rounded-full flex items-center justify-center active:scale-90 transition-all shadow-lg active:scale-75 font-black"><Send size={20} /></button>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              <nav className="fixed bottom-0 left-0 right-0 bg-[#1C1912]/98 backdrop-blur-3xl px-6 py-10 flex justify-around items-center z-100 rounded-t-[4rem] shadow-2xl max-w-lg mx-auto font-black font-black font-black">
                {[
                  { id: 'schedule', icon: Calendar, label: '行程' }, { id: 'booking', icon: CreditCard, label: '憑證' }, { id: 'expense', icon: Wallet, label: '記帳' }, { id: 'checklist', icon: CheckSquare, label: '清單' }, { id: 'notebook', icon: MessageSquare, label: '筆記' }
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center gap-2 transition-all font-black ${activeTab === tab.id ? 'text-[#8E9775] scale-110 shadow-glow font-black' : 'text-white/30 font-black'}`}>
                    <tab.icon size={26} strokeWidth={activeTab === tab.id ? 4 : 2} />
                    <span className="text-[10px] font-bold uppercase tracking-widest leading-none mt-1 font-black">{tab.label}</span>
                  </button>
                ))}
              </nav>

              <Modal isOpen={isAddingModalOpen} onClose={() => setIsAddingModalOpen(false)} title="新增旅行項目">
                 {activeTab === 'schedule' ? (
                  <form onSubmit={handleAddSchedule} className="space-y-5 pb-6 font-black uppercase font-black font-black">
                    <div className="grid grid-cols-2 gap-4">
                      <div className="space-y-1"><p className="text-[10px] opacity-40 ml-4 uppercase font-black">Departure</p><input name="time" type="time" required className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-black/5 outline-none font-black uppercase" /></div>
                      <div className="space-y-1"><p className="text-[10px] opacity-40 ml-4 uppercase font-black">Location</p><input name="city" placeholder="例如：蘇黎世" className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-black/5 font-black outline-none uppercase" /></div>
                    </div>
                    <input name="title" required placeholder="計畫名稱" className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-black/5 font-black outline-none uppercase" />
                    <input name="note" placeholder="詳細備註" className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-black/5 font-black outline-none uppercase" />
                    <input name="mapUrl" placeholder="Google Map 分享連結" className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-black/5 font-black outline-none uppercase" />
                    <button type="submit" className="w-full bg-[#8E9775] text-white py-8 rounded-[3rem] font-black text-xl shadow-xl active:scale-95 transition-all uppercase tracking-tighter font-black">Confirm Save</button>
                  </form>
                ) : activeTab === 'expense' ? (
                  <form onSubmit={handleAddExpense} className="space-y-5 pb-6 font-black uppercase font-black font-black font-black">
                    <select name="user" className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-black/5 font-black uppercase">{members.map(m => <option key={m} value={m}>@{m}</option>)}</select>
                    <input name="title" required placeholder="消費品項" className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-black/5 font-black outline-none uppercase" />
                    <div className="grid grid-cols-2 gap-4">
                      <input name="amount" type="number" step="0.01" required placeholder="金額" className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-black/5 font-black outline-none uppercase font-mono" />
                      <select name="currency" className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-black/5 font-black uppercase font-mono">{CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}</select>
                    </div>
                    <div className="p-6 rounded-3xl bg-gray-50 border-2 border-black/5 text-center font-black">
                      <p className="text-[10px] font-bold opacity-40 uppercase mb-2 font-black font-black">Recipe Photo</p>
                      <input type="file" accept="image/*" onChange={(e) => { const reader = new FileReader(); reader.onload = (ev) => setExpensePhoto(ev.target.result); if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]); }} className="text-xs mx-auto block font-black" />
                      {expensePhoto && <img src={expensePhoto} className="mt-4 w-full h-32 object-cover rounded-2xl border" />}
                    </div>
                    <button type="submit" className="w-full bg-[#1C1912] text-white py-8 rounded-[3rem] font-black text-xl active:scale-95 transition-all shadow-xl uppercase tracking-tighter font-black font-black">Record Expense</button>
                  </form>
                ) : activeTab === 'booking' ? (
                  <form onSubmit={handleAddBooking} className="space-y-4 pb-6 font-black uppercase font-black font-black font-black">
                    <div className="grid grid-cols-2 gap-4 font-black">
                      <select name="type" className="w-full p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none font-black uppercase"><option value="去程">去程</option><option value="回程">回程</option></select>
                      <input name="date" type="date" required className="w-full p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none font-black font-mono" />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <input name="flightNo" required placeholder="航班號" className="w-full p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none font-black uppercase font-mono" />
                      <input name="model" placeholder="機型" className="p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none w-full font-black uppercase font-mono" />
                    </div>
                    <div className="grid grid-cols-2 gap-4 font-black">
                      <input name="from" required placeholder="出發地" className="w-full p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none font-black uppercase font-mono" />
                      <input name="to" required placeholder="目的地" className="w-full p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none font-black uppercase font-mono" />
                    </div>
                    <div className="grid grid-cols-2 gap-4 font-black font-mono">
                      <div className="space-y-1 font-black"><p className="text-[8px] opacity-40 uppercase ml-2 font-bold font-black">Departure</p><input name="departureTime" type="time" required className="w-full p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none font-black font-black" /></div>
                      <div className="space-y-1 font-black"><p className="text-[8px] opacity-40 uppercase ml-2 font-bold font-black">Arrival</p><input name="arrivalTime" type="time" required className="w-full p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none font-black font-black" /></div>
                    </div>
                    <div className="space-y-1 font-black"><p className="text-[8px] opacity-40 uppercase ml-2 font-bold font-black uppercase">Transit & duration</p><div className="flex gap-2 font-black uppercase"><input name="transitInfo" placeholder="轉機資訊" className="flex-1 p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none font-black uppercase" /><input name="duration" placeholder="時數" className="w-24 p-4 rounded-2xl bg-gray-50 border-2 border-black/5 font-black outline-none font-black uppercase font-mono" /></div></div>
                    <button type="submit" className="w-full bg-[#AA1D24] text-white py-6 rounded-[2rem] font-black shadow-xl uppercase tracking-tighter font-black font-black">Create Pass</button>
                  </form>
                ) : null}
              </Modal>

              <AnimatePresence>
                {confirmData && (
                  <div className="fixed inset-0 z-[2000] flex items-center justify-center p-6 bg-black/90 backdrop-blur-md font-black animate-fade-in font-black font-black">
                    <motion.div initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="bg-white w-full max-w-sm rounded-[3rem] p-12 text-center shadow-2xl font-black font-black">
                      <div className="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-8 text-red-500 font-black font-black"><AlertCircle size={48} strokeWidth={3} /></div>
                      <h3 className="text-2xl font-black mb-4 uppercase tracking-tight leading-none font-black">{confirmData.title}</h3>
                      <p className="text-sm text-gray-400 mb-10 leading-relaxed font-bold uppercase tracking-tight">{confirmData.message}</p>
                      <div className="flex gap-4 font-black">
                        <button onClick={() => setConfirmData(null)} className="flex-1 py-5 bg-gray-100 rounded-2xl font-black text-gray-500 active:scale-95 transition-all uppercase font-black">取消</button>
                        <button onClick={confirmData.action} className="flex-1 py-5 bg-red-500 text-white rounded-2xl font-black shadow-lg active:scale-95 transition-all uppercase font-black">確定</button>
                      </div>
                    </motion.div>
                  </div>
                )}
              </AnimatePresence>

              <Modal isOpen={isPrepCompleteModalOpen} onClose={() => setIsPrepCompleteModalOpen(false)} title="準備就緒！">
                <div className="text-center py-10 space-y-6 px-4 font-black uppercase font-black">
                  <div className="text-8xl animate-bounce font-black leading-none">🇨🇭</div>
                  <h3 className="text-3xl leading-tight font-black uppercase tracking-tighter">準備完成！旅途愉快！</h3>
                  <button onClick={() => setIsPrepCompleteModalOpen(false)} className="w-full bg-[#8E9775] text-white py-6 rounded-3xl font-black shadow-xl active:scale-95 uppercase transition-all tracking-widest font-black">Start Adventure</button>
                </div>
              </Modal>
            </div>
          );
        }

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
