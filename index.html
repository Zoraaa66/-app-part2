<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swiss Diary 2026 - Morandi Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* 莫蘭迪核心色系 */
        :root {
            --morandi-green: #8E9775;
            --morandi-dark: #4A4E40;
            --morandi-light: #E1E5D5;
            --journal-bg: #CFC8B3;
        }

        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: var(--journal-bg); color: #1C1912; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        
        /* 狀態顏色定義 */
        .date-active { background-color: var(--morandi-green); color: white; border-color: white; transform: scale(1.1); font-weight: 900; box-shadow: 0 10px 15px -3px rgba(142, 151, 117, 0.4); }
        .text-morandi { color: var(--morandi-green); }
        .bg-morandi { background-color: var(--morandi-green); }
        .text-dark-green { color: var(--morandi-dark); }
        .bg-dark-green { background-color: var(--morandi-dark); }

        .item-done { opacity: 0.6; filter: grayscale(0.7); background-color: #E2E8F0 !important; border-color: transparent !important; }
        .running-man { transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        
        .chat-bubble-me { border-radius: 1.5rem; border-bottom-right-radius: 0.2rem; background-color: var(--morandi-green); color: white; }
    </style>
</head>
<body class="min-h-screen pb-40 overflow-x-hidden select-none">

    <!-- 頂部標題列 (左上角標題現在可點擊修改) -->
    <header class="sticky top-0 z-50 bg-[#CFC8B3]/95 backdrop-blur-xl px-6 py-10 flex justify-between items-center border-b-[3px] border-black/10 shadow-2xl">
        <div class="flex items-center gap-5">
            <div class="w-16 h-16 bg-[#1C1912] rounded-[2.2rem] flex items-center justify-center text-[#CFC8B3] shadow-xl rotate-3 border-4 border-white/10">
                <i data-lucide="map"></i>
            </div>
            <div class="flex-1">
                <input id="app-main-title" type="text" value="SWISS 2026" onchange="saveAppTitle(this.value)" class="bg-transparent font-black text-3xl tracking-tighter w-full outline-none border-none focus:text-dark-green transition-colors">
                <p class="text-[10px] text-morandi font-black uppercase tracking-[0.5em] opacity-80">Shared Travel Diary</p>
            </div>
        </div>
        <button onclick="openAddModal()" class="bg-morandi text-white w-14 h-14 rounded-[1.5rem] shadow-2xl flex items-center justify-center border-[4px] border-white active:scale-50 transition-all">
            <i data-lucide="plus" class="stroke-[4px]"></i>
        </button>
    </header>

    <main id="app-content" class="px-6 py-8 max-w-lg mx-auto min-h-[70vh]">
        <!-- 內容動態填充 -->
    </main>

    <!-- 底部導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1C1912]/98 backdrop-blur-3xl px-2 py-6 flex justify-around items-center z-[60] rounded-t-[4rem] shadow-[0_-30px_100px_rgba(0,0,0,0.6)] border-t border-white/10 max-w-lg mx-auto">
        <button onclick="switchTab('schedule')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-schedule">
            <i data-lucide="calendar" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">行程</span>
        </button>
        <button onclick="switchTab('booking')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-booking">
            <i data-lucide="layers" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">憑證</span>
        </button>
        <button onclick="switchTab('expense')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-expense">
            <i data-lucide="wallet" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">記帳</span>
        </button>
        <button onclick="switchTab('planning')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-planning">
            <i data-lucide="check-square" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">準備</span>
        </button>
        <button onclick="switchTab('chat')" class="nav-btn flex flex-col items-center gap-1.5 text-white/30 transition-all" id="btn-chat">
            <i data-lucide="message-square" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">日記</span>
        </button>
    </nav>

    <!-- 萬能彈窗 Modal (包含詳細編輯功能) -->
    <div id="modal-overlay" class="fixed inset-0 z-[100] hidden flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="bg-[#F7F4EB] w-full max-w-lg rounded-t-[3.5rem] sm:rounded-[3.5rem] p-8 shadow-2xl overflow-y-auto max-h-[90vh] border-t-8 border-morandi border-x-[6px] border-white">
            <div class="flex justify-between items-center mb-8">
                <h2 id="modal-title" class="text-3xl font-black text-[#1C1912] tracking-tighter">標題</h2>
                <button onclick="closeModal()" class="p-3 bg-white rounded-full shadow-lg text-gray-400 active:scale-75 transition-all">✕</button>
            </div>
            <div id="modal-body" class="space-y-6"></div>
        </div>
    </div>

    <script>
        // --- 1. 核心數據 ---
        let appMainTitle = "SWISS 2026";
        let currentTab = 'schedule';
        let currentActiveDay = '2026-03-18';
        const APP_USER = "Zora"; 
        let members = ["Zora", "成員A", "成員B", "成員C", "成員D"];
        const RATE_CHF = 36.8;

        let schedules = [
            { id: 1, date: '2026-03-18', time: '00:20', title: '台北 TPE (EK0387)', city: '台北', cat: 'flight', note: '啟程前往杜拜', details: '記得提早三小時到機場辦理登機。', done: false, map: 'https://maps.google.com/?q=TPE' },
            { id: 2, date: '2026-03-18', time: '12:25', title: '蘇黎世 ZRH 抵達 (EK0087)', city: '蘇黎世', cat: 'flight', note: '辦理入境手續', details: '準備好申根保險證明備查。', done: false, map: 'https://maps.google.com/?q=ZRH' },
            { id: 3, date: '2026-03-18', time: '13:30', title: '火車：蘇黎世 → 因特拉肯', city: '因特拉肯', cat: 'transport', note: '車程約 2 小時', details: '持 Swiss Pass 乘車，不需劃位。', done: false, map: 'https://maps.google.com/?q=Interlaken' }
        ];

        let expenses = [
            { id: 1, title: '起司火鍋', amount: 120, currency: 'CHF', user: 'Zora' }
        ];

        let chatMessages = [{ user: '系統', text: '歡迎來到旅行日記！', time: '12:00', isMe: false }];
        let todos = [{ id: 1, text: '機票開票', done: true }, { id: 2, text: '購入 eSIM', done: false }];
        
        let dailyMetadata = {
            '2026-03-18': { title: '啟程：瑞士之光', location: '蘇黎世 (Zurich)', weather: '晴時多雲', rain: '10%', visibility: '15km', fog: '無' }
        };

        const SWISS_DAYS = Array.from({length: 14}, (_, i) => ({ id: `2026-03-${18+i}`, label: `Day ${i+1}`, date: `3/${18+i}` }));

        // --- 2. 介面更新功能 ---
        function updateNavStyles() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-[#8E9775]', 'scale-110');
                btn.classList.add('text-white/30');
            });
            const activeBtn = document.getElementById(`btn-${currentTab}`);
            if (activeBtn) {
                activeBtn.classList.replace('text-white/30', 'text-[#8E9775]');
                activeBtn.classList.add('scale-110');
            }
        }

        function render() {
            const container = document.getElementById('app-content');
            updateNavStyles();
            document.getElementById('app-main-title').value = appMainTitle;

            if (currentTab === 'schedule') {
                const meta = dailyMetadata[currentActiveDay] || { title: '未命名行程主題', location: '瑞士', weather: '--', rain: '--', visibility: '--', fog: '--' };
                container.innerHTML = `
                    <!-- 1. 詳細氣象板 (保留藍色) -->
                    <div class="bg-blue-500 rounded-[2.5rem] p-6 text-white shadow-xl flex justify-between items-center mb-8 relative overflow-hidden animate-fade-in">
                        <div class="z-10 flex-1">
                            <div class="flex items-center gap-2 mb-2"><i data-lucide="map-pin" class="w-4 h-4 opacity-60"></i><span class="text-[10px] font-black uppercase tracking-widest opacity-60">${meta.location} · Weather</span></div>
                            <h3 class="text-2xl font-black mb-1">${meta.weather}</h3>
                            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-[11px] font-bold opacity-80"><span>降雨: ${meta.rain}</span><span>能見度: ${meta.visibility}</span><span>霧氣: ${meta.fog}</span></div>
                        </div>
                        <i data-lucide="sun" class="w-16 h-16 opacity-30"></i>
                    </div>

                    <!-- 2. 行程總表 -->
                    <div class="bg-white/40 rounded-[2.5rem] p-6 mb-6 border-2 border-white shadow-inner animate-fade-in">
                        <p class="text-[10px] font-black uppercase text-morandi mb-3">Daily Itinerary Summary / 行程大綱</p>
                        <div class="space-y-3">${renderSummaryTable()}</div>
                    </div>

                    <!-- 3. 每日標題欄位 (在總表下方，莫蘭迪綠) -->
                    <div class="mb-8 px-4 py-5 bg-white/30 rounded-3xl border-b-[6px] border-morandi shadow-lg animate-fade-in">
                        <p class="text-[9px] font-black uppercase text-morandi opacity-60 mb-1">Today's Journey Focus / 行程主題</p>
                        <input onchange="saveDailyTitle(this.value)" class="bg-transparent border-none text-morandi font-black text-2xl outline-none w-full placeholder-morandi/30" placeholder="點擊編輯今日重點..." value="${meta.title}">
                    </div>

                    <!-- 4. 日期滾動 -->
                    <div class="flex gap-4 overflow-x-auto pb-6 no-scrollbar touch-pan-x" id="date-scroll">${renderDateButtons()}</div>

                    <div class="flex justify-between items-center mb-6 px-1">
                        <h2 class="text-2xl font-black tracking-tighter text-dark-green">冒險清單</h2>
                        <button onclick="openSwapModal()" class="text-[10px] font-black bg-white px-4 py-2 rounded-full shadow-sm text-dark-green">⇅ 對調整日行程</button>
                    </div>

                    <!-- 5. 行程時間軸 -->
                    <div class="relative pl-14 space-y-10" id="schedule-container">
                        <div class="absolute left-[1.65rem] top-8 bottom-8 w-[3.5px] bg-[#1C1912]/10 rounded-full"></div>
                        ${renderScheduleItems()}
                    </div>
                `;
            } else if (currentTab === 'booking') {
                renderBooking(container);
            } else if (currentTab === 'expense') {
                renderExpense(container);
            } else if (currentTab === 'planning') {
                renderPlanning(container);
            } else if (currentTab === 'chat') {
                renderChat(container);
            }
            lucide.createIcons();
        }

        // --- 3. 功能渲染輔助 ---

        function renderDateButtons() {
            return SWISS_DAYS.map(day => `
                <button onclick="selectDay('${day.id}')" class="flex-shrink-0 flex flex-col items-center justify-center min-w-[75px] h-[75px] rounded-[2.2rem] transition-all border-[3.5px] ${day.id === currentActiveDay ? 'date-active' : 'bg-white/40 text-[#1C1912]/40 border-transparent'}">
                    <span class="text-[9px] uppercase mb-1 opacity-70">${day.label}</span>
                    <span class="text-base font-bold">${day.date}</span>
                </button>
            `).join('');
        }

        function renderSummaryTable() {
            const items = schedules.filter(s => s.date === currentActiveDay);
            if (items.length === 0) return `<p class="text-xs italic opacity-30">無摘要資料</p>`;
            return items.map(item => `
                <div class="flex items-center gap-4 text-xs font-bold border-b border-black/5 pb-2">
                    <span class="text-morandi font-mono w-10 shrink-0">${item.time}</span>
                    <span class="flex-1 truncate uppercase">${item.title}</span>
                    <span class="opacity-30">📍 ${item.city}</span>
                </div>
            `).join('');
        }

        function renderScheduleItems() {
            const items = schedules.filter(s => s.date === currentActiveDay);
            const firstUndoneIdx = items.findIndex(item => !item.done);

            return items.map((item, idx) => {
                const isRunnerHere = idx === (firstUndoneIdx === -1 ? items.length - 1 : firstUndoneIdx);
                const isLastItem = idx === items.length - 1;

                return `
                    <div class="relative animate-fade-in group">
                        <div onclick="toggleSchedule(${item.id})" class="absolute -left-[3.25rem] top-8 z-20 w-12 h-12 rounded-full border-[5px] border-[#CFC8B3] flex items-center justify-center shadow-xl transition-all ${item.done ? 'bg-green-600' : 'bg-white'}">
                            ${item.done ? '<i data-lucide="check" class="text-white w-6 h-6 stroke-[4px]"></i>' : (isRunnerHere ? '<span class="text-2xl running-man">🏃</span>' : '<div class="w-3 h-3 rounded-full bg-black/10"></div>')}
                        </div>

                        <div onclick="openEditScheduleModal(${item.id})" class="bg-white rounded-[2.5rem] shadow-[12px_12px_0px_rgba(28,25,18,0.1)] border-[3px] border-[#4A4433] p-6 relative active:scale-95 transition-all ${item.done ? 'item-done' : 'cursor-pointer hover:border-morandi'}">
                            <div class="absolute top-0 right-0 w-4 h-full rounded-r-[1.8rem] ${getCatColor(item.cat)}"></div>
                            <div class="flex flex-col gap-4">
                                <div class="flex justify-between items-start">
                                    <span class="text-[10px] font-black bg-[#1C1912]/5 text-[#1C1912]/40 px-3 py-1 rounded-lg tracking-widest uppercase">📍 ${item.city}</span>
                                    <button onclick="event.stopPropagation(); deleteSchedule(${item.id})" class="text-dark-green opacity-20 hover:opacity-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-sm font-black text-morandi font-mono tracking-tighter">${item.time}</span>
                                    <h3 class="text-xl font-black text-[#1C1912] leading-tight flex-1 pr-4">${item.title}</h3>
                                </div>
                                
                                <div class="grid grid-cols-2 gap-2">
                                    <div class="aspect-square bg-gray-100 rounded-2xl border-2 border-dashed border-black/5 flex items-center justify-center">
                                        <i data-lucide="camera" class="text-black/10 w-6 h-6"></i>
                                    </div>
                                    <div class="aspect-square bg-gray-100 rounded-2xl border-2 border-dashed border-black/5 flex items-center justify-center opacity-40">
                                        <i data-lucide="plus" class="text-black/10 w-6 h-6"></i>
                                    </div>
                                </div>

                                ${item.note ? `<p class="text-[12px] text-[#1C1912]/60 font-bold italic border-l-[4px] border-morandi/20 pl-4 py-1 leading-relaxed bg-black/5 rounded-r-xl italic">“ ${item.note} ”</p>` : ''}
                                ${item.details ? `<p class="text-[10px] font-black text-morandi uppercase tracking-widest opacity-40 flex items-center gap-1"><i data-lucide="info" class="w-3 h-3"></i> 含有詳細筆記</p>` : ''}
                            </div>
                        </div>

                        ${!isLastItem ? `<div class="ml-4 my-6 p-4 border-l-4 border-dashed border-morandi bg-white/20 rounded-r-2xl text-[10px] font-bold text-dark-green/80 uppercase">
                            預計 30 分鐘，建議轉乘 S1 線火車。
                        </div>` : ''}
                    </div>
                `;
            }).join('');
        }

        // --- 4. 彈窗與功能操作 ---

        function openAddModal() {
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = currentTab === 'schedule' ? "新增行程項目" : currentTab === 'expense' ? "紀錄支出" : "新增事項";
            modal.classList.remove('hidden');

            if (currentTab === 'schedule') {
                body.innerHTML = `
                    <div class="space-y-5">
                        <div class="grid grid-cols-2 gap-4">
                            <input id="add-time" type="time" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none" value="10:00">
                            <input id="add-city" placeholder="城市" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                        </div>
                        <input id="add-title" placeholder="景點名稱" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <div class="p-8 border-4 border-dashed border-gray-200 rounded-[2rem] flex flex-col items-center gap-2 bg-gray-50 relative"><i data-lucide="camera" class="w-6 h-6 text-gray-400"></i><input type="file" class="absolute inset-0 opacity-0 cursor-pointer"></div>
                            <div class="p-8 border-4 border-dashed border-gray-200 rounded-[2rem] flex flex-col items-center gap-2 bg-gray-50 relative"><i data-lucide="camera" class="w-6 h-6 text-gray-400"></i><input type="file" class="absolute inset-0 opacity-0 cursor-pointer"></div>
                        </div>
                        <button onclick="submitSchedule()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl uppercase tracking-[0.5em] shadow-2xl">Confirm</button>
                    </div>`;
            } else if (currentTab === 'expense') {
                body.innerHTML = `
                    <div class="space-y-5">
                        <p class="text-[10px] font-black uppercase text-morandi mb-1">代墊成員：</p>
                        <select id="ex-user" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">${members.map(m => `<option value="${m}" ${m===APP_USER?'selected':''}>${m === APP_USER ? m + ' (自己)' : m}</option>`).join('')}</select>
                        <input id="ex-title" placeholder="支出項目" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                        <div class="grid grid-cols-2 gap-4">
                            <input id="ex-amount" type="number" placeholder="金額" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                            <select id="ex-currency" class="p-6 rounded-3xl border-4 border-gray-100 font-black outline-none"><option value="CHF">CHF</option><option value="TWD">TWD</option><option value="EUR">EUR</option></select>
                        </div>
                        <button onclick="submitExpense()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl shadow-2xl">Confirm Record</button>
                    </div>`;
            } else if (currentTab === 'planning') {
                body.innerHTML = `
                    <input id="todo-text" placeholder="需要做什麼？" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                    <button onclick="submitTodo()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl shadow-2xl">Confirm</button>`;
            }
            lucide.createIcons();
        }

        function openEditScheduleModal(id) {
            const item = schedules.find(s => s.id === id);
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = "編輯行程詳情";
            modal.classList.remove('hidden');

            body.innerHTML = `
                <div class="space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <input id="edit-time" type="time" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none" value="${item.time}">
                        <input id="edit-city" value="${item.city}" placeholder="地點" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                    </div>
                    <input id="edit-title" value="${item.title}" placeholder="行程項目" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                    <input id="edit-note" value="${item.note || ''}" placeholder="短筆記 (顯示於卡片)" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                    <div>
                        <p class="text-[10px] font-black uppercase text-morandi mb-2 tracking-widest">Detailed Information / 詳細注意事項</p>
                        <textarea id="edit-details" rows="5" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none resize-none placeholder-gray-300" placeholder="在此輸入行程細節，例如月台位置、特殊門票需求、必點餐點等...">${item.details || ''}</textarea>
                    </div>
                    <input id="edit-map" value="${item.map || ''}" placeholder="Google Map 網址" class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none text-blue-500">
                    <button onclick="saveEditSchedule(${id})" class="w-full bg-dark-green text-white py-8 rounded-[3.5rem] font-black text-2xl uppercase tracking-[0.5em] shadow-2xl">Save Changes</button>
                </div>`;
            lucide.createIcons();
        }

        function submitSchedule() {
            const title = document.getElementById('add-title').value;
            if(!title) return;
            schedules.push({ id: Date.now(), date: currentActiveDay, time: document.getElementById('add-time').value, city: document.getElementById('add-city').value, title, cat: 'spot', done: false });
            closeModal(); render();
        }
        function saveEditSchedule(id) {
            const item = schedules.find(s => s.id === id);
            item.time = document.getElementById('edit-time').value;
            item.city = document.getElementById('edit-city').value;
            item.title = document.getElementById('edit-title').value;
            item.note = document.getElementById('edit-note').value;
            item.details = document.getElementById('edit-details').value;
            item.map = document.getElementById('edit-map').value;
            closeModal(); render();
        }
        function submitExpense() {
            const user = document.getElementById('ex-user').value;
            const title = document.getElementById('ex-title').value;
            const amount = parseFloat(document.getElementById('ex-amount').value);
            if(!title || isNaN(amount)) return;
            expenses.push({ id: Date.now(), title, amount, currency: document.getElementById('ex-currency').value, user });
            closeModal(); render();
        }
        function submitTodo() {
            const text = document.getElementById('todo-text').value;
            if(!text) return;
            todos.push({ id: Date.now(), text, done: false });
            closeModal(); render();
        }

        function openAddMemberModal() {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = "新增成員";
            document.getElementById('modal-body').innerHTML = `
                <div class="space-y-6">
                    <input id="new-member-name" placeholder="輸入名字..." class="w-full p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">
                    <button onclick="submitNewMember()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl">加入成員</button>
                </div>`;
            modal.classList.remove('hidden');
        }

        function submitNewMember() {
            const name = document.getElementById('new-member-name').value;
            if(!name || members.includes(name)) return;
            members.push(name);
            closeModal(); render();
        }

        // --- 5. 頁面切換與清單操作 ---

        function renderBooking(container) {
            container.innerHTML = `
                <div class="space-y-10 animate-fade-in pb-20 px-1">
                    <h2 class="text-4xl font-black text-dark-green px-2 flex items-center gap-4"><i data-lucide="layers" class="text-morandi"></i> 航班憑證</h2>
                    <div class="bg-white rounded-[3.5rem] shadow-2xl overflow-hidden border-b-[15px] border-[#AA1D24] mb-8">
                        <div class="bg-[#AA1D24] p-8 text-white flex justify-between items-center font-black italic uppercase">
                            <div><p class="text-xl tracking-tighter leading-none">阿聯酋 • 去程</p><p class="text-[10px] opacity-70 mt-1 uppercase">EK0387 / EK0087</p></div>
                            <div class="bg-black/20 px-4 py-2 rounded-2xl border border-white/20 text-sm">3/18 OK</div>
                        </div>
                        <div class="p-10 space-y-8 font-mono">
                            <div class="flex justify-between items-center border-b border-dashed pb-6">
                                <div class="text-center"><p class="text-4xl font-black">TPE</p><p class="text-sm text-morandi font-bold mt-1 uppercase">00:20</p></div>
                                <div class="flex flex-col items-center opacity-30 text-[10px] font-black"><i data-lucide="arrow-right"></i>9h 50m</div>
                                <div class="text-center opacity-40"><p class="text-4xl font-black">DXB</p><p class="text-sm mt-1 uppercase">06:10</p></div>
                            </div>
                            <div class="flex justify-between items-center">
                                <div class="text-center opacity-40"><p class="text-4xl font-black">DXB</p><p class="text-sm mt-1 uppercase">08:25</p></div>
                                <div class="flex flex-col items-center opacity-30 text-[10px] font-black"><i data-lucide="arrow-right"></i>7h 00m</div>
                                <div class="text-center"><p class="text-4xl font-black text-[#1C1912]">ZRH</p><p class="text-sm text-morandi font-bold mt-1 uppercase">12:25</p></div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-[3.5rem] shadow-2xl overflow-hidden border-b-[15px] border-dark-green">
                        <div class="bg-dark-green p-8 text-white flex justify-between items-center font-black italic uppercase">
                            <div><p class="text-xl tracking-tighter leading-none">阿聯酋 • 回程</p><p class="text-[10px] opacity-70 mt-1 uppercase">EK0088 / EK0366</p></div>
                            <div class="bg-white/10 px-4 py-2 rounded-2xl border border-white/10 text-sm font-mono uppercase">Confirmed</div>
                        </div>
                        <div class="p-10 space-y-8 font-mono">
                            <div class="flex justify-between items-center border-b border-dashed pb-6">
                                <div class="text-center text-[#1C1912]"><p class="text-4xl font-black">ZRH</p><p class="text-sm text-morandi font-bold mt-1 uppercase">15:30</p></div>
                                <div class="flex flex-col items-center opacity-30 text-[10px] font-black"><i data-lucide="arrow-right"></i>6h 15m</div>
                                <div class="text-center opacity-40"><p class="text-4xl font-black">DXB</p><p class="text-sm mt-1 uppercase">23:45</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderExpense(container) {
            const memberStats = {};
            let totalTWD = 0;
            members.forEach(m => memberStats[m] = 0);
            expenses.forEach(e => {
                const amtInTWD = e.currency === 'CHF' ? e.amount * RATE_CHF : e.amount;
                totalTWD += amtInTWD;
                if (memberStats[e.user] !== undefined) memberStats[e.user] += amtInTWD;
            });

            container.innerHTML = `
                <div class="space-y-8 animate-fade-in pb-20 px-2">
                    <div class="bg-gradient-to-br from-[#1C1912] to-[#4A4433] rounded-[3.5rem] p-10 text-white shadow-2xl relative overflow-hidden">
                        <p class="text-[12px] font-black uppercase text-morandi mb-4 tracking-[0.5em]">Swiss Budget Stats</p>
                        <h2 class="text-6xl font-black tracking-tighter mb-10 font-mono"><span class="text-2xl opacity-40">NT$</span> ${Math.round(totalTWD).toLocaleString()}</h2>
                        <div class="space-y-4 border-t border-white/10 pt-8">
                            <p class="text-[10px] font-black uppercase opacity-40 tracking-widest mb-2">成員支出統計 (台幣換算)</p>
                            ${members.map(m => `
                                <div class="flex justify-between items-center group">
                                    <span class="text-sm font-bold opacity-60">@${m}</span>
                                    <span class="text-xl font-black font-mono">NT$ ${Math.round(memberStats[m]).toLocaleString()}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="space-y-4">
                        ${expenses.map(e => `
                            <div class="bg-white rounded-[2.5rem] p-8 shadow-xl flex justify-between items-center border-[3px] border-[#4A4433] relative">
                                <div><p class="text-2xl font-black leading-tight">${e.title}</p><p class="text-[10px] font-black text-morandi uppercase mt-1">@${e.user}</p></div>
                                <div class="text-right flex items-center gap-6">
                                    <div class="font-mono text-right"><p class="text-2xl font-black text-morandi">${e.currency} ${e.amount}</p></div>
                                    <button onclick="deleteExpense(${e.id})" class="text-dark-green opacity-20 hover:opacity-100 transition-all"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderPlanning(container) {
            container.innerHTML = `
                <div class="space-y-12 animate-fade-in pb-20 px-2">
                    <div class="bg-white/40 rounded-[3rem] p-8 border-2 border-white shadow-inner">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-black tracking-widest text-morandi uppercase flex items-center gap-2"><i data-lucide="users"></i> 成員管理</h3>
                            <button onclick="openAddMemberModal()" class="bg-morandi text-white px-4 py-2 rounded-xl font-black text-xs shadow-lg active:scale-90 transition-all">+ 新增</button>
                        </div>
                        <div class="grid grid-cols-1 gap-3">
                            ${members.map((m, idx) => `
                                <div class="bg-white p-4 rounded-2xl border-2 border-black/5 flex justify-between items-center group">
                                    <input type="text" onchange="updateMemberName(${idx}, this.value)" class="font-black text-sm bg-transparent outline-none flex-1 border-none focus:text-morandi" value="${m}">
                                    ${m !== APP_USER ? `<button onclick="removeMember(${idx})" class="text-dark-green opacity-20 hover:opacity-100 p-2"><i data-lucide="x" class="w-4 h-4"></i></button>` : '<span class="text-[8px] font-black uppercase text-morandi opacity-40">Owner</span>'}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="space-y-6">
                        <h2 class="text-3xl font-black px-2 flex items-center gap-4 text-dark-green">準備清單</h2>
                        ${todos.map(t => `
                            <div onclick="toggleTodo(${t.id})" class="bg-white rounded-[2.5rem] p-8 flex items-center gap-6 shadow-xl border-[3px] transition-all ${t.done ? 'opacity-40 grayscale border-transparent bg-gray-50' : 'border-[#4A4433] active:scale-95'}">
                                <div class="w-12 h-12 rounded-2xl flex items-center justify-center border-4 ${t.done ? 'bg-green-500 border-green-500 text-white shadow-lg' : 'border-gray-200'}">
                                    ${t.done ? '<i data-lucide="check" class="w-8 h-8 stroke-[4px]"></i>' : ''}
                                </div>
                                <span class="text-2xl font-black flex-1 ${t.done ? 'line-through text-gray-400' : 'text-[#1C1912]'}">${t.text}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderChat(container) {
            container.innerHTML = `
                <div class="flex flex-col h-[70vh] animate-fade-in px-2">
                    <h2 class="text-4xl font-black mb-8 px-2 tracking-tighter text-dark-green">成員共享日記</h2>
                    <div class="flex-1 overflow-y-auto space-y-6 px-2 mb-4 no-scrollbar">
                        ${chatMessages.map(m => `
                            <div class="flex flex-col ${m.user === APP_USER ? 'items-end' : 'items-start'}">
                                <div class="flex items-center gap-2 mb-1 px-2"><span class="text-[10px] font-black uppercase opacity-40">@${m.user}</span><span class="text-[9px] font-mono opacity-20">${m.time}</span></div>
                                <div class="${m.user === APP_USER ? 'chat-bubble-me' : 'bg-white border-[3px] border-[#4A4433] p-5 font-bold max-w-[85%] text-lg shadow-sm'}" style="${m.user !== APP_USER ? 'border-radius: 1.5rem; border-bottom-left-radius: 0.2rem;' : ''}">${m.text}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="bg-white rounded-[2.5rem] p-4 border-[3px] border-[#1C1912] shadow-2xl flex items-center gap-3">
                        <input id="chat-input" class="flex-1 bg-transparent border-none outline-none font-bold px-4 h-12" placeholder="記下今天的心情點滴...">
                        <button onclick="sendChat()" class="bg-morandi text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-90"><i data-lucide="send" class="w-5 h-5"></i></button>
                    </div>
                </div>
            `;
        }

        // --- 6. 全域輔助函數 ---
        function saveAppTitle(val) { appMainTitle = val; render(); }
        function saveDailyTitle(val) { if(!dailyMetadata[currentActiveDay]) dailyMetadata[currentActiveDay] = {}; dailyMetadata[currentActiveDay].title = val; }
        function selectDay(dayId) { currentActiveDay = dayId; render(); }
        function switchTab(tabId) { currentTab = tabId; render(); }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
        function getCatColor(cat) { return { spot: 'bg-[#A7B09E]', transport: 'bg-[#9BAEBC]', hotel: 'bg-[#E0D8C3]', flight: 'bg-dark-green' }[cat] || 'bg-gray-300'; }

        function toggleSchedule(id) { const s = schedules.find(x => x.id === id); if(s) s.done = !s.done; render(); }
        function deleteSchedule(id) { schedules = schedules.filter(s => s.id !== id); render(); }
        function deleteExpense(id) { expenses = expenses.filter(e => e.id !== id); render(); }
        function toggleTodo(id) { const t = todos.find(x => x.id === id); if(t) t.done = !t.done; render(); }
        function removeMember(idx) { members.splice(idx, 1); render(); }
        function updateMemberName(idx, val) { if(val) members[idx] = val; render(); }
        function sendChat() {
            const input = document.getElementById('chat-input');
            if(!input.value) return;
            chatMessages.push({ user: APP_USER, text: input.value, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), isMe: true });
            input.value = ''; render();
        }

        function openSwapModal() {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = "天數行程整日對調";
            document.getElementById('modal-body').innerHTML = `
                <div class="flex flex-col gap-6">
                    <select id="swap-1" class="p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">${SWISS_DAYS.map(d => `<option value="${d.id}">${d.label} (${d.date})</option>`).join('')}</select>
                    <div class="text-center text-morandi font-black text-3xl italic tracking-widest">⇅ VS ⇅</div>
                    <select id="swap-2" class="p-6 rounded-3xl border-4 border-gray-100 font-black outline-none">${SWISS_DAYS.map(d => `<option value="${d.id}">${d.label} (${d.date})</option>`).join('')}</select>
                    <button onclick="confirmSwap()" class="w-full bg-morandi text-white py-8 rounded-[3.5rem] font-black text-2xl shadow-xl active:scale-95 transition-all">Confirm Swap</button>
                </div>`;
            modal.classList.remove('hidden');
        }

        function confirmSwap() {
            const d1 = document.getElementById('swap-1').value;
            const d2 = document.getElementById('swap-2').value;
            schedules.forEach(s => {
                if (s.date === d1) s.date = "TEMP";
                else if (s.date === d2) s.date = d1;
            });
            schedules.forEach(s => { if(s.date === "TEMP") s.date = d2; });
            closeModal(); render();
        }

        window.onload = render;
    </script>
</body>
</html>
